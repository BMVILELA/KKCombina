<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Bingo Halloween NOS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Rubik:wght@400;600;800;900&display=swap">
<style>
:root{color-scheme:dark;--fd:'Creepster','Rubik',system-ui,sans-serif;--fb:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;--bg:#09060f;--p:#151020;--p2:#1f172e;--ln:#2f2546;--tx:#f7f2ff;--mu:#a99dc0;--or:#ff7a1a;--or2:#ffb347;--gr:#2bd27a;--rd:#ff4d5e;--yl:#ffd23f;--pu:#9b3dff;--lime:#b5ff2a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:var(--fb);-webkit-text-size-adjust:100%;overflow-x:clip}
body{background:radial-gradient(1000px 600px at 85% -10%,rgba(154,91,255,.22),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(255,122,26,.16),transparent 60%),var(--bg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--ln);background:var(--p2);border-radius:14px;min-height:46px;padding:0 16px;font-weight:700;transition:transform .1s,filter .1s}
button:hover:not(:disabled){filter:brightness(1.15)}button:active:not(:disabled){transform:scale(.97)}button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--or2);outline-offset:2px}
input,select,textarea{background:#0e0a17;border:1px solid var(--ln);border-radius:12px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:64px;resize:vertical}
h1,h2,h3,p{margin:0}
.mu{color:var(--mu)}
.or{background:linear-gradient(135deg,var(--or),#ff4d1a);border-color:transparent;color:#1a0900}
.gr{background:var(--gr);border-color:transparent;color:#03180c}
.ghost{background:transparent}
.danger{background:transparent;border-color:rgba(255,77,94,.55);color:#ff9aa4}
.big{min-height:62px;font-size:1.15rem;padding:0 26px;border-radius:18px}
.title{font-weight:900;letter-spacing:.02em;background:linear-gradient(90deg,#b46bff,#ff8a1f 55%,#b5ff2a);-webkit-background-clip:text;background-clip:text;color:transparent}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
/* decoração */
.deco{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bat{position:absolute;width:64px;opacity:.75;animation:fly linear infinite}
.bat svg{width:100%;animation:flap .25s ease-in-out infinite alternate;transform-origin:50% 60%}
@keyframes flap{to{transform:scaleY(.55)}}
@keyframes fly{0%{transform:translate(-120px,0) }25%{transform:translate(25vw,-40px)}50%{transform:translate(50vw,20px)}75%{transform:translate(75vw,-30px)}100%{transform:translate(calc(100vw + 120px),10px)}}
.ghost-deco{position:absolute;width:70px;opacity:.16;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-18px)}}
.pump-deco{position:absolute;bottom:-6px;width:90px;opacity:.9}
#app{position:relative;z-index:1}
.wrap{max-width:1240px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.display{font-family:var(--fd);font-weight:400;letter-spacing:.04em}
.card{background:linear-gradient(180deg,var(--p),#100b18);border:1px solid var(--ln);border-radius:20px;padding:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ln);border-radius:999px;padding:4px 10px;font-size:.78rem;font-weight:700;color:var(--mu)}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--mu)}
.pill.on i{background:var(--gr);box-shadow:0 0 8px var(--gr)}
.logo img{height:40px;border-radius:6px;display:block}
/* setup */
.steps{display:grid;gap:16px}
.step h2{font-size:1.15rem;display:flex;gap:10px;align-items:center;margin-bottom:14px}
.num{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--or);color:#1a0900;font-weight:900;flex:none}
.teamrow{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.swatch{width:44px;height:44px;border-radius:12px;border:2px solid rgba(255,255,255,.25);padding:0}
.palette{display:flex;gap:6px;flex-wrap:wrap;margin:-2px 0 10px 52px}
.palette button{width:30px;height:30px;min-height:0;border-radius:50%;padding:0;border:2px solid transparent}
.palette button.sel{border-color:#fff}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:14px;overflow:hidden}
.seg button{border:0;border-radius:0;background:transparent;min-height:44px}
.seg button.on{background:var(--or);color:#1a0900}
.chl{display:grid;gap:8px;margin-top:12px}
.chi{display:grid;grid-template-columns:36px 150px 80px 1fr;gap:8px;align-items:start;padding:10px;border-radius:14px;background:#0e0a17;border:1px solid var(--ln)}
.chi .n{font-weight:900;color:var(--or2);font-size:1.2rem;padding-top:8px;text-align:center}
.chi .txt{display:grid;gap:6px}
@media(max-width:760px){.chi{grid-template-columns:36px 1fr 80px}.chi .txt{grid-column:1/-1}}
details summary{cursor:pointer;font-weight:800;color:var(--or2);padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
.note{font-size:.88rem;color:var(--mu);line-height:1.45}
/* cartelas */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:12px}
@media(max-width:600px){.cards{grid-template-columns:1fr 1fr;gap:8px}.bcard{padding:7px}.bgrid{gap:3px}.bc{border-radius:7px}.bc .n{font-size:1rem}.bhead b{font-size:.85rem}.dockin{gap:6px}.dockin>button{min-height:42px;padding:0 12px}.dockin .big{min-height:52px;font-size:1rem}.res b{font-size:.85rem}}
.bcard{border-radius:18px;padding:10px;background:#0e0a17;border:2px solid var(--tc);box-shadow:0 0 0 1px rgba(0,0,0,.4),0 8px 30px -12px var(--tc);position:relative}
.bcard.play{animation:glow 1.2s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 1px rgba(0,0,0,.4),0 0 34px -2px var(--tc)}}
.bhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bhead b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:1.02rem;color:var(--tc)}
.bhead .sc{font-weight:900;font-size:1.25rem}
.bhead .ln{font-size:.7rem;font-weight:900;background:var(--tc);color:#120a00;border-radius:999px;padding:2px 8px}
.bgrid{display:grid;gap:5px}
.bc{aspect-ratio:1;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--p2);border:1px solid var(--ln);position:relative;overflow:hidden}
.bc .n{font-weight:900;font-size:clamp(1rem,2.2vw,1.7rem);line-height:1}
.bc .ic{font-size:clamp(.7rem,1.1vw,.95rem);opacity:.8;margin-top:3px;line-height:1}
.bc.ok{background:var(--tc);border-color:transparent;color:#120a00}
.bc.ok::after{content:"✓";position:absolute;top:3px;right:5px;font-size:.75rem;font-weight:900;color:#120a00}
.bc.ok .ic{opacity:1}
.bc.fail{opacity:.35}
.bc.fail .n{text-decoration:line-through}
.bc.cur{outline:3px solid #fff;outline-offset:-3px;animation:curp .8s ease-in-out infinite alternate}
@keyframes curp{to{transform:scale(1.07)}}
/* palco */
.stage{display:grid;grid-template-columns:minmax(300px,.85fr) 1.15fr;gap:18px;align-items:start}
@media(max-width:900px){.stage{grid-template-columns:1fr}}
.globebox{position:relative;aspect-ratio:1;width:100%;max-width:520px;margin:0 auto}
.globebox canvas{width:100%;height:100%;display:block}
.globebox .pump{position:absolute;width:24%;bottom:-2%;}
.reveal{margin-top:14px;text-align:center}
.ball{width:clamp(110px,16vw,170px);aspect-ratio:1;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-weight:900;font-size:clamp(3rem,7vw,5rem);color:#2a1000;background:radial-gradient(circle at 35% 30%,#ffd29a,#ff8a1f 45%,#c94a00 80%);box-shadow:inset -10px -14px 30px rgba(0,0,0,.35),0 0 50px rgba(255,122,26,.55);position:relative;animation:popball .7s cubic-bezier(.2,1.6,.4,1)}
.ball.still{animation:none}
.ball::before{content:"";position:absolute;top:-9%;left:46%;width:9%;height:16%;background:#3a7d2c;border-radius:4px;transform:rotate(12deg)}
@keyframes popball{0%{transform:scale(.1) rotate(-200deg);opacity:0}100%{transform:none;opacity:1}}
.typ{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 14px;font-weight:900;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;margin-top:14px;background:var(--tyc);color:#140a00}
.chtitle{font-size:clamp(1.3rem,2.6vw,2.1rem);font-weight:900;margin-top:8px}
.chtext{font-size:clamp(1rem,1.7vw,1.35rem);line-height:1.4;margin-top:8px;color:#eadfff}
.vol{font-size:.85rem;color:#cdb6ff;margin-top:6px}
.ans{margin-top:10px;font-size:clamp(1.1rem,2vw,1.6rem);font-weight:900;color:var(--gr)}
.players{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 14px;font-weight:900;background:var(--tc);color:#120a00}
.chip.fail{opacity:.35;text-decoration:line-through}
.rtimer{font-variant-numeric:tabular-nums;font-weight:900;font-size:clamp(2.2rem,5vw,3.6rem);margin-top:10px}
.rtimer.c{color:var(--rd);animation:pul 1s infinite}
@keyframes pul{50%{opacity:.5}}
.spinning{font-size:clamp(1.4rem,3vw,2.4rem);font-weight:900;color:var(--or2);letter-spacing:.12em;animation:pul .8s infinite;padding:30px 0}
.waiting{color:var(--mu);font-size:1.05rem;padding:24px 0}
.drawn{display:flex;gap:5px;flex-wrap:wrap;margin-top:12px}
.drawn button,.drawn span{min-height:0;width:30px;height:30px;padding:0;border-radius:50%;display:inline-grid;place-items:center;font-size:.78rem;font-weight:900;background:#2a1c3c;border:1px solid var(--ln)}
.score{display:grid;gap:6px;margin-top:14px}
.srow{display:grid;grid-template-columns:28px 14px 1fr auto auto;gap:10px;align-items:center;padding:8px 12px;border-radius:12px;background:var(--p);border:1px solid var(--ln);font-size:1.02rem}
.srow .dot{width:14px;height:14px;border-radius:50%;background:var(--tc)}
.srow .pos{font-weight:900;color:var(--or2)}
.srow .pts{font-weight:900;font-size:1.2rem;font-variant-numeric:tabular-nums}
.srow small{color:var(--mu)}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.head h1{font-size:clamp(1.3rem,2.6vw,2rem)}
/* dock moderador */
.dock{position:sticky;bottom:0;z-index:30;background:rgba(12,8,20,.96);backdrop-filter:blur(8px);border-top:1px solid var(--ln);margin-top:18px}
.dockin{max-width:1240px;margin:0 auto;padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.res{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:4px 6px 4px 12px;border-radius:14px;background:#0e0a17;border:1px solid var(--tc)}
.res b{color:var(--tc);margin-right:2px}
.res button{min-height:40px;padding:0 12px}
.res button.on.y{background:var(--gr);color:#03180c;border-color:transparent}
.res button.on.n{background:var(--rd);color:#2a0006;border-color:transparent}
.privans{font-size:.9rem;color:var(--gr);font-weight:800}
/* modal */
.ov{position:fixed;inset:0;background:rgba(5,2,10,.8);z-index:60;display:grid;place-items:center;padding:14px}
.mbox{background:var(--p);border:1px solid var(--ln);border-radius:20px;padding:22px;width:min(480px,100%);max-height:92vh;overflow:auto}
.mbox h3{font-size:1.25rem;margin-bottom:8px}
.mbox .row{margin-top:16px}.mbox .row>button{flex:1}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:95;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,520px)}
.t{background:#241a38;border:1px solid var(--ln);border-radius:14px;padding:12px 18px;font-weight:800;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:tin .25s}
.t.ok{border-color:var(--gr)}.t.er{border-color:var(--rd)}
@keyframes tin{from{transform:translateY(-10px);opacity:0}}
.banner{position:fixed;inset:0;z-index:70;display:grid;place-items:center;pointer-events:none}
@keyframes bn{0%{transform:scale(.2);opacity:0}15%{transform:scale(1.1);opacity:1}25%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.05)}}
/* tv */
.tv .wrap{max-width:none;padding-block:clamp(12px,1.8vw,28px);padding-left:max(clamp(16px,1.8vw,28px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,1.8vw,28px),env(safe-area-inset-right,0px))}
.tv .stage{grid-template-columns:minmax(280px,.8fr) 1.2fr}
.tvcorner{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:calc(8px + env(safe-area-inset-right,0px));z-index:50;display:flex;gap:6px;opacity:.3}
.tvcorner:hover{opacity:1}
.tvcorner button{min-height:34px;font-size:.78rem;padding:0 10px;background:rgba(0,0,0,.5)}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:18px}
.podium{display:flex;gap:12px;align-items:flex-end;justify-content:center;width:100%;max-width:860px}
.pod{flex:1;border-radius:18px 18px 0 0;padding:14px 8px;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 40%,transparent),var(--p));border:2px solid var(--tc);animation:tin .6s backwards}
.pod .nm{font-weight:900;font-size:clamp(1rem,2.4vw,2rem);overflow:hidden;text-overflow:ellipsis}
.pod .s{font-weight:900;font-size:clamp(1.6rem,4vw,3.6rem)}
.pod.g{height:clamp(190px,32vh,330px)}.pod.s2{height:clamp(150px,25vh,260px)}.pod.s3{height:clamp(120px,20vh,210px)}
.tie{border:2px solid var(--yl);border-radius:18px;padding:18px;background:rgba(255,210,63,.08);max-width:700px}
/* equipa (telemóvel) */
.team .wrap{max-width:560px}
.thead{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:20px;background:linear-gradient(135deg,color-mix(in srgb,var(--tc) 30%,transparent),var(--p));border:2px solid var(--tc);margin-bottom:14px}
.thead h1{font-size:1.6rem;color:var(--tc);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.thead .pts{text-align:right;font-weight:900;font-size:2rem;line-height:1}
.thead .pts small{display:block;font-size:.75rem;color:var(--mu);font-weight:700}
.tcard .bcard{padding:14px}.tcard .bhead{display:none}.tcard .bgrid{gap:8px}.tcard .bc{border-radius:14px}.tcard .bc .n{font-size:clamp(1.8rem,9vw,2.6rem)}.tcard .bc .ic{font-size:1.1rem}
.yours{margin-top:12px;padding:12px;border-radius:16px;font-weight:900;font-size:1.3rem;letter-spacing:.06em;background:var(--tc);color:#120a00;animation:curp .6s ease-in-out infinite alternate}
.notyours{margin-top:12px;color:var(--mu);font-weight:700}
.spinball{width:110px;aspect-ratio:1;border-radius:50%;margin:10px auto;background:radial-gradient(circle at 35% 30%,#ffd29a,#ff8a1f 45%,#c94a00 80%);animation:spinb .5s linear infinite}
@keyframes spinb{to{transform:rotate(360deg) translateX(4px)}}
.tvscore .srow{font-size:clamp(1.1rem,2.2vw,2rem);padding:clamp(10px,1.2vw,18px) clamp(14px,1.6vw,24px);grid-template-columns:clamp(40px,4vw,64px) clamp(14px,1.4vw,22px) 1fr auto auto}
.tvscore .srow .dot{width:clamp(14px,1.4vw,22px);height:clamp(14px,1.4vw,22px)}
.tvscore .srow .pts{font-size:1.4em}
.links{display:grid;gap:12px;margin-top:12px}
.lrow{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border-radius:16px;background:#0e0a17;border:2px solid var(--tc)}
.lrow .qr{width:120px;height:120px;background:#fff;border-radius:10px;padding:6px;display:grid;place-items:center}
.lrow .qr svg,.lrow .qr img{width:100%;height:100%}
.lrow b{color:var(--tc);font-size:1.1rem}
.lrow code{display:block;font-size:.72rem;color:var(--mu);word-break:break-all;margin:6px 0;user-select:all}
@media(max-width:480px){.lrow{grid-template-columns:1fr}.lrow .qr{margin:0 auto;width:160px;height:160px}}
.chi{grid-template-columns:36px 170px 1fr}
@media(max-width:760px){.chi{grid-template-columns:36px 1fr}}
.chi.out{opacity:.5}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
.rules>div{display:grid;gap:6px}
.prog{display:block;height:6px;border-radius:99px;background:#2a1f3d;margin-top:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--tc);border-radius:99px;transition:width .5s}
.srow .nm{min-width:0}
.srow .pts small{font-size:.6em;color:var(--mu)}
.bingo-tag{font-size:.7rem;background:var(--tc);color:#120a00;border-radius:99px;padding:2px 8px;letter-spacing:.06em}
.turn{margin-top:14px;font-weight:800;font-size:clamp(1rem,1.8vw,1.4rem);color:var(--mu)}
.turn b{color:var(--tc);font-size:1.15em}
.pickmsg{text-align:center;margin:0 0 12px;color:var(--mu);font-weight:700}
.pickmsg.ok{color:var(--gr);font-size:1.1rem;margin-top:12px}
.pickbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.legend{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:10px;color:var(--mu);font-size:.9rem}
.pst{font-size:.72rem;font-weight:800;border-radius:99px;padding:2px 8px;border:1px solid var(--ln);color:var(--mu);white-space:nowrap}
.pst.locked{background:var(--gr);color:#03180c;border-color:transparent}
.pst.picking{color:var(--yl);border-color:rgba(255,210,63,.5)}
.bhead .pst:empty{display:none}
.lbl{font-size:clamp(1rem,1.8vw,1.5rem);letter-spacing:.14em;color:var(--or2);margin-bottom:4px}
.drawn .back{border-style:dashed;opacity:.6}
.chip.wait{opacity:.45}
.spinbtn:not(.or){background:var(--tc);color:#120a00;border-color:transparent}
.spinbtn.or{background:var(--tc);color:#120a00}
.globebox{max-width:min(520px,46vh)}
.tv .globebox{max-width:min(600px,62vh)}
.tvnow{background:linear-gradient(135deg,rgba(154,91,255,.16),rgba(255,122,26,.12));border:1px solid var(--ln);border-radius:24px;padding:clamp(12px,1.6vw,24px);margin-bottom:16px}
.tvnow .reveal{margin-top:0}
.tvnow .ball{width:clamp(100px,11vw,150px);font-size:clamp(2.6rem,5vw,4.2rem)}
.tv .tvscore .srow{font-size:clamp(1rem,1.7vw,1.6rem);padding:clamp(8px,.9vw,14px) clamp(12px,1.4vw,20px)}
.tv .score{gap:5px;margin-top:6px}

/* ===== visual premium ===== */
.globebox{aspect-ratio:1/1.02}
.globebox .pump{filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
/* bolas de bingo */
.bball{--sz:64px;width:var(--sz);height:var(--sz);border-radius:50%;flex:none;display:grid;place-items:center;position:relative;
background:radial-gradient(circle at 34% 28%,color-mix(in srgb,var(--bc) 35%,#fff) 0,var(--bc) 42%,color-mix(in srgb,var(--bc) 45%,#000) 100%);
box-shadow:inset -4px -6px 12px rgba(0,0,0,.35),inset 3px 4px 8px rgba(255,255,255,.25),0 8px 18px -6px rgba(0,0,0,.7)}
.bball::after{content:"";position:absolute;left:16%;top:10%;width:30%;height:18%;border-radius:50%;background:rgba(255,255,255,.65);transform:rotate(-30deg);filter:blur(.5px)}
.bball .disc{width:62%;height:62%;border-radius:50%;background:radial-gradient(circle at 45% 40%,#fff,#e6dcf2);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:inset 0 -2px 4px rgba(0,0,0,.15);line-height:1}
.bball .disc i{font-style:normal;font-size:calc(var(--sz)*.16);margin-bottom:1px}
.bball .disc b{font-weight:900;color:#1d1030;font-size:calc(var(--sz)*.3);font-variant-numeric:tabular-nums}
.bball.q{--bc:#4a3a63}.bball.q .disc b{font-size:calc(var(--sz)*.38);color:#6b5a85}
.bball.hero{--sz:clamp(120px,15vw,180px);margin:0 auto}
.bball.hero.sm{--sz:104px}
.bball.pop{animation:popball .8s cubic-bezier(.2,1.6,.4,1)}
.rayhold{position:relative;display:grid;place-items:center;padding:8px 0}
.rayhold.fresh::before{content:"";position:absolute;width:min(340px,80%);aspect-ratio:1;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,190,90,.28) 0 10deg,transparent 10deg 24deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:spinr 6s linear infinite,fadein .6s}
@keyframes spinr{to{transform:rotate(360deg)}}@keyframes fadein{from{opacity:0}}
/* faixa de últimas bolas */
.rail{display:flex;align-items:center;gap:clamp(6px,1vw,12px);padding:10px 16px;margin:0 auto 16px;width:fit-content;max-width:100%;overflow-x:auto;border-radius:999px;
background:linear-gradient(180deg,rgba(40,24,64,.95),rgba(18,10,30,.95));border:2px solid rgba(255,160,70,.45);box-shadow:inset 0 2px 0 rgba(255,255,255,.08),0 10px 30px -10px rgba(0,0,0,.8)}
.rail .bball{--sz:clamp(40px,4.4vw,58px)}
.rail .bball.r0{--sz:clamp(56px,6vw,80px);box-shadow:inset -4px -6px 12px rgba(0,0,0,.35),0 0 0 3px #ffd23f,0 0 26px rgba(255,190,60,.7)}
.rail .bball.r4,.rail .bball.r5,.rail .bball.r6{opacity:.55}
/* cartelas tipo papel */
.bcard{background:linear-gradient(180deg,#2a1a40,#170e25);border:none;padding:0;overflow:hidden;box-shadow:0 0 0 3px var(--tc),0 14px 30px -12px rgba(0,0,0,.8)}
.bcard.play{animation:glow2 1s ease-in-out infinite alternate}
@keyframes glow2{to{box-shadow:0 0 0 3px var(--tc),0 0 36px 2px var(--tc)}}
.bhead{margin:0;padding:8px 12px;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 75%,#fff),var(--tc) 55%,color-mix(in srgb,var(--tc) 70%,#000));box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.bhead b{color:var(--tt);text-shadow:none}
.bhead .sc{color:var(--tt)}
.bhead .ln{background:#1a1022;color:#ffd23f}
.bgrid{padding:8px;gap:6px}
.bc{background:linear-gradient(180deg,#fbf4e6,#eadcc2);border:none;border-radius:10px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.12),0 2px 0 rgba(0,0,0,.35);color:#2a1638}
.bc .n{position:relative;z-index:1;color:#2a1638}
.bc .ic{position:absolute;top:3px;right:4px;margin:0;font-size:clamp(.55rem,.9vw,.75rem);z-index:1}
.bc::before{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--ty);opacity:.85}
.bc.ok{background:linear-gradient(180deg,#fbf4e6,#eadcc2)}
.bc.ok::before{left:10%;top:10%;right:10%;bottom:10%;height:auto;border-radius:50%;opacity:1;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--tc) 40%,#fff),var(--tc) 50%,color-mix(in srgb,var(--tc) 55%,#000));box-shadow:0 3px 6px rgba(0,0,0,.35);animation:daub .35s cubic-bezier(.2,1.6,.4,1)}
@keyframes daub{from{transform:scale(.2);opacity:0}}
.bc.ok .n{color:var(--tt);text-shadow:0 1px 2px rgba(0,0,0,.35)}
.bc.ok::after{content:none}
.bc.cur{outline:none;box-shadow:0 0 0 3px #ffd23f,0 0 18px #ffb347;animation:curp .7s ease-in-out infinite alternate}
.tcard .bcard{padding:0}.tcard .bgrid{padding:12px;gap:10px}
/* botões com relevo */
.big,.or,.gr,.spinbtn{box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 0 rgba(0,0,0,.18),0 5px 0 rgba(0,0,0,.4),0 12px 24px -10px rgba(0,0,0,.7);text-shadow:0 1px 0 rgba(255,255,255,.2)}
.big:active:not(:disabled),.or:active:not(:disabled),.spinbtn:active:not(:disabled){transform:translateY(3px);box-shadow:inset 0 2px 0 rgba(255,255,255,.3),0 2px 0 rgba(0,0,0,.4)}
.or{background:linear-gradient(180deg,#ffb15c,#ff7a1a 50%,#e2520a)}
.spinbtn,.spinbtn.or{background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 65%,#fff),var(--tc) 50%,color-mix(in srgb,var(--tc) 70%,#000));color:var(--tt,#120a00);font-size:1.25rem;min-height:66px;padding:0 30px;border-radius:20px;letter-spacing:.02em}
/* celebração */
.banner{background:radial-gradient(circle,rgba(30,10,50,.88),rgba(8,3,16,.9) 75%);animation:bfade var(--bd,3s) ease forwards}
@keyframes bfade{0%{opacity:0}8%{opacity:1}85%{opacity:1}100%{opacity:0}}
.bwrap{position:relative;display:grid;place-items:center;animation:bn var(--bd,3s) ease forwards;text-align:center}
.bwrap .rays{position:absolute;width:min(110vw,1100px);aspect-ratio:1;background:repeating-conic-gradient(rgba(255,200,90,.22) 0 9deg,transparent 9deg 20deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%);animation:spinr 8s linear infinite}
.bwrap .trophy{width:clamp(110px,16vw,200px);position:relative;filter:drop-shadow(0 10px 20px rgba(0,0,0,.6)) drop-shadow(0 0 30px rgba(255,140,40,.6));margin-bottom:-.3em}
.bwrap .btext{position:relative;font-family:var(--fb);font-weight:900;font-size:clamp(4rem,15vw,12rem);line-height:1;letter-spacing:.02em;background:linear-gradient(180deg,#fff6b0 0%,#ffd23f 40%,#ff8a1f 75%,#d4540a);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:clamp(3px,.5vw,7px) #2a0f45;paint-order:stroke fill;filter:drop-shadow(0 6px 0 #1a0830) drop-shadow(0 0 30px rgba(255,170,60,.6))}
.bwrap .bsub{position:relative;margin-top:10px;font-weight:900;font-size:clamp(1rem,2.6vw,2rem);letter-spacing:.06em;color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 70%,#fff),var(--tc));color:var(--tt,#120a00);padding:.3em 1.2em;border-radius:999px;box-shadow:0 6px 0 rgba(0,0,0,.4)}

/* logo do evento */
.elogo{-webkit-mask-image:linear-gradient(90deg,#000 86%,transparent 99%);mask-image:linear-gradient(90deg,#000 86%,transparent 99%);display:block;height:58px;width:auto;max-width:100%;filter:drop-shadow(0 6px 14px rgba(0,0,0,.55))}
.elogo.lg{height:clamp(80px,12vw,130px)}
.elogo.hero{height:auto;width:min(1000px,88vw);max-height:56vh;object-fit:contain;filter:drop-shadow(0 18px 40px rgba(0,0,0,.6)) drop-shadow(0 0 40px rgba(155,61,255,.35));animation:logoin 1.2s cubic-bezier(.2,1.4,.4,1),float 6s ease-in-out 1.2s infinite}
.elogo.fin{height:auto;width:min(520px,70vw);margin-top:6px}
.elogo.team{height:auto;width:min(240px,62vw)}
.tv .head .elogo{height:clamp(56px,6.5vw,90px)}
@keyframes logoin{from{transform:scale(.6) translateY(30px);opacity:0}}
body{background:radial-gradient(1000px 600px at 85% -10%,rgba(155,61,255,.26),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(255,122,26,.18),transparent 60%),radial-gradient(700px 500px at 50% 120%,rgba(181,255,42,.07),transparent 60%),var(--bg);background-attachment:fixed}
.num{background:linear-gradient(180deg,#c48bff,#9b3dff);color:#fff}
.rail{border-color:rgba(181,255,42,.35)}

/* ===== layout néon SONOS ===== */
:root{--bg:#070512;--lime:#b5ff2a;--npink:#ff3fd2;--npur:#a14dff;--ncyan:#2ee6ff}
body{background:radial-gradient(1200px 700px at 70% -20%,rgba(161,77,255,.35),transparent 60%),radial-gradient(900px 600px at 0% 100%,rgba(255,110,30,.22),transparent 60%),radial-gradient(800px 500px at 100% 100%,rgba(255,63,210,.14),transparent 60%),linear-gradient(180deg,#0b0620,#070512 60%,#0a0414);background-attachment:fixed}
/* cenário */
.deco .moon{position:absolute;right:12vw;top:6vh;width:clamp(90px,12vw,180px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff6e0,#ffd9a0 45%,#f2a65a 75%,rgba(242,166,90,0) 76%);box-shadow:0 0 80px 20px rgba(255,200,140,.25);opacity:.85}
.deco .house{position:absolute;left:0;bottom:0;width:min(46vw,620px);opacity:.95}
.deco .house svg{display:block;width:100%;filter:drop-shadow(0 0 18px rgba(161,77,255,.35))}
.deco .fog{position:absolute;left:-20%;right:-20%;bottom:-6vh;height:28vh;background:radial-gradient(ellipse at 30% 60%,rgba(170,120,255,.28),transparent 60%),radial-gradient(ellipse at 75% 70%,rgba(255,120,220,.18),transparent 60%);filter:blur(18px);animation:fogm 26s ease-in-out infinite alternate}
.deco .fog.f2{bottom:-10vh;opacity:.7;animation-duration:34s;animation-direction:alternate-reverse}
@keyframes fogm{to{transform:translateX(8%)}}
.deco .web{position:absolute;top:0;width:clamp(120px,16vw,240px);opacity:.8}
.deco .web.wl{left:0}.deco .web.wr{right:0;transform:scaleX(-1)}
.deco .pk{position:absolute;bottom:1vh;width:clamp(70px,9vw,130px);filter:drop-shadow(0 0 24px rgba(255,120,20,.7))}
.deco .pk.pkl{left:2vw}.deco .pk.pkr{right:2vw;width:clamp(60px,7vw,110px)}
.team .deco .house,.team .deco .web{opacity:.35}
/* painéis néon */
.card{background:linear-gradient(180deg,rgba(24,13,44,.9),rgba(10,6,22,.92)) padding-box,linear-gradient(135deg,rgba(161,77,255,.85),rgba(181,255,42,.45)) border-box;border:1.5px solid transparent;box-shadow:0 0 30px -14px rgba(161,77,255,.8)}
.npanel{--c1:var(--lime);--c2:var(--npur);position:relative;border-radius:22px;padding:clamp(14px,1.4vw,22px);background:linear-gradient(180deg,rgba(24,13,44,.9),rgba(10,6,22,.94)) padding-box,linear-gradient(135deg,var(--c1),var(--c2)) border-box;border:2px solid transparent;box-shadow:0 0 30px -8px var(--c1),inset 0 0 40px -24px var(--c2)}
.n-lime{--c1:#b5ff2a;--c2:#4dffa0}.n-pink{--c1:#ff3fd2;--c2:#a14dff}.n-pur{--c1:#a14dff;--c2:#2ee6ff}.n-or{--c1:#ff8a1f;--c2:#ff3fd2}
.npanel h3{display:flex;align-items:center;gap:10px;font-size:clamp(1rem,1.4vw,1.35rem);letter-spacing:.06em;text-transform:uppercase;font-weight:900;margin-bottom:12px}
.live{margin-left:auto;color:var(--npink);font-size:.85em;animation:pul 1.4s infinite}
/* ranking */
.rrows{display:grid;gap:6px}
.rrow{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 12px;border-radius:14px;background:rgba(255,255,255,.03)}
.rrow.first{background:linear-gradient(90deg,rgba(181,255,42,.38),rgba(181,255,42,.06));box-shadow:inset 0 0 0 1px rgba(181,255,42,.55)}
.rrow.me{box-shadow:inset 0 0 0 2px var(--tc)}
.medal{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#2a1600;background:radial-gradient(circle at 35% 30%,#fff3b0,#ffc61a 50%,#a86b00);box-shadow:0 2px 0 rgba(0,0,0,.4)}
.medal.m2{background:radial-gradient(circle at 35% 30%,#fff,#c9ced8 50%,#7d8494)}.medal.m3{background:radial-gradient(circle at 35% 30%,#ffd9b0,#e08a3c 50%,#8a4a14)}
.medal.mn{background:none;color:var(--mu);box-shadow:none}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:1.45rem;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--tc) 45%,#fff),var(--tc) 60%,color-mix(in srgb,var(--tc) 60%,#000));box-shadow:0 0 0 2px rgba(255,255,255,.7),0 0 14px -2px var(--tc);flex:none}
.avatar.big{width:54px;height:54px;font-size:1.8rem}
.rname{font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rname small{color:var(--mu)}
.rcells{font-weight:900;color:var(--lime);font-size:1.3em;font-variant-numeric:tabular-nums}
.rcells small{font-size:.55em;color:var(--mu)}
/* desafio */
.chnow{text-align:center}
.chhead{display:flex;align-items:center;justify-content:center;gap:clamp(12px,2vw,26px);flex-wrap:wrap}
.chtype{display:flex;flex-direction:column;align-items:flex-start;line-height:1}
.chtype .tyi{font-size:clamp(2rem,3.4vw,3.4rem);filter:drop-shadow(0 0 12px var(--tyc))}
.chtype b{font-size:clamp(1.6rem,3vw,3rem);font-weight:900;color:#fff;letter-spacing:.02em}
.chtype em{font-style:normal;font-weight:900;font-size:clamp(1.2rem,2.2vw,2.2rem);color:var(--lime)}
.tpill{display:inline-flex;align-items:center;gap:10px;margin-top:14px;padding:8px 22px;border-radius:999px;border:2px solid var(--lime);box-shadow:0 0 22px -4px var(--lime),inset 0 0 14px -6px var(--lime);font-weight:900;font-size:clamp(1.6rem,3.4vw,3rem);color:var(--lime);font-variant-numeric:tabular-nums}
.tpill.c{border-color:var(--rd);color:var(--rd);box-shadow:0 0 22px -4px var(--rd);animation:pul 1s infinite}
.tpill.sm{flex-direction:column;gap:0;padding:4px 16px;font-size:1.5rem;margin:0;line-height:1.1}
.tpill.sm small{font-size:.55rem;color:var(--mu);letter-spacing:.08em}
.chwait{display:grid;place-items:center;gap:8px;padding:20px 0;color:var(--mu)}
.chwait svg{width:70px;opacity:.85;animation:float 4s ease-in-out infinite}
/* TV */
.tvplay{padding-top:10px}
.tvtop{display:flex;align-items:center;gap:20px;margin-bottom:14px}
.tvtop .rail{margin:0 auto}
.elogo.tvl{height:clamp(60px,7vw,110px)}
.tvgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr) minmax(0,1.15fr);gap:clamp(12px,1.6vw,28px);align-items:start}
.tvcenter .globebox{max-width:min(620px,60vh)}
.tv .rrow{font-size:clamp(1rem,1.4vw,1.5rem);padding:clamp(8px,.9vw,14px) 12px}
.tv .avatar{width:clamp(40px,3.2vw,56px);height:clamp(40px,3.2vw,56px);font-size:clamp(1.3rem,2vw,2rem)}
.tvright{display:grid;gap:16px}
.nextturn{display:flex;align-items:center;gap:16px}
.nextturn small{display:block;color:var(--mu);font-weight:800;letter-spacing:.1em}
.nextturn b{font-size:clamp(1.4rem,2.4vw,2.4rem);color:var(--tc)}
.tagline{font-size:clamp(1.1rem,2.4vw,2.2rem);font-weight:800;letter-spacing:.04em;text-transform:uppercase;text-align:center}
.tvteams{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.tvmsg{font-size:clamp(1.1rem,2.4vw,2.2rem);font-weight:900;color:var(--lime);letter-spacing:.1em;animation:pul 1.6s infinite;text-align:center}
@media(max-width:1000px){.tvgrid{grid-template-columns:1fr}}
/* tiles de equipa */
.tgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ttile{aspect-ratio:1.1;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:8px;background:linear-gradient(180deg,color-mix(in srgb,var(--tc) 24%,#140b26),#0c0718) padding-box,linear-gradient(135deg,var(--tc),color-mix(in srgb,var(--tc) 35%,#000)) border-box;border:2px solid transparent;box-shadow:0 0 18px -8px var(--tc);color:#fff;font-weight:900;letter-spacing:.06em;text-transform:uppercase;min-height:0;transition:transform .15s,box-shadow .15s}
.ttile .em{font-size:3rem;filter:drop-shadow(0 0 12px var(--tc))}
.ttile b{font-size:.95rem}
.ttile.sel{box-shadow:0 0 0 3px #fff,0 0 34px var(--tc);transform:scale(1.03)}
.ttile.mini{width:clamp(130px,11vw,190px);aspect-ratio:1}
.ttile.mini small{font-size:.7rem;color:var(--mu);letter-spacing:.02em;text-transform:none}
.ttile.mini.sel small{color:var(--lime)}
/* botões néon */
.lime{background:linear-gradient(180deg,#e2ff8f,#b5ff2a 50%,#7ccf00);color:#14200a;border:0;font-weight:900;letter-spacing:.04em;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 5px 0 rgba(40,70,0,.8),0 0 30px -6px #b5ff2a}
.outline{background:rgba(255,255,255,.03);border:2px solid var(--lime);color:#fff;font-weight:800}
/* telemóvel */
.joinw{max-width:520px;padding-bottom:40px}
.splash{min-height:86vh;justify-content:center;gap:22px}
.joinbtns{display:grid;gap:12px;width:100%;margin-top:16px}
.foot{color:var(--mu);font-weight:800;letter-spacing:.12em;font-size:.8rem}
.tw{max-width:560px;padding-bottom:110px}
.tw>.elogo.team{margin:0 auto 10px;width:min(200px,55vw)}
.tbar2{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.myteam{flex:1;text-align:right;min-width:0}
.myteam small{display:block;color:var(--mu);font-size:.65rem;letter-spacing:.1em;font-weight:800}
.myteam b{color:var(--tc);font-size:1.2rem;font-weight:900;text-transform:uppercase}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(4,1fr);background:rgba(10,6,22,.97);backdrop-filter:blur(10px);border-top:1px solid rgba(161,77,255,.5);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabbar button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.72rem;color:var(--mu);min-height:54px;padding:0;box-shadow:none}
.tabbar button span{font-size:1.3rem;filter:grayscale(1);opacity:.7}
.tabbar button.on{color:var(--lime)}.tabbar button.on span{filter:none;opacity:1}
.strip{display:flex;align-items:center;gap:14px;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.04);border:1px solid rgba(161,77,255,.4);margin-bottom:10px}
.strip .bball{--sz:58px}
.spinball.sm{width:50px;margin:0}
.sinfo{display:grid;gap:6px;min-width:0}
.sinfo b{font-size:1.05rem}
.turn2{margin-left:auto;font-weight:800;color:var(--tc)}
.progbox{display:flex;gap:12px;align-items:center;margin-top:14px;padding:12px 16px;border-radius:16px;border:2px solid rgba(181,255,42,.6);box-shadow:0 0 20px -8px var(--lime);font-size:1.4rem}
.progbox div{font-size:.95rem}.progbox small{color:var(--mu)}
.rules-l{margin:0;padding-left:1.2em;display:grid;gap:10px;line-height:1.45}
/* cartela no telemóvel em néon */
.tcard .bcard{background:linear-gradient(180deg,rgba(24,13,44,.95),rgba(10,6,22,.95));box-shadow:0 0 0 2px var(--tc),0 0 30px -6px var(--tc)}
.tcard .bc{background:linear-gradient(180deg,color-mix(in srgb,var(--ty) 30%,#150b28),color-mix(in srgb,var(--ty) 10%,#0b0616));box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ty) 85%,transparent),0 0 14px -4px var(--ty)}
.tcard .bc .n{color:#fff;text-shadow:0 0 14px var(--ty),0 2px 0 rgba(0,0,0,.5)}
.tcard .bc:not(.ok)::before{display:none}
.tcard .bc.ok{background:#0b0616}
/* final */
.final{gap:10px;padding:10px 0}
.fintitle{font-size:clamp(2.2rem,9vw,3.4rem);font-weight:900;background:linear-gradient(180deg,#fff6b0,#ffd23f 45%,#ff8a1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #2a0f45)}
.finsub{color:var(--lime);font-weight:900;letter-spacing:.14em}
.trophy-big{width:clamp(160px,22vw,260px);filter:drop-shadow(0 0 40px rgba(255,170,40,.6));animation:float 4s ease-in-out infinite}
.finname{font-size:clamp(2rem,8vw,3rem);font-weight:900;color:var(--tc);text-shadow:0 0 30px var(--tc);text-transform:uppercase}
.finpts{color:var(--lime);font-weight:900;letter-spacing:.1em}
.thanks{display:flex;gap:14px;align-items:center;text-align:left;padding:14px 18px;border-radius:18px;border:2px solid rgba(161,77,255,.7);width:100%;margin:8px 0}
.thanks svg{width:48px;flex:none}
.lrow.main{border-width:3px}

/* perguntas de escolha múltipla */

function shuffle(a,rng){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function poolByType(s){const o={};Object.keys(COMP).forEach(t=>{o[t]=byType(s,t).slice(0,Math.max(COMP[t],s.poolT[t]||0));});return o;}
const poolNums=s=>Object.values(poolByType(s)).flat().sort((a,b)=>a-b);
const typeOfN=(s,n)=>{const c=s.challenges.find(x=>x.n===n);return c?c.type:null;};
function poolOk(s){return Object.keys(COMP).every(t=>byType(s,t).length>=POOL_MIN[t]);}
function nCr(n,k){if(k<0||k>n)return 0;let r=1;for(let i=1;i<=k;i++)r=r*(n-k+i)/i;return Math.round(r);}
function cardVariety(s){const P=poolByType(s);return Object.keys(COMP).reduce((m,t)=>m*nCr((P[t]||[]).length,COMP[t]),1);}

for(let a=0;a<20;a++){let c=[];Object.keys(COMP).forEach(t=>{c=c.concat(shuffle(P[t],rng).slice(0,COMP[t]));});c.sort((x,y)=>x-y);if(!avoid||avoid.join()!==c.join()){best=c;break;}best=c;}return best;}
function generateCards(s,rng){rng=rng||Math.random;const T=s.teams;if(!T.length||!poolOk(s)){s.cards={};return{ok:true};}const P=poolByType(s);
let best=null,bestScore=-1e9;

T.forEach(t=>{const card=cards[t.id];let got=0;while(got<k){let j=i;while(j<pool.length&&card.includes(pool[j]))j++;if(j>=pool.length){const free=nums.filter(x=>!card.includes(x));pool.push(free[Math.floor(rng()*free.length)]);j=pool.length-1;}[pool[i],pool[j]]=[pool[j],pool[i]];card.push(pool[i]);i++;got++;}});});
T.forEach(t=>cards[t.id].sort((x,y)=>x-y));
let sc=0;const ids=T.map(t=>t.id);for(let x=0;x<ids.length;x++)for(let y=x+1;y<ids.length;y++){const sh=cards[ids[x]].filter(n=>cards[ids[y]].includes(n)).length;if(sh===CARD_N)sc-=1000;sc-=sh*sh;}
if(sc>bestScore){bestScore=sc;best=cards;}}
s.cards=best;return{ok:true};}
function validCard(s,card){if(!Array.isArray(card)||card.length!==CARD_N||new Set(card).size!==CARD_N)return false;const set=new Set(poolNums(s));if(!card.every(n=>Number.isInteger(n)&&set.has(n)))return false;

function addTeam(s){if(!editable(s))return{ok:false,msg:'Só antes do jogo.'};if(s.teams.length>=8)return{ok:false,msg:'Máximo 8 equipas.'};const used=new Set(s.teams.map(t=>t.color));const c=COLORS.find(c=>!used.has(c[1]))||COLORS[0];const t={id:'t'+uid(),name:c[0],color:c[1],icon:c[2]};s.teams.push(t);s.cards[t.id]=randomCard(s);return{ok:true};}

function setPoolT(s,type,n){if(!editable(s))return{ok:false,msg:'Só antes do jogo.'};if(!COMP[type])return{ok:false};n=Math.round(+n);const max=byType(s,type).length;if(!(n>=POOL_MIN[type]&&n<=max))return{ok:false,msg:'Entre '+POOL_MIN[type]+' e '+max+'.'};s.poolT[type]=n;s.gid=uid();generateCards(s);return{ok:true};}
function setSecs(s,type,v){if(!TYPES[type])return{ok:false};v=Math.round(+v);if(!(v>=5&&v<=300))return{ok:false,msg:'Tempo entre 5 e 300 segundos.'};s.secs[type]=v;return{ok:true};}
function migrate(s){(s.challenges||[]).forEach(c=>{if(c.type==='pergunta'&&typeof c.open!=='boolean')c.open=false;if(c.type==='pergunta'&&!Array.isArray(c.options)){const d=CH.find(x=>x[0]==='pergunta'&&x[1]===c.title);c.options=d?d[4].slice():[c.answer||'','',''];c.correct=d?d[5]:0;c.answer=c.options[c.correct];}});s.teams.forEach(t=>{if(!t.icon){const pe=COLORS.find(x=>x[1]===t.color);t.icon=pe?pe[2]:'🎃';}});if(!s.wheel||!Array.isArray(s.wheel.karaoke)||!Array.isArray(s.wheel.mimica))s.wheel=JSON.parse(JSON.stringify(DEF_WHEEL));WHEEL_TYPES.forEach(k=>{if(JSON.stringify(s.wheel[k])===JSON.stringify(OLD_WHEEL[k]))s.wheel[k]=DEF_WHEEL[k].slice();});if(!s.poolT)s.poolT=Object.assign({},DEF_POOL);Object.keys(POOL_MIN).forEach(t=>{const m=byType(s,t).length;s.poolT[t]=Math.min(Math.max(POOL_MIN[t],s.poolT[t]||0),m);});return s;}

function setChallenge(s,n,patch){const c=s.challenges.find(c=>c.n===n);if(!c)return{ok:false};if('type'in patch){if(!editable(s))return{ok:false,msg:'O tipo só muda antes do jogo.'};if(!TYPES[patch.type])return{ok:false};const old=c.type;c.type=patch.type;if(!poolOk(s)){c.type=old;return{ok:false,msg:'Têm de existir pelo menos 5 perguntas, 2 mímicas e 2 karaokes, para haver sempre cartões diferentes.'};}

if('opt'in patch){if(!Array.isArray(c.options))c.options=['','',''];const k=patch.opt[0];if([0,1,2].includes(k))c.options[k]=String(patch.opt[1]).slice(0,120);}

['title','text','answer'].forEach(k=>{if(k in patch)c[k]=String(patch[k]).slice(0,300);});return{ok:true};}
function start(s,picks){if(s.phase!=='setup')return{ok:false,msg:'O jogo já começou.'};if(s.teams.length<2)return{ok:false,msg:'São precisas pelo menos 2 equipas.'};if(!poolOk(s))return{ok:false,msg:'Faltam desafios de algum tipo.'};

function spin(s,now,rng){rng=rng||Math.random;if(s.phase!=='playing')return{ok:false,msg:'O jogo não está a decorrer.'};let r=remaining(s);if(!r.length)return{ok:false,msg:'Todos os cartões estão completos.'};
const cur=s.spin&&s.spin.n;if(r.length>1&&cur!=null)r=r.filter(n=>n!==cur);

function undoSpin(s){if(s.phase!=='playing'||!s.draws.length)return{ok:false,msg:'Não há bolas para anular.'};s.draws.pop();if(s.wheelAt&&s.wheelAt.i>=s.draws.length)s.wheelAt=null;const l=s.draws.length-1;s.spin=l>=0?{id:uid(),n:s.draws[l].n,at:0,i:l}:null;s.timer=null;s.showAnswer=false;return{ok:true};}
function setResult(s,i,tid,val){const d=s.draws[i];if(!d)return{ok:false,msg:'Essa bola não existe.'};if(!playersFor(s,i).some(t=>t.id===tid))return{ok:false,msg:'Essa equipa não joga esta bola.'};

function timerStart(s,now){if(!s.spin)return{ok:false};const c=s.challenges.find(c=>c.n===s.spin.n);s.timer={startedAt:now,secs:s.secs[c.type]||30};return{ok:true};}

function timerAdd(s,now,sec){if(!s.timer)return{ok:false};if(timerLeft(s,now)===0)s.timer={startedAt:now,secs:sec};else s.timer.secs=Math.min(s.timer.secs+sec,900);return{ok:true};}

function lines(){const L=[];for(let r=0;r<CARD_N/COLS;r++)L.push([...Array(COLS)].map((_,c)=>r*COLS+c));return L;}

const cmpN=(a,b)=>a===b?0:(a<b?-1:1);

const WHEEL_TYPES=['karaoke','mimica'];
function setWheel(s,type,text){if(!WHEEL_TYPES.includes(type))return{ok:false};const items=[];String(text||'').split(/\r?\n/).map(x=>x.trim().slice(0,80)).filter(Boolean).forEach(x=>{if(!items.some(y=>y.toLowerCase()===x.toLowerCase()))items.push(x);});if(items.length<2)return{ok:false,msg:'A roda precisa de pelo menos 2 opções (uma por linha).'};s.wheel[type]=items.slice(0,60);return{ok:true};}
function wheelUsed(s,type){const u=[];s.draws.forEach(d=>{if(d.wh)Object.values(d.wh).forEach(w=>{if(w.type===type)u.push(w.item);});});return u;}
function wheelSpin(s,i,tid,now,rng){rng=rng||Math.random;if(s.phase!=='playing')return{ok:false};const d=s.draws[i];if(!d)return{ok:false};const c=s.challenges.find(x=>x.n===d.n);if(!c||!WHEEL_TYPES.includes(c.type))return{ok:false,msg:'Esta bola não tem roda.'};
if(!playersFor(s,i).some(t=>t.id===tid))return{ok:false,msg:'Esta equipa não joga esta bola.'};if(d.results&&d.results[tid]==='ok')return{ok:false,msg:'Esta equipa já cumpriu.'};
const list=(s.wheel&&s.wheel[c.type]||DEF_WHEEL[c.type]).filter(Boolean);const used=new Set(wheelUsed(s,c.type));let avail=list.filter(x=>!used.has(x));if(!avail.length){const here=new Set(Object.values(d.wh||{}).map(w=>w.item));avail=list.filter(x=>!here.has(x));if(!avail.length)avail=list.slice();}

<script>
(function(){'use strict';
const C=Core,$=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SPIN_MS=4200;
const KEY='bingo-nos-halloween-v7',PKEY='bingo-nos-picks-v5';
const BASE_URL='https://claude.ai/artifact/8fLG9EvydFAcW3wQdwiqM7';
/* ---------- estado + sincronização ---------- */
let clockOff=0;const offS=[];const gnow=()=>Date.now()+clockOff;
function clockSample(st){if(route()==='mod'||!st||!st.sentAt)return;const t=Date.now();offS.push([t,st.sentAt-t]);while(offS.length&&t-offS[0][0]>60000)offS.shift();clockOff=Math.max.apply(null,offS.map(x=>x[1]));}
function parse(j){try{const o=typeof j==='string'?JSON.parse(j):j;if(o&&o.v===7&&Array.isArray(o.teams))return C.migrate(Object.assign(C.fresh(),o));}catch(e){}return null;}
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);}catch(e){}}
let S=parse(lsGet(KEY));if(!S){S=C.fresh();S.rev=1;if(!/^#(e-|tv|jogar)/.test(location.hash))lsSet(KEY,JSON.stringify(S));}
let PICKS=(()=>{try{return JSON.parse(lsGet(PKEY)||'{}')||{};}catch(e){return{};}})();
const SB=(window.BINGO_SUPABASE&&/^https:\/\//.test(window.BINGO_SUPABASE.url||'')&&(window.BINGO_SUPABASE.anonKey||'').length>20&&window.supabase)?window.BINGO_SUPABASE:null;
let db=null,ref=null,online=false,isOwner=!SB,writing=false,dirty=false,syncErr=null;
const bc='BroadcastChannel'in window?new BroadcastChannel('bingo-nos-v5'):null;
async function push(){if(isOwner&&route()==='mod')S.sentAt=Date.now();lsSet(KEY,JSON.stringify(S));if(bc)bc.postMessage('s');if(!ref)return;if(writing){dirty=true;return;}writing=true;pushFinalAgain();
do{dirty=false;try{await ref.set({rev:S.rev,json:JSON.stringify(S)});if(syncErr){syncErr=null;render();}}catch(e){console.warn('Gravação recusada',e);if(e&&e.code==='invalid_argument'){if(SB){syncErr=(e.message||'recusado').slice(0,160);toast('O Supabase recusou a gravação: '+syncErr+'. Corre outra vez o ficheiro supabase-setup.sql no SQL Editor do Supabase.','er');render();break;}isOwner=false;toast('Sem permissão para alterar o jogo.','er');render();break;}if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));dirty=true;}else{toast('Não foi possível sincronizar ('+(e&&e.code||'erro')+').','er');break;}}}while(dirty);writing=false;}
let endedSent=0;function pushFinalAgain(){if(!isOwner||route()!=='mod'||S.phase!=='ended'||endedSent===S.rev)return;endedSent=S.rev;[1500,4000].forEach(t=>setTimeout(()=>{if(isOwner&&S.phase==='ended')push();},t));}
let gotRemote=false;
function adopt(next){if(!next)return;clockSample(next);if(isOwner||gotRemote){if(next.rev<=S.rev)return;}else if(next.rev===S.rev&&JSON.stringify(next)===JSON.stringify(S)){gotRemote=true;return;}gotRemote=true;const prev=S;S=next;lsSet(KEY,JSON.stringify(S));react(prev,S);render();autoValidate();}
const MYPICKS={};let RAWPICKS=PICKS;
function setPicks(p){RAWPICKS=p;p=Object.assign({},p);Object.keys(MYPICKS).forEach(k=>{const m=MYPICKS[k];if(gnow()-m.at>15000){delete MYPICKS[k];return;}if(!p[k]||(p[k].at||0)<m.at)p[k]=m;else delete MYPICKS[k];});const prev=PICKS;PICKS=p;if(JSON.stringify(prev)!==JSON.stringify(p)){render();autoValidate();}}
if(bc)bc.onmessage=e=>{if(ref)return;if(e.data==='p'){try{setPicks(JSON.parse(lsGet(PKEY)||'{}'));}catch(x){}}else adopt(parse(lsGet(KEY)));};
addEventListener('storage',e=>{if(ref)return;if(e.key===KEY)adopt(parse(e.newValue));if(e.key===PKEY){try{setPicks(JSON.parse(e.newValue||'{}'));}catch(x){}}});
function act(fn){if(!isOwner){toast('Só o moderador pode alterar o jogo.','er');return{ok:false};}const next=JSON.parse(JSON.stringify(S));const r=fn(next)||{ok:true};if(r.ok===false){if(r.msg)toast(r.msg,'er');return r;}next.rev=S.rev+1;const prev=S;S=next;react(prev,S);if(window.event&&window.event.type==='change')setTimeout(render,0);else render();push();return r;}
async function writePick(tid,data){const body=Object.assign({gid:S.gid,at:gnow()},data);

function qrSVG(text,m){try{if(typeof qrcode!=='function')return '';const q=qrcode(0,'M');q.addData(text);q.make();return q.createSvgTag({cellSize:4,margin:m==null?1:m*4,scalable:true});}catch(e){return '';}}
function qrCanvas(text,label,color){const q=qrcode(0,'M');q.addData(text);q.make();const n=q.getModuleCount(),cell=Math.floor(900/(n+8)),qs=cell*(n+8),pad=40,lab=label?150:0,W=qs+pad*2,H=qs+pad*2+lab;const cv=document.createElement('canvas');cv.width=W;cv.height=H;const g=cv.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,W,H);if(color){g.fillStyle=color;g.fillRect(0,0,W,18);g.fillRect(0,H-18,W,18);}g.fillStyle='#000';for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))g.fillRect(pad+(c+4)*cell,pad+(r+4)*cell,cell,cell);if(label){g.fillStyle=color||'#000';g.font='900 72px Rubik, Arial, sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(label,W/2,qs+pad+lab/2-10);}return cv;}
function fileSafe(x){return String(x).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-zA-Z0-9]+/g,'-').replace(/^-|-$/g,'')||'equipa';}

if(ui.confirm){const k=ui.confirm;return '<div class="ov" data-a="noC"><div class="mbox" role="dialog" aria-modal="true"><h3>'+esc(k.title)+'</h3><p class="mu">'+esc(k.text)+'</p><div class="row"><button data-a="noC">Cancelar</button><button class="'+(k.danger?'danger':'or')+'" data-a="yes">'+esc(k.yes)+'</button></div></div></div>';}
if(ui.edit!=null){const i=ui.edit,d=S.draws[i];if(!d){ui.edit=null;return '';}const c=S.challenges.find(x=>x.n===d.n),pl=C.playersFor(S,i);
return '<div class="ov" data-a="noE"><div class="mbox" role="dialog" aria-modal="true"><h3>Bola '+d.n+' · '+esc(c.title)+'</h3><p class="mu">Corrige o resultado de cada equipa nesta ronda.</p><div style="display:grid;gap:8px;margin-top:12px">'+(pl.length?pl.map(t=>{const r=d.results[t.id];return '<div class="res" style="--tc:'+t.color+'"><b style="flex:1">'+esc(t.name)+'</b><button class="y'+(r==='ok'?' on':'')+'" data-a="resE" data-i="'+i+'" data-t="'+t.id+'" data-v="ok">✔ Cumpriu</button><button class="n'+(r==='fail'?' on':'')+'" data-a="resE" data-i="'+i+'" data-t="'+t.id+'" data-v="fail">✖ Falhou</button></div>';}).join(''):'<p class="mu">Nenhuma equipa joga esta bola (já tinham a casa preenchida).</p>')+'</div><div class="row"><button class="or" data-a="noE">Feito</button></div></div></div>';}
return '';}
/* ---------- relógio ---------- */
let lastSec=null,wasSpin=false;
function tick(){const now=gnow();const els=document.querySelectorAll('[data-rt]');if(els.length){const l=C.timerLeft(S,now);if(l!=null){const sec=Math.ceil(l/1000);els.forEach(el=>{const v=el.dataset.fmt==='mm'?fmtT(l):String(sec);if(el.textContent!==v)el.textContent=v;el.classList.toggle('c',l<=10000);const pl=el.closest('.tpill');if(pl)pl.classList.toggle('c',l<=10000);});if(sec!==lastSec&&sec<=5&&sec>0)sfx.tick();if(sec===0&&lastSec===1)tone(220,.6,0,'sawtooth',.08);lastSec=sec;}}
const sp=spinning(now);const was=wasSpin;wasSpin=sp;if(was&&!sp){render();autoValidate();}if(S.timer&&C.timerLeft(S,now)===0&&!tick.exp){tick.exp=S.timer.startedAt;render();autoValidate();}else if(!S.timer||tick.exp!==S.timer.startedAt){if(S.timer&&C.timerLeft(S,now)>0)tick.exp=null;}}
setInterval(tick,200);
setInterval(()=>{if(isOwner&&route()==='mod'&&ref&&!writing&&S.phase==='playing')push();},5000);
setInterval(()=>{if(isTV()&&S.phase==='ended'){const w=C.winner(S);if(w)rain([w.color,'#ffd23f','#b5ff2a','#fff','#a14dff'],4000);}},14000);
/* ---------- ações ---------- */
function ask(title,text,yes,fn,danger){ui.confirm={title,text,yes,fn,danger};render();}
const A={
tv(){if(location.hash==='#tv')return;let w=null;try{w=window.open(location.pathname+location.search+'#tv','bingo-tv');}catch(e){}if(!w)location.hash='tv';},
exitTv(){location.hash='';},
snd(){sound=!sound;lsSet('bingo-som',sound?'1':'0');if(sound)tone(660,.15);render();},
pal(el){ui.pal=ui.pal===el.dataset.id?null:el.dataset.id;render();},
setColor(el){ui.pal=null;act(s=>C.setTeam(s,el.dataset.id,{color:el.dataset.c}));},
addTeam(){act(s=>C.addTeam(s));},
rmTeam(el){act(s=>C.removeTeam(s,el.dataset.id));},

shuffle(){act(s=>C.generateCards(s));toast('Cartões baralhados.','ok');},
rmLogo(){act(s=>{s.logo=null;return{ok:true};});},
startAsk(){const miss=S.teams.filter(t=>pickState(t.id)!=='locked');if(!miss.length)return act(s=>C.start(s,PICKS));ask('Começar sem todas as escolhas?',miss.map(t=>t.name).join(', ')+' ainda não confirmaram. Ficam com o cartão que está no ecrã delas.','Começar mesmo assim',s=>C.start(s,PICKS));},
spin(){act(s=>C.spin(s,gnow()));},
res(el){const i=S.spin.i,t=el.dataset.t,v=el.dataset.v,d=S.draws[i];act(s=>C.setResult(s,i,t,d.results[t]===v?null:v));},
resE(el){const i=+el.dataset.i,t=el.dataset.t,v=el.dataset.v,d=S.draws[i];act(s=>C.setResult(s,i,t,d.results[t]===v?null:v));},
editBall(el){ui.edit=+el.dataset.i;render();},
noE(){ui.edit=null;render();},
links(){ui.links=true;render();},
noL(){ui.links=false;render();},
copy(el){const t=S.teams.find(x=>x.id===el.dataset.id);if(!t)return;const link=teamLink(t);try{navigator.clipboard.writeText(link).then(()=>toast('Link de '+t.name+' copiado','ok'),()=>selectCode(t.id));}catch(e){selectCode(t.id);}},
tStart(){act(s=>C.timerStart(s,gnow()));},
tStop(){act(s=>C.timerStop(s));},
tAdd(){act(s=>C.timerAdd(s,gnow(),30));},
wheelReset(){ask('Repor as listas sugeridas?','As listas de músicas e de mímicas voltam às sugeridas. O que escreveste nas listas perde-se.','Repor',s=>{s.wheel=JSON.parse(JSON.stringify(C.DEF_WHEEL));return{ok:true};});},
wheel(el){if(!S.spin||spinning(gnow())||wSpinning())return;act(s=>C.wheelSpin(s,S.spin.i,el.dataset.t,gnow()));},
priv(){ui.showPriv=true;render();},
ansAll(){act(s=>{s.showAnswer=!s.showAnswer;return{ok:true};});},
undoAsk(){const l=S.draws[S.draws.length-1];ask('Anular a bola '+l.n+'?','Os resultados desta ronda são apagados e a vez de rodar volta à equipa anterior.','Anular bola',s=>C.undoSpin(s),true);},
endAsk(){const f=C.fullTeams(S);ask('Terminar o jogo?',f.length?'Aparece a equipa vencedora em todos os ecrãs.':'Ninguém encheu o cartão: ganha quem tiver mais casas preenchidas.','Terminar',s=>C.end(s),!f.length);},
reopen(){act(s=>C.reopen(s));},
tie(el){act(s=>C.setTieWinner(s,el.dataset.t));},
qrPng(el){try{if(typeof qrcode!=='function')return toast('O gerador de QR ainda não carregou. Tenta daqui a um segundo.','er');const id=el.dataset.id,t=S.teams.find(x=>x.id===id);const link=t?teamLink(t):baseLink()+'#jogar';const cv=qrCanvas(link,t?t.name:'Bingo SONOS',t?t.color:'#7c3aed');cv.toBlob(b=>{saveBlob(b,'QR-'+fileSafe(t?t.name:'todas-as-equipas')+'.png');toast('QR descarregado','ok');},'image/png');}catch(e){console.warn(e);toast('Não foi possível criar a imagem do QR.','er');}},
async markers(){if(typeof qrcode!=='function')return toast('O gerador de QR ainda não carregou. Tenta daqui a um segundo.','er');const html=markersDoc(),fn='marcadores-de-mesa-bingo.html';const blob=new Blob([html],{type:'text/html;charset=utf-8'});const w=inArtifact()?null:window.open(URL.createObjectURL(blob),'_blank');if(w)return;try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:fn,data:html});toast('Ficheiro dos marcadores descarregado: abre-o e imprime.','ok');return;}}catch(e){if(e&&e.code)return;}saveBlob(blob,fn);toast('Ficheiro dos marcadores descarregado: abre-o e imprime.','ok');},
async csv(){const data=C.csv(S),fn='bingo-halloween-resultados.csv';try{const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;if(dl){await dl.save({filename:fn,data});return;}}catch(e){if(e&&e.code)return;}const b=new Blob([data],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);},
newAsk(){ask('Começar um novo jogo?','As casas preenchidas são apagadas. As equipas e os desafios ficam, e as equipas voltam a escolher cartão.','Novo jogo',s=>C.newGame(s),true);},
noC(){ui.confirm=null;render();},
yes(){const k=ui.confirm;ui.confirm=null;act(k.fn);render();},
ans(el){const tid=teamHash();if(!canAnswer(tid))return;const k=+el.dataset.v;writePick('a-'+tid,{sid:S.spin.id,i:S.spin.i,choice:k});toast('Resposta '+'ABC'[k]+' enviada!','ok');},
fs(){const d=document.documentElement;try{(document.fullscreenElement?document.exitFullscreen():d.requestFullscreen&&d.requestFullscreen()).catch(()=>toast('O ecrã inteiro não está disponível aqui. Usa F11.','er'));}catch(e){toast('Usa F11 para ecrã inteiro.','er');}keepAwake();},
login(){doLogin();},
toMod(){location.hash='moderador';},
logout(){try{localStorage.removeItem('bingo-mod');}catch(e){}isOwner=false;location.hash='';render();},
/* entrada */
joinEnter(){ui.joinStep='teams';ui.joinPick=lsGet('bingo-minha-equipa');render();},
joinPick(el){ui.joinPick=el.dataset.id;render();},
joinBack(){ui.joinStep='splash';render();},
joinConfirm(){const id=ui.joinPick;if(!S.teams.some(t=>t.id===id))return;lsSet('bingo-minha-equipa',id);ui.ttab='bingo';location.hash='e-'+id;},
joinGo(el){lsSet('bingo-minha-equipa',el.dataset.id);ui.ttab='bingo';location.hash='e-'+el.dataset.id;},
toJoin(){ui.joinStep='teams';location.hash='jogar';},
ttab(el){ui.ttab=el.dataset.v;render();scrollTo(0,0);},
/* equipa */
reroll(){const tid=teamHash();if(S.phase!=='setup')return;const cur=cardFor(tid),nc=C.randomCard(S,null,cur);if(!nc||nc.join()===cur.join())return toast('Não há outro cartão possível com as bolas deste jogo. Pede ao moderador para pôr mais bolas no globo.','er');ui.fresh=gnow();writePick(tid,{card:nc,locked:false});toast('🔀 Novo cartão!','ok');},
lock(){const tid=teamHash();if(S.phase!=='setup')return;writePick(tid,{card:cardFor(tid),locked:true});toast('Cartão escolhido!','ok');},
unpick(){const tid=teamHash();if(S.phase!=='setup')return;writePick(tid,{card:cardFor(tid),locked:false});}
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||el.disabled)return;if(el.classList.contains('ov')&&e.target!==el)return;const f=A[el.dataset.a];if(f)f(el);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='lg_pass'){doLogin();return;}if(e.key==='Escape'&&isMod()){ui.confirm=null;ui.edit=null;ui.links=false;render();return;}
if(!isMod()||S.phase!=='playing'||ui.confirm||ui.edit!=null||ui.links)return;const tg=e.target;if(tg&&/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName))return;if(e.ctrlKey||e.metaKey||e.altKey)return;
const k=e.key.toLowerCase();if(k===' '||k==='enter'){e.preventDefault();if(!spinning(gnow())&&C.remaining(S).length)A.spin();}
else if(k==='t'){if(S.spin&&!spinning(gnow()))S.timer?A.tStop():A.tStart();}
else if(k==='g'){if(S.spin&&!spinning(gnow())&&!wSpinning()){const d=S.draws[S.spin.i],nx=C.playersFor(S,S.spin.i).find(t=>!(d.wh&&d.wh[t.id])&&d.results[t.id]!=='ok');if(nx)A.wheel({dataset:{t:nx.id}});}}
else if(k==='r'){const c=S.spin&&S.challenges.find(x=>x.n===S.spin.n);if(c&&c.type==='pergunta')A.ansAll();}
else if(/^[1-8]$/.test(k)&&S.spin&&!spinning(gnow())){const pl=C.playersFor(S,S.spin.i);const t=pl[+k-1];if(t){const d=S.draws[S.spin.i];act(s=>C.setResult(s,S.spin.i,t.id,d.results[t.id]==='ok'?null:'ok'));}}});
document.addEventListener('change',e=>{const el=e.target,ds=el.dataset;
if(ds.tn!==undefined){const r=act(s=>C.setTeam(s,ds.tn,{name:el.value}));if(r.ok===false)render();}
else if(ds.poolt){const r=act(s=>C.setPoolT(s,ds.poolt,+el.value));if(r.ok===false)render();}
else if(ds.secs){const r=act(s=>C.setSecs(s,ds.secs,el.value));if(r.ok===false)render();}
else if(ds.ct)act(s=>C.setChallenge(s,+ds.ct,{type:el.value}));
else if(ds.cf)act(s=>C.setChallenge(s,+ds.n,{[ds.cf]:el.value}));
else if(ds.opt!==undefined)act(s=>C.setChallenge(s,+ds.n,{opt:[+ds.opt,el.value]}));
else if(ds.corr)act(s=>C.setChallenge(s,+ds.corr,{correct:+el.value}));
else if(ds.qopen)act(s=>C.setChallenge(s,+ds.qopen,{open:el.value==='1'}));
else if(ds.wheel){const r=act(s=>C.setWheel(s,ds.wheel,el.value));if(r.ok===false)render();}
else if(ds.cfg==='eventName'){const v=el.value.trim();if(!v){toast('O nome não pode ficar vazio.','er');render();return;}act(s=>{s.eventName=v.slice(0,60);return{ok:true};});}
else if(el.id==='logo'&&el.files[0]){if(el.files[0].size>120*1024)return toast('Imagem demasiado grande (máx. 120 KB).','er');const fr=new FileReader();fr.onload=()=>act(s=>{s.logo=String(fr.result);return{ok:true};});fr.readAsDataURL(el.files[0]);}});
addEventListener('hashchange',render);
let wl=null;async function keepAwake(){if(isMod())return;try{if(navigator.wakeLock&&!wl&&document.visibilityState==='visible'){wl=await navigator.wakeLock.request('screen');wl.addEventListener('release',()=>{wl=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')keepAwake();});document.addEventListener('click',keepAwake,{once:true});keepAwake();
render();
window.__bingo={get S(){return S;},get PICKS(){return PICKS;},A,ui,render,banner};
})();
