// ── Export XLS – P3: parâmetro opcional shiftObs ──────────────────────────────
const exportXLS=(data,filename,shiftObs="")=>{
  if(!data.length){alert("Sem dados.");return}
  const rows=data.map(r=>({
    "Data":fmtDate(r.ts),
    "Hora":fmtTime(r.ts),
    "Quiosque":r.quiosque||"",
    "Colaborador":r.colaborador||"",
    "Entrada":r.horaEntrada||"",
    "Saída":r.horaSaida||"",
    "Aceitou":r.aceitou?"Sim":"Não",
    "Perfil Combina":r.isCombina===false?"Sem Combina":r.isCombina?`Combina ${r.isCombina}`:"",
    "Venda Combina":r.vendas?.combina?"Sim":"Não",
    "Venda Energia":r.vendas?.energia?"Sim":"Não",
    "Venda Novo NOS":r.vendas?.novoCliente?"Sim":"Não",
    "Venda Alarme":r.vendas?.alarme?"Sim":"Não",
    "Lead":r.lead?"Sim":"Não",
    "Lead Nome":r.lead?.nome||"",
    "Lead Telefone":r.lead?.tel||"",
    "Lead Obs":r.lead?.obs||"",
    "Tipo":r.tipo||"",
    ...(shiftObs?{"Obs. Turno":shiftObs}:{}),
  }));
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Registos");
  ws["!cols"]=[
    {wch:12},{wch:8},{wch:22},{wch:20},{wch:8},{wch:8},{wch:8},
    {wch:16},{wch:14},{wch:14},{wch:14},{wch:14},{wch:6},{wch:20},
    {wch:16},{wch:24},{wch:10},
    ...(shiftObs?[{wch:35}]:[]),
  ];
  XLSX.writeFile(wb,filename);
};

function App(){
  const [tab,setTab]=useState("novo");
  const [records,setRecs]=useState(()=>lsa(CK));
  const [loading,setLoading]=useState(true);
  const [syncing,setSyncing]=useState(false);
  const [online,setOnline]=useState(true);
  const [session,setSession]=useState(()=>ls(SK));

  // Login
  const [lNome,setLNome]=useState("");
  const [lQ,setLQ]=useState("");
  const [lTurno,setLTurno]=useState(null);
  const [lCustomIn,setLCustomIn]=useState("");
  const [lCustomOut,setLCustomOut]=useState("");

  // Wizard
  const [step,setStep]=useState(0);
  const [aceitou,setAceitou]=useState(null);
  const [isCombina,setIC]=useState(null);
  const [vendas,setVendas]=useState({combina:false,energia:false,novoCliente:false,alarme:false});
  const [lead,setLead]=useState({active:false,nome:"",tel:"",obs:""});
  const [flash,setFlash]=useState(false);

  // Histórico
  const [histDate,setHistDate]=useState(todayISO());
  const [histFilter,setHistFilter]=useState("all");

  // Dashboard
  const [pin,setPin]=useState("");
  const [unlocked,setUnlocked]=useState(false);
  const [pinErr,setPinErr]=useState(false);
  const [dashView,setDashView]=useState("geral");
  const [dashFrom,setDashFrom]=useState(todayISO());
  const [dashTo,setDashTo]=useState(todayISO());

  // Report
  const [showReport,setShowReport]=useState(false);
  const [reportCopied,setReportCopied]=useState(false);
  const [imgGenerating,setImgGenerating]=useState(false);
  const [lastSync,setLastSync]=useState(null);

  // P2: Modo gestor (dashboard sem login de turno)
  const [guestMode,setGuestMode]=useState(false);

  // P3: Fecho de turno com confirmação + observações
  const [showFechoConfirm,setShowFechoConfirm]=useState(false);
  const [fechoObs,setFechoObs]=useState("");

  const fetchData=useCallback(async()=>{
    try{
      const{data,error}=await db.from("abordagens").select("*").order("ts",{ascending:false});
      if(error)throw error;
      const r=(data||[]).map(fromRow);
      setRecs(r);lss(CK,r);setOnline(true);setLastSync(new Date());
    }catch{setOnline(false);}
    finally{setLoading(false);}
  },[]);

  useEffect(()=>{fetchData();const t=setInterval(fetchData,60000);return()=>clearInterval(t);},[fetchData]);
  useEffect(()=>{
    if(!online)return;
    const q=lsa(QK);if(!q.length)return;
    db.from("abordagens").upsert(q).then(({error})=>{if(!error){lss(QK,[]);fetchData();}});
  },[online,fetchData]);

  const reset=()=>{
    setStep(0);setAceitou(null);setIC(null);
    setVendas({combina:false,energia:false,novoCliente:false,alarme:false});
    setLead({active:false,nome:"",tel:"",obs:""});
  };
  const getHorario=()=>{
    const t=TURNOS.find(t=>t.id===lTurno);
    if(!t)return{entrada:"",saida:""};
    if(t.id==="custom")return{entrada:lCustomIn,saida:lCustomOut};
    return{entrada:t.entrada,saida:t.saida};
  };
  const doLogin=()=>{
    const h=getHorario();
    const s={colaborador:lNome,quiosque:lQ,horaEntrada:h.entrada,horaSaida:h.saida,loginTs:new Date().toISOString()};
    setSession(s);lss(SK,s);
  };
  const doLogout=()=>{
    localStorage.removeItem(SK);
    setSession(null);setShowReport(false);
    setFechoObs("");setGuestMode(false);
    reset();
  };

  // P3: Confirmar fecho de turno
  const doFechoTurno=()=>{
    setShowFechoConfirm(false);
    setShowReport(true);
  };

  const hasVenda=Object.values(vendas).some(Boolean);
  const steps=aceitou===false?["aceitou"]:(aceitou===true?["aceitou","combina","vendas"]:["aceitou"]);
  const sn=steps[step];
  const isFinal=(sn==="aceitou"&&aceitou===false)||(sn==="vendas");
  const canNext={aceitou:aceitou!==null,combina:isCombina!==null,vendas:true}[sn]??false;
  const canLogin=lNome.trim()&&lQ&&lTurno&&(lTurno!=="custom"||(lCustomIn&&lCustomOut));

  const saveRecord=async()=>{
    const r={
      id:Date.now(),ts:new Date().toISOString(),
      colaborador:session.colaborador,quiosque:session.quiosque,
      horaEntrada:session.horaEntrada,horaSaida:session.horaSaida,
      aceitou,isCombina:aceitou?isCombina:null,
      vendas:aceitou?vendas:null,
      lead:lead.active?{nome:lead.nome||"—",tel:lead.tel,obs:lead.obs}:null,
    };
    if(!aceitou)r.tipo="recusa";
    else if(hasVenda)r.tipo="venda";
    else if(r.lead)r.tipo="lead";
    else r.tipo="sem_venda";
    setRecs(p=>[r,...p]);setSyncing(true);
    try{const{error}=await db.from("abordagens").insert([toRow(r)]);if(error)throw error;setOnline(true);}
    catch{setOnline(false);const q=lsa(QK);q.push(toRow(r));lss(QK,q);}
    finally{setSyncing(false);setFlash(true);setTimeout(()=>{setFlash(false);reset();},1600);}
  };

  const today=records.filter(r=>new Date(r.ts).toDateString()===todayStr());
  // myT: apenas registos do turno atual (desde loginTs) → reset automático ao fechar turno
  const myT=session?records.filter(r=>r.colaborador===session.colaborador&&r.quiosque===session.quiosque&&r.ts>=session.loginTs):[];
  const myS=stats(myT);
  const myTotV=myS.combina+myS.energia+myS.novoCliente+myS.alarme;
  const txConv=myS.conversas>0?Math.round(myTotV/myS.conversas*100):0;
  const dtag=new Date().toLocaleDateString("pt-PT").replace(/\//g,"-");

  const getDashRecords=()=>records.filter(r=>isoDay(r.ts)>=dashFrom&&isoDay(r.ts)<=dashTo);
  const getPeriodLabel=()=>{
    const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("pt-PT",{day:"2-digit",month:"short"});
    return dashFrom===dashTo?fmt(dashFrom):`${fmt(dashFrom)} – ${fmt(dashTo)}`;
  };
  const getExportFilename=()=>dashFrom===dashTo?`Combina_${dashFrom}.xlsx`:`Combina_${dashFrom}_a_${dashTo}.xlsx`;

  const buildReport=()=>[
    `RELATÓRIO DE TURNO`,
    `${new Date().toLocaleDateString("pt-PT",{day:"2-digit",month:"long",year:"numeric"})}`,``,
    `${session?.colaborador}`,
    `${session?.quiosque} · ${session?.horaEntrada} – ${session?.horaSaida}`,``,
    `─────────────────────`,`ABORDAGENS`,``,
    `Total          ${String(myS.total).padStart(3)}`,
    `Conversas      ${String(myS.conversas).padStart(3)}`,
    `Recusas        ${String(myS.recusas).padStart(3)}`,``,
    `─────────────────────`,`VENDAS         ${String(myTotV).padStart(3)}`,``,
    `Combina        ${String(myS.combina).padStart(3)}`,
    `Energia        ${String(myS.energia).padStart(3)}`,
    `Novo Cliente   ${String(myS.novoCliente).padStart(3)}`,
    `Alarme         ${String(myS.alarme).padStart(3)}`,``,
    `─────────────────────`,`LEADS          ${String(myS.leads).padStart(3)}`,``,
    `─────────────────────`,`Taxa conversão   ${txConv}%`,
    ...(fechoObs?[``,`─────────────────────`,`OBSERVAÇÕES`,``,fechoObs]:[]),
  ].join("\n");

  const copyReport=()=>{
    const t=buildReport();
    if(navigator.clipboard){
      navigator.clipboard.writeText(t).catch(()=>{
        const e=document.createElement("textarea");e.value=t;
        document.body.appendChild(e);e.select();document.execCommand("copy");document.body.removeChild(e);
      });
    }
    setReportCopied(true);setTimeout(()=>setReportCopied(false),2500);
  };

  // Gerar imagem PNG: tenta copiar para clipboard; fallback para download
  const [imgCopied,setImgCopied]=useState(false);
  const generateImage=async()=>{
    setImgGenerating(true);
    const el=document.getElementById("report-card");
    if(!el){setImgGenerating(false);return;}
    try{
      const canvas=await html2canvas(el,{scale:2,backgroundColor:"#F0F0F5",useCORS:true,logging:false});
      // Tentar copiar para clipboard (Chrome/Edge/Safari HTTPS)
      let copied=false;
      if(navigator.clipboard&&window.ClipboardItem){
        try{
          await new Promise((res,rej)=>canvas.toBlob(b=>{
            if(!b)return rej(new Error("blob null"));
            navigator.clipboard.write([new ClipboardItem({"image/png":b})])
              .then(res).catch(rej);
          },"image/png"));
          copied=true;
        }catch(e){console.warn("clipboard copy failed, fallback to download",e);}
      }
      if(copied){
        setImgCopied(true);
        setTimeout(()=>setImgCopied(false),2800);
      } else {
        // fallback: download do ficheiro
        const url=canvas.toDataURL("image/png");
        const a=document.createElement("a");
        a.href=url;
        a.download=`Relatorio_${session?.colaborador||"turno"}_${dtag}.png`;
        document.body.appendChild(a);a.click();document.body.removeChild(a);
      }
    }catch(e){console.error(e);}
    finally{setImgGenerating(false);}
  };

  // ── LOADING ────────────────────────────────────────────────────────────────
  if(loading)return(
    <div className="min-h-screen flex flex-col items-center justify-center gap-6" style={{background:"linear-gradient(160deg,#0a0a0a,#1a1a2e)"}}>
      <Logo size="lg" dark/>
      <div className="w-6 h-6 border-2 border-white border-t-transparent rounded-full spin opacity-60"/>
    </div>
  );

  // ── LOGIN ──────────────────────────────────────────────────────────────────
  // P2: só mostra login se não houver sessão E não estiver em guestMode
  if(!session&&!guestMode)return(
    <div className="min-h-screen flex flex-col" style={{background:"linear-gradient(160deg,#0a0a0a 0%,#1a1a2e 60%,#0f2027 100%)"}}>
      <div className="flex-1 flex flex-col items-center justify-center p-5 gap-7">
        <div className="fadeUp"><Logo size="lg" dark/></div>
        <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl fadeUp space-y-5">
          <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center">Iniciar turno</p>
          <div>
            <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Nome</p>
            <input value={lNome} onChange={e=>setLNome(e.target.value)} placeholder="O teu nome"
              className="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3.5 text-sm font-medium focus:outline-none focus:border-gray-400 focus:bg-white transition-all"/>
          </div>
          <div>
            <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Quiosque</p>
            <div className="relative">
              <select value={lQ} onChange={e=>setLQ(e.target.value)}
                className="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3.5 text-sm font-medium appearance-none focus:outline-none focus:border-gray-400 focus:bg-white transition-all cursor-pointer">
                <option value="">Selecionar...</option>
                {QUIOSQUES.map(q=><option key={q} value={q}>{q}</option>)}
              </select>
              <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-xs">▾</span>
            </div>
          </div>
          <div>
            <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Turno</p>
            <div className="grid grid-cols-2 gap-2">
              {TURNOS.map(t=>(
                <button key={t.id} onClick={()=>setLTurno(t.id)}
                  className={`py-4 rounded-2xl border-2 text-left px-4 transition-all active:scale-[.97]
                    ${lTurno===t.id?"border-gray-900 bg-gray-900 text-white":"border-gray-100 bg-gray-50 text-gray-700"}`}>
                  <p className={`font-black text-sm leading-tight ${lTurno===t.id?"text-white":"text-gray-800"}`}>{t.label}</p>
                  <p className={`text-xs mt-0.5 font-medium ${lTurno===t.id?"text-gray-300":"text-gray-400"}`}>{t.sub}</p>
                </button>
              ))}
            </div>
            {lTurno==="custom"&&(
              <div className="flex gap-3 mt-3 pop">
                {[[lCustomIn,setLCustomIn,"Entrada"],[lCustomOut,setLCustomOut,"Saída"]].map(([v,s,l])=>(
                  <div key={l} className="flex-1">
                    <p className="text-[10px] text-gray-400 font-semibold mb-1.5">{l}</p>
                    <input type="time" value={v} onChange={e=>s(e.target.value)}
                      className="w-full bg-gray-50 border border-gray-200 rounded-2xl px-3 py-3 text-sm font-medium focus:outline-none focus:border-gray-400 transition-all"/>
                  </div>
                ))}
              </div>
            )}
          </div>
          <button onClick={doLogin} disabled={!canLogin}
            className={`w-full py-4 rounded-2xl font-bold text-sm tracking-wide transition-all active:scale-95
              ${canLogin?"bg-gray-900 text-white shadow-lg":"bg-gray-100 text-gray-300 cursor-not-allowed"}`}>
            Entrar
          </button>
          {/* P2: Acesso ao dashboard sem turno */}
          <button onClick={()=>{setGuestMode(true);setTab("dash");}}
            className="w-full py-3.5 rounded-2xl border-2 border-gray-100 bg-gray-50 text-gray-500 font-bold text-sm active:scale-95 transition-all flex items-center justify-center gap-2">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
            </svg>
            Ver Dashboard (Gestor)
          </button>
        </div>
      </div>
    </div>
  );

  // ── RELATÓRIO ──────────────────────────────────────────────────────────────
  if(showReport)return(
    <div className="min-h-screen bg-gray-100 fadeUp">
      <div className="px-5 pt-12 pb-5 bg-white border-b border-gray-100">
        <button onClick={()=>setShowReport(false)} className="text-sm font-semibold text-blue-500 mb-4 block">← Voltar</button>
        <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Relatório de turno</p>
        <p className="text-2xl font-black text-gray-900">{session.colaborador}</p>
        <p className="text-sm text-gray-400 font-medium mt-0.5">{session.quiosque} · {session.horaEntrada}–{session.horaSaida}</p>
      </div>
      <div className="p-5 max-w-md mx-auto space-y-4 pb-12">
        {/* Card que será capturado como imagem */}
        <div id="report-card" className="space-y-4 p-4 rounded-3xl" style={{background:"#F0F0F5"}}>
          {/* Cabeçalho dentro da imagem */}
          <div className="bg-white rounded-3xl px-5 py-4">
            <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Relatório de turno</p>
            <p className="text-xl font-black text-gray-900">{session.colaborador}</p>
            <p className="text-xs text-gray-400 font-medium mt-0.5">{session.quiosque} · {session.horaEntrada}–{session.horaSaida}</p>
            <p className="text-xs text-gray-300 font-medium mt-0.5">{new Date().toLocaleDateString("pt-PT",{day:"2-digit",month:"long",year:"numeric"})}</p>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <KPIAbordagens total={myS.total} conversas={myS.conversas} recusas={myS.recusas}/>
            <KPIVendas total={myTotV} taxa={txConv}/>
          </div>
          <Card className="p-5">
            <SLabel>Detalhe de vendas</SLabel>
            <StatRow label="Combina" value={myS.combina}/>
            <StatRow label="Energia Galp" value={myS.energia}/>
            <StatRow label="Novo Cliente NOS" value={myS.novoCliente}/>
            <StatRow label="Alarme" value={myS.alarme}/>
          </Card>
          <div className="grid grid-cols-2 gap-3">
            <KPILeads total={myS.leads}/>
            <Card className="p-5">
              <SLabel>Perfil Combina</SLabel>
              {[["C0",myS.c0,"bg-gray-300"],["C1",myS.c1,"bg-yellow-400"],["C2",myS.c2,"bg-blue-400"],["C3",myS.c3,"bg-emerald-500"]].map(([l,v,c])=>(
                <div key={l} className="flex items-center gap-2 mb-1.5 last:mb-0">
                  <span className="text-[10px] text-gray-400 font-bold w-5">{l}</span>
                  <ProgressBar value={v} max={myS.conversas||1} color={c}/>
                  <span className="text-xs font-black text-gray-700 w-4 text-right">{v}</span>
                </div>
              ))}
            </Card>
          </div>
          {fechoObs&&(
            <Card className="p-5">
              <SLabel>Observações do turno</SLabel>
              <p className="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">{fechoObs}</p>
            </Card>
          )}
        </div>
        {/* Botões de ação — fora da área capturada */}
        <button onClick={generateImage} disabled={imgGenerating}
          className={`w-full py-4 rounded-2xl font-bold text-sm tracking-wide transition-all active:scale-95 shadow-sm flex items-center justify-center gap-2
            ${imgGenerating?"bg-gray-300 text-gray-500 cursor-wait":imgCopied?"bg-emerald-600 text-white":"bg-gray-900 text-white"}`}>
          {imgGenerating?(
            <><div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full spin"/>A gerar...</>
          ):imgCopied?(
            <>✓ Imagem copiada! Cola no WhatsApp</>
          ):(
            <><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
            </svg>Copiar Imagem (WhatsApp)</>
          )}
        </button>
        <button onClick={copyReport}
          className={`w-full py-4 rounded-2xl font-bold text-sm tracking-wide transition-all active:scale-95
            ${reportCopied?"bg-emerald-600 text-white":"border border-gray-200 bg-white text-gray-600"}`}>
          {reportCopied?"Copiado!":"Copiar texto (WhatsApp)"}
        </button>
        <button onClick={()=>exportXLS(myT,`Turno_${session.colaborador}_${dtag}.xlsx`,fechoObs)}
          className="w-full py-4 rounded-2xl font-bold text-sm border border-gray-200 bg-white text-gray-600 active:scale-95 transition-all">
          Exportar Excel
        </button>
        <button onClick={doLogout} className="w-full py-3 rounded-2xl font-semibold text-sm text-red-400 active:scale-95 transition-all">
          Terminar turno
        </button>
      </div>
    </div>
  );

  // ── MAIN APP ───────────────────────────────────────────────────────────────
  return(
    <div className="min-h-screen bg-gray-100">

      {/* P3: Modal de confirmação de Fecho de Turno */}
      {showFechoConfirm&&(
        <div className="fixed inset-0 z-50 flex items-end justify-center pb-6 px-4" style={{background:"rgba(0,0,0,0.55)"}}>
          <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl slideUp">
            <p className="font-black text-gray-900 text-xl mb-1">Fecho de Turno</p>
            <p className="text-sm text-gray-500 font-medium mb-5">Confirmas que queres fechar o turno?</p>
            <div className="mb-5">
              <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Observações (opcional)</p>
              <textarea
                value={fechoObs}
                onChange={e=>setFechoObs(e.target.value)}
                placeholder="Notas sobre o turno..."
                rows="3"
                className="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3.5 text-sm font-medium focus:outline-none focus:border-blue-300 focus:bg-white transition-all resize-none"/>
            </div>
            <div className="flex gap-3">
              <button onClick={()=>setShowFechoConfirm(false)}
                className="flex-1 py-4 rounded-2xl border-2 border-gray-200 text-gray-600 font-bold text-sm active:scale-95 transition-all">
                Não
              </button>
              <button onClick={doFechoTurno}
                className="flex-1 py-4 rounded-2xl bg-gray-900 text-white font-bold text-sm active:scale-95 transition-all">
                Sim, fechar
              </button>
            </div>
          </div>
        </div>
      )}

      {/* Header */}
      <div className="bg-white border-b border-gray-100 px-5 pt-10 pb-3">
        <div className="flex items-center justify-between max-w-md mx-auto">
          <div className="flex items-center gap-3">
            <Logo size="sm"/>
            {session?(
              <div>
                <div className="flex items-center gap-1.5">
                  <p className="font-bold text-gray-900 text-xs">{session.quiosque.replace("Quiosque ","")}</p>
                  <div className={`w-1.5 h-1.5 rounded-full ${syncing?"bg-amber-400":online?"bg-emerald-500":"bg-red-400"}`}/>
                </div>
                <p className="text-[10px] text-gray-400 font-medium">{session.colaborador} · {session.horaEntrada}–{session.horaSaida}</p>
              </div>
            ):(
              <div>
                <p className="font-bold text-gray-900 text-xs">Dashboard</p>
                <p className="text-[10px] text-gray-400 font-medium">Modo Gestor</p>
              </div>
            )}
          </div>
          {session?(
            /* P3: Botão "Fecho de turno" com modal de confirmação */
            <button onClick={()=>setShowFechoConfirm(true)}
              className="bg-gray-900 text-white text-[11px] font-bold px-3 py-2.5 rounded-xl tracking-wide active:scale-95 transition-all">
              Fecho de turno
            </button>
          ):(
            /* P2: Botão voltar para login quando em guestMode */
            <button onClick={()=>setGuestMode(false)}
              className="text-sm font-semibold text-blue-500 active:scale-95 transition-all">
              ← Login
            </button>
          )}
        </div>
      </div>

      {/* Tab bar */}
      {/* P2: Em guestMode apenas tab Dashboard; com sessão as 3 tabs normais */}
      <div className="bg-white border-b border-gray-100 sticky top-0 z-20">
        <div className="flex max-w-md mx-auto">
          {(session
            ? [["novo","Registo"],["hist","Histórico"],["dash","Dashboard"]]
            : [["dash","Dashboard"]]
          ).map(([id,lbl])=>(
            <button key={id} onClick={()=>setTab(id)}
              className={`flex-1 py-3.5 text-xs font-bold border-b-2 transition-all tracking-wide ${tab===id?"border-gray-900 text-gray-900":"border-transparent text-gray-300"}`}>
              {lbl}
            </button>
          ))}
        </div>
      </div>

      <div className="p-4 max-w-md mx-auto pb-20 space-y-3" key={tab}>

        {/* ── REGISTO ── */}
        {tab==="novo"&&session&&(
          <div className="space-y-3 fadeUp">

            {/* P4: Barra Live View / Ponto de Situação */}
            <LiveViewBar
              abordagens={myS.total}
              vendas={myTotV}
              leads={myS.leads}
              taxa={txConv}
            />

            <Card className="p-5">
              <div className="flex gap-1.5 mb-6">
                {steps.map((_,i)=><div key={i} className={`h-1 flex-1 rounded-full transition-all ${i<=step?"bg-gray-900":"bg-gray-100"}`}/>)}
              </div>
              {sn==="aceitou"&&<div className="pop space-y-2">
                <p className="text-xl font-black text-gray-900 mb-1">Abordagem</p>
                <p className="text-sm text-gray-400 font-medium mb-5">O cliente aceitou ouvir?</p>
                <RadioCard label="Sim, ouviu" desc="Ficou a ouvir a proposta" selected={aceitou===true} onClick={()=>setAceitou(true)} accentColor="border-emerald-500 bg-emerald-50"/>
                <RadioCard label="Não, recusou" desc="Não quis ouvir" selected={aceitou===false} onClick={()=>setAceitou(false)} accentColor="border-red-400 bg-red-50"/>
              </div>}
              {sn==="combina"&&<div className="pop space-y-2">
                <p className="text-xl font-black text-gray-900 mb-1">Perfil Combina</p>
                <p className="text-sm text-gray-400 font-medium mb-5">Nível do cliente</p>
                <RadioCard label="Sem Combina" desc="Sem Cartão Continente ativo" selected={isCombina===false} onClick={()=>setIC(false)}/>
                <RadioCard label="Combina 1" desc="Continente + NOS" selected={isCombina===1} onClick={()=>setIC(1)} accentColor="border-yellow-400 bg-yellow-50"/>
                <RadioCard label="Combina 2" desc="Continente + NOS + Galp Energia" selected={isCombina===2} onClick={()=>setIC(2)} accentColor="border-blue-400 bg-blue-50"/>
                <RadioCard label="Combina 3" desc="Continente + NOS + Galp Energia + Solar" selected={isCombina===3} onClick={()=>setIC(3)} accentColor="border-emerald-400 bg-emerald-50"/>
              </div>}
              {sn==="vendas"&&<div className="pop space-y-2">
                <p className="text-xl font-black text-gray-900 mb-1">Resultado</p>
                <p className="text-sm text-gray-400 font-medium mb-5">O que foi vendido?</p>
                {vendasPorCombina(isCombina).map(([key,label])=>(
                  <CheckCard key={key} label={label} checked={vendas[key]} onClick={()=>setVendas(v=>({...v,[key]:!v[key]}))}/>
                ))}
              </div>}
              <div className="flex gap-2 mt-6">
                {step>0&&!flash&&(
                  <button onClick={()=>setStep(s=>s-1)} className="px-5 py-4 rounded-2xl border border-gray-200 text-gray-500 font-bold text-sm active:scale-95 transition-all">←</button>
                )}
                {isFinal
                  ?<button onClick={saveRecord} disabled={flash}
                    className={`flex-1 py-4 rounded-2xl font-bold text-sm tracking-wide transition-all active:scale-95 shadow-sm
                      ${flash?"bg-emerald-600 text-white":"bg-gray-900 text-white disabled:bg-gray-100 disabled:text-gray-300"}`}>
                    {flash?"Guardado!":"Guardar"}
                  </button>
                  :<button onClick={()=>setStep(s=>s+1)} disabled={!canNext}
                    className={`flex-1 py-4 rounded-2xl font-bold text-sm tracking-wide transition-all active:scale-95 shadow-sm
                      ${canNext?"bg-gray-900 text-white":"bg-gray-100 text-gray-300 cursor-not-allowed"}`}>
                    Seguinte
                  </button>
                }
              </div>
            </Card>

            {/* P1: Lead card só aparece quando o cliente aceitou ouvir */}
            {aceitou===true&&(
              <Card className="p-5">
                <div className="flex items-center justify-between">
                  <div>
                    <p className="font-bold text-gray-900 text-sm">Registar Lead</p>
                    <p className="text-xs text-gray-400 font-medium mt-0.5">Contacto para follow-up</p>
                  </div>
                  <Toggle active={lead.active} onClick={()=>setLead(l=>({...l,active:!l.active}))}/>
                </div>
                {lead.active&&(
                  <div className="mt-4 space-y-2.5 pop">
                    <input value={lead.nome} onChange={e=>setLead(l=>({...l,nome:e.target.value}))} placeholder="Nome"
                      className="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3.5 text-sm font-medium focus:outline-none focus:border-blue-300 focus:bg-white transition-all"/>
                    <input value={lead.tel} onChange={e=>setLead(l=>({...l,tel:e.target.value}))} placeholder="Telefone" type="tel"
                      className="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3.5 text-sm font-medium focus:outline-none focus:border-blue-300 focus:bg-white transition-all"/>
                    <textarea value={lead.obs} onChange={e=>setLead(l=>({...l,obs:e.target.value}))} placeholder="Observações..." rows="2"
                      className="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3.5 text-sm font-medium focus:outline-none focus:border-blue-300 focus:bg-white transition-all resize-none"/>
                  </div>
                )}
              </Card>
            )}
          </div>
        )}

        {/* ── HISTÓRICO ── */}
        {tab==="hist"&&session&&(
          <div className="space-y-3 fadeUp">
            <Card className="p-5">
              <SLabel>Dia</SLabel>
              <input type="date" value={histDate} onChange={e=>setHistDate(e.target.value)}
                className="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3.5 text-sm font-medium focus:outline-none focus:border-gray-300 transition-all"/>
            </Card>
            <div className="flex gap-2 overflow-x-auto -mx-1 px-1 pb-1">
              {[["all","Todos"],["venda","Com Venda"],["lead","Lead"],["sem_venda","Sem Resultado"],["recusa","Recusa"]].map(([v,l])=>(
                <button key={v} onClick={()=>setHistFilter(v)}
                  className={`shrink-0 px-4 py-2.5 rounded-xl border text-xs font-bold transition-all
                    ${histFilter===v?"border-gray-900 bg-gray-900 text-white":"border-gray-200 bg-white text-gray-400"}`}>{l}</button>
              ))}
            </div>
            {(()=>{
              const dayR=records.filter(r=>isoDay(r.ts)===histDate);
              // P5: filtro "lead" mostra registos com lead independentemente do tipo
              // (inclui cenário venda+lead)
              const filtered=histFilter==="all"?dayR:
                histFilter==="lead"?dayR.filter(r=>r.lead):
                dayR.filter(r=>r.tipo===histFilter);
              const ds=stats(dayR);
              return(<>
                <Card className="overflow-hidden">
                  <div className="grid grid-cols-4">
                    {[["Total",ds.total,"#1f2937"],["Vendas",ds.vendas,"#059669"],["Leads",ds.leads,"#2563eb"],["Recusas",ds.recusas,"#f87171"]].map(([l,v,c],i)=>(
                      <div key={l} className={`py-4 text-center ${i<3?"border-r border-gray-100":""}`}>
                        <p className="text-2xl font-black" style={{color:c}}>{v}</p>
                        <p className="text-[10px] text-gray-400 font-bold mt-0.5">{l}</p>
                      </div>
                    ))}
                  </div>
                </Card>
                {filtered.length===0
                  ?<Card className="p-10 text-center"><p className="text-gray-300 font-medium text-sm">Sem registos</p></Card>
                  :filtered.map(r=>{
                    const cfg=TIPO_CFG[r.tipo]||TIPO_CFG.sem_venda;
                    return(
                      <div key={r.id} className={`rounded-3xl border-2 p-4 ${cfg.bg} ${cfg.border}`}>
                        <div className="flex items-start justify-between mb-2">
                          <div className="flex flex-wrap gap-1.5 flex-1">
                            <span className={`text-[11px] font-bold px-2.5 py-1 rounded-full ${cfg.badge}`}>{cfg.label}</span>
                            {/* P5: badge para registos com venda E lead */}
                            {r.lead&&r.tipo==="venda"&&(
                              <span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-blue-100 text-blue-700">+ Lead</span>
                            )}
                            {r.isCombina===false&&<span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-gray-200 text-gray-600">Sem Combina</span>}
                            {r.isCombina>0&&<span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-blue-100 text-blue-700">C{r.isCombina}</span>}
                            {r.vendas?.combina&&<span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-yellow-100 text-yellow-700">Combina</span>}
                            {r.vendas?.energia&&<span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-orange-100 text-orange-700">Energia</span>}
                            {r.vendas?.novoCliente&&<span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-purple-100 text-purple-700">Novo NOS</span>}
                            {r.vendas?.alarme&&<span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-gray-200 text-gray-700">Alarme</span>}
                          </div>
                          <div className="text-right shrink-0 ml-3">
                            <p className="text-[11px] text-gray-500 font-bold">{fmtTime(r.ts)}</p>
                            <p className="text-[10px] text-gray-400 font-medium">{r.colaborador}</p>
                          </div>
                        </div>
                        {r.lead&&(
                          <div className="bg-white bg-opacity-70 rounded-xl p-3 mt-1.5">
                            <p className="text-xs font-bold text-blue-700">{r.lead.nome}{r.lead.tel?` · ${r.lead.tel}`:""}</p>
                            {r.lead.obs&&<p className="text-xs text-gray-400 mt-0.5">{r.lead.obs}</p>}
                          </div>
                        )}
                      </div>
                    );
                  })
                }
              </>);
            })()}
          </div>
        )}

        {/* ── DASHBOARD ── */}
        {/* P2: Dashboard acessível sem sessão (guestMode) */}
        {tab==="dash"&&(
          <div className="fadeUp">
            {!unlocked?(
              <Card className="p-6 text-center">
                <div className="w-14 h-14 bg-gray-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </div>
                <p className="font-black text-gray-900 text-lg mb-1">Dashboard</p>
                <p className="text-sm text-gray-400 font-medium mb-6">Acesso exclusivo para gestores</p>
                <input type="password" value={pin} onChange={e=>setPin(e.target.value)}
                  onKeyDown={e=>{if(e.key==="Enter"){if(pin===DASHBOARD_PIN){setUnlocked(true);setPinErr(false);}else setPinErr(true);}}}
                  placeholder="PIN"
                  className={`w-full border-2 rounded-2xl px-4 py-4 text-center text-xl font-black tracking-[.5em] mb-2 focus:outline-none transition-all
                    ${pinErr?"border-red-300 bg-red-50":"border-gray-100 bg-gray-50 focus:border-gray-400 focus:bg-white"}`}/>
                {pinErr&&<p className="text-xs text-red-400 font-bold mb-3">PIN incorreto</p>}
                <button onClick={()=>{if(pin===DASHBOARD_PIN){setUnlocked(true);setPinErr(false);}else setPinErr(true);}}
                  className="w-full py-4 rounded-2xl bg-gray-900 text-white font-bold text-sm tracking-wide active:scale-95 transition-all">
                  Entrar
                </button>
              </Card>
            ):(()=>{
              const pr=getDashRecords();
              const as=stats(pr);
              const totV=as.combina+as.energia+as.novoCliente+as.alarme;
              const txDash=as.conversas>0?Math.round(totV/as.conversas*100):0;
              const byQ=QUIOSQUES.map(q=>({q,s:stats(pr.filter(r=>r.quiosque===q))}));
              const days=[...new Set(records.map(r=>isoDay(r.ts)))].sort().reverse().slice(0,15);
              const dayStats=days.map(d=>({d,s:stats(records.filter(r=>isoDay(r.ts)===d))}));
              const collabs=[...new Set(pr.map(r=>r.colaborador))].filter(Boolean);
              const colStats=collabs.map(c=>({c,q:pr.find(r=>r.colaborador===c)?.quiosque||"",s:stats(pr.filter(r=>r.colaborador===c))}))
                .sort((a,b)=>(b.s.vendas+b.s.leads)-(a.s.vendas+a.s.leads));

              return(<div className="space-y-3">
                <div className="flex items-center justify-between">
                  <p className="font-black text-gray-900">Dashboard</p>
                  <button onClick={()=>setUnlocked(false)} className="text-xs text-gray-400 font-semibold">Bloquear</button>
                </div>

                <Card className="p-4">
                  <div className="flex items-center justify-between mb-3">
                    <SLabel>Período</SLabel>
                    <button onClick={()=>{setDashFrom(todayISO());setDashTo(todayISO());}}
                      className="text-[10px] font-bold text-blue-500 bg-blue-50 px-2.5 py-1 rounded-lg active:scale-95 transition-all -mt-2">
                      Hoje
                    </button>
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <p className="text-[10px] text-gray-400 font-semibold mb-1.5">De</p>
                      <input type="date" value={dashFrom}
                        onChange={e=>{const v=e.target.value;setDashFrom(v);if(v>dashTo)setDashTo(v);}}
                        className="w-full bg-gray-50 border border-gray-100 rounded-2xl px-3 py-3 text-sm font-medium focus:outline-none focus:border-gray-300 transition-all"/>
                    </div>
                    <div>
                      <p className="text-[10px] text-gray-400 font-semibold mb-1.5">Até</p>
                      <input type="date" value={dashTo}
                        onChange={e=>{const v=e.target.value;setDashTo(v);if(v<dashFrom)setDashFrom(v);}}
                        className="w-full bg-gray-50 border border-gray-100 rounded-2xl px-3 py-3 text-sm font-medium focus:outline-none focus:border-gray-300 transition-all"/>
                    </div>
                  </div>
                  <div className="mt-3 flex items-center justify-between">
                    <p className="text-xs text-gray-400 font-medium">{pr.length} registos · <span className="font-bold text-gray-600">{getPeriodLabel()}</span></p>
                    <button onClick={()=>exportXLS(pr,getExportFilename())}
                      className="text-xs font-bold text-emerald-600 bg-emerald-50 px-3 py-1.5 rounded-lg active:scale-95 transition-all">
                      Exportar Excel
                    </button>
                  </div>
                </Card>

                <div className="flex gap-2 overflow-x-auto -mx-1 px-1 pb-1">
                  {[["geral","Geral"],["quiosques","Quiosques"],["dias","Por Dia"],["colabs","Equipa"],["leads","Leads"]].map(([v,l])=>(
                    <button key={v} onClick={()=>setDashView(v)}
                      className={`shrink-0 px-4 py-2.5 rounded-xl border text-xs font-bold transition-all
                        ${dashView===v?"border-gray-900 bg-gray-900 text-white":"border-gray-200 bg-white text-gray-400"}`}>{l}</button>
                  ))}
                </div>

                {dashView==="geral"&&<div className="space-y-3">
                  <div className="grid grid-cols-2 gap-3">
                    <KPIAbordagens total={as.total} conversas={as.conversas} recusas={as.recusas}/>
                    <KPIVendas total={totV} taxa={txDash}/>
                  </div>
                  <Card className="p-5">
                    <SLabel>Por produto</SLabel>
                    <StatRow label="Combina" value={as.combina}/>
                    <StatRow label="Energia Galp" value={as.energia}/>
                    <StatRow label="Novo Cliente NOS" value={as.novoCliente}/>
                    <StatRow label="Alarme" value={as.alarme}/>
                  </Card>
                  <div className="grid grid-cols-2 gap-3">
                    <KPILeads total={as.leads}/>
                    <Card className="p-5">
                      <SLabel>Perfil Combina</SLabel>
                      {[["C0",as.c0,"bg-gray-300"],["C1",as.c1,"bg-yellow-400"],["C2",as.c2,"bg-blue-400"],["C3",as.c3,"bg-emerald-500"]].map(([l,v,c])=>(
                        <div key={l} className="flex items-center gap-2 mb-1.5 last:mb-0">
                          <span className="text-[10px] text-gray-400 font-bold w-5">{l}</span>
                          <ProgressBar value={v} max={as.conversas||1} color={c}/>
                          <span className="text-xs font-black text-gray-700 w-4 text-right">{v}</span>
                        </div>
                      ))}
                    </Card>
                  </div>
                </div>}

                {dashView==="quiosques"&&<div className="space-y-3">{byQ.map(({q,s})=>{
                  const tv=s.combina+s.energia+s.novoCliente+s.alarme;
                  return(
                    <Card key={q} className="overflow-hidden">
                      <div className="px-5 pt-5 pb-3 border-b border-gray-50 flex items-center justify-between">
                        <p className="font-black text-gray-900">{q.replace("Quiosque ","")}</p>
                        <span className="text-xs font-bold text-gray-400">{s.total} abordagens</span>
                      </div>
                      <div className="grid grid-cols-3 border-b border-gray-50">
                        {[["Conversas",s.conversas,"#059669"],["Vendas",tv,"#1f2937"],["Leads",s.leads,"#2563eb"]].map(([l,v,c],i)=>(
                          <div key={l} className={`py-4 text-center ${i<2?"border-r border-gray-100":""}`}>
                            <p className="text-2xl font-black" style={{color:c}}>{v}</p>
                            <p className="text-[10px] text-gray-400 font-bold mt-0.5">{l}</p>
                          </div>
                        ))}
                      </div>
                      <div className="px-5 py-3">
                        <StatRow label="Combina" value={s.combina}/>
                        <StatRow label="Energia" value={s.energia}/>
                        <StatRow label="Novo NOS" value={s.novoCliente}/>
                        <StatRow label="Alarme" value={s.alarme}/>
                      </div>
                      <div className="px-5 pb-4 flex items-center gap-3">
                        <span className="text-xs text-gray-400 font-medium">Conversão</span>
                        <ProgressBar value={tv} max={s.conversas||1}/>
                        <span className="text-xs font-black text-gray-900">{s.conversas>0?Math.round(tv/s.conversas*100):0}%</span>
                      </div>
                    </Card>
                  );
                })}</div>}

                {dashView==="dias"&&<Card className="divide-y divide-gray-50">
                  {dayStats.length===0&&<div className="p-10 text-center"><p className="text-gray-300 text-sm">Sem dados</p></div>}
                  {dayStats.map(({d,s})=>{
                    const tv=s.combina+s.energia+s.novoCliente+s.alarme;
                    const maxV=Math.max(...dayStats.map(x=>x.s.combina+x.s.energia+x.s.novoCliente+x.s.alarme),1);
                    return(
                      <div key={d} className="px-5 py-4">
                        <div className="flex items-center justify-between mb-2">
                          <p className="text-sm font-black text-gray-700">{new Date(d+"T12:00:00").toLocaleDateString("pt-PT",{weekday:"short",day:"2-digit",month:"short"})}</p>
                          <div className="flex gap-1.5">
                            <span className="text-[11px] bg-gray-100 text-gray-600 font-bold px-2.5 py-1 rounded-full">{s.total}</span>
                            <span className="text-[11px] font-bold px-2.5 py-1 rounded-full" style={{background:"#f0fdf4",color:"#16a34a"}}>{tv} vend.</span>
                            <span className="text-[11px] font-bold px-2.5 py-1 rounded-full" style={{background:"#eff6ff",color:"#2563eb"}}>{s.leads} leads</span>
                          </div>
                        </div>
                        <ProgressBar value={tv} max={maxV} color="bg-emerald-500"/>
                      </div>
                    );
                  })}
                </Card>}

                {dashView==="colabs"&&<div className="space-y-3">
                  {colStats.length===0&&<Card className="p-10 text-center"><p className="text-gray-300 text-sm">Sem dados</p></Card>}
                  {colStats.map(({c,q,s},i)=>{
                    const tv=s.combina+s.energia+s.novoCliente+s.alarme;
                    const rc=["bg-gray-900 text-white","bg-gray-600 text-white","bg-gray-400 text-white"];
                    return(
                      <Card key={c} className="p-5">
                        <div className="flex items-center gap-3 mb-4">
                          <div className={`w-9 h-9 rounded-2xl flex items-center justify-center font-black text-sm shrink-0 ${rc[i]||"bg-gray-100 text-gray-500"}`}>{i+1}</div>
                          <div className="flex-1">
                            <p className="font-bold text-gray-900 text-sm">{c}</p>
                            <p className="text-xs text-gray-400 font-medium">{q.replace("Quiosque ","")}</p>
                          </div>
                          <div className="text-right">
                            <p className="font-black text-lg" style={{color:"#059669"}}>{tv}</p>
                            <p className="text-[10px] text-gray-400 font-bold">vendas</p>
                          </div>
                        </div>
                        <StatRow label="Abordagens" value={s.total}/>
                        <StatRow label="Leads" value={s.leads}/>
                        <div className="mt-3 flex items-center gap-3">
                          <span className="text-xs text-gray-400 font-medium">Conversão</span>
                          <ProgressBar value={tv} max={s.conversas||1} color="bg-emerald-500"/>
                          <span className="text-xs font-black text-gray-900">{s.conversas>0?Math.round(tv/s.conversas*100):0}%</span>
                        </div>
                      </Card>
                    );
                  })}
                </div>}

                {dashView==="leads"&&<div className="space-y-3">
                  <div className="grid grid-cols-3 overflow-hidden rounded-3xl shadow-sm bg-white">
                    {[["Total",as.leads],["Hoje",today.filter(r=>r.lead).length],["Quiosques",QUIOSQUES.filter(q=>pr.some(r=>r.lead&&r.quiosque===q)).length]].map(([l,v],i)=>(
                      <div key={l} className={`py-4 text-center ${i<2?"border-r border-gray-100":""}`}>
                        <p className="text-2xl font-black" style={{color:"#2563eb"}}>{v}</p>
                        <p className="text-[10px] text-gray-400 font-bold mt-0.5">{l}</p>
                      </div>
                    ))}
                  </div>
                  {pr.filter(r=>r.lead).length===0
                    ?<Card className="p-10 text-center"><p className="text-gray-300 text-sm">Sem leads</p></Card>
                    :pr.filter(r=>r.lead).map(r=>(
                      <Card key={r.id} className="p-4">
                        <div className="flex justify-between items-start mb-1.5">
                          <p className="font-bold text-gray-900 text-sm">{r.lead.nome}</p>
                          <p className="text-[11px] text-gray-400 shrink-0 ml-2 font-medium">{fmtDate(r.ts)}</p>
                        </div>
                        {r.lead.tel&&<p className="text-sm text-gray-500 font-medium mb-1">{r.lead.tel}</p>}
                        {r.lead.obs&&<p className="text-xs text-gray-400 mb-2">{r.lead.obs}</p>}
                        <div className="flex gap-1.5 flex-wrap">
                          <span className="text-[11px] bg-gray-100 text-gray-600 font-bold px-2.5 py-1 rounded-full">{r.colaborador}</span>
                          <span className="text-[11px] font-bold px-2.5 py-1 rounded-full" style={{background:"#eff6ff",color:"#2563eb"}}>{r.quiosque?.replace("Quiosque ","")}</span>
                          {/* P5: badge indica que esta lead tem também uma venda */}
                          {r.tipo==="venda"&&(
                            <span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700">+ Venda</span>
                          )}
                        </div>
                      </Card>
                    ))
                  }
                  <button onClick={()=>exportXLS(pr.filter(r=>r.lead),`Leads_${dtag}.xlsx`)}
                    className="w-full py-4 rounded-2xl border border-gray-200 bg-white font-bold text-sm text-gray-600 active:scale-95 transition-all">
                    Exportar Leads (Excel)
                  </button>
                </div>}

              </div>);
            })()}
          </div>
        )}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
