const ls = k => { try{return JSON.parse(localStorage.getItem(k)||"null")}catch{return null} };
const lsa = k => { try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return []} };
const lss = (k,v) => localStorage.setItem(k, JSON.stringify(v));

const todayStr = () => new Date().toDateString();
const fmtDate = iso => new Date(iso).toLocaleDateString("pt-PT");
const fmtTime = iso => new Date(iso).toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
const isoDay = iso => iso.slice(0,10);

// Vendas disponíveis por perfil Combina
const vendasPorCombina = ic => {
  if(ic===false) return [["combina","🃏 Ativar Combina"],["energia","⚡ Energia Galp"],["novoCliente","📱 Novo Cliente NOS"],["alarme","🔒 Alarme"]];
  if(ic===1)     return [["energia","⚡ Energia Galp"],["alarme","🔒 Alarme"]];
  if(ic===2)     return [["alarme","🔒 Alarme"]];
  if(ic===3)     return [["alarme","🔒 Alarme"]];
  return [];
};

const toRow = r => ({
  id:r.id, ts:r.ts,
  colaborador:r.colaborador||"",
  quiosque:r.quiosque||"",
  hora_entrada:r.horaEntrada||"",
  hora_saida:r.horaSaida||"",
  aceitou:!!r.aceitou,
  is_combina:r.isCombina==null?null:r.isCombina===false?0:Number(r.isCombina),
  vendeu_combina:!!(r.vendas?.combina),
  venda_energia:!!(r.vendas?.energia),
  venda_novo_cliente:!!(r.vendas?.novoCliente),
  venda_alarme:!!(r.vendas?.alarme),
  tem_lead:!!r.lead,
  lead_nome:r.lead?.nome||null,
  lead_tel:r.lead?.tel||null,
  lead_obs:r.lead?.obs||null,
});

const fromRow = row => {
  const temVenda = row.vendeu_combina||row.venda_energia||row.venda_novo_cliente||row.venda_alarme;
  return {
    id:row.id, ts:row.ts,
    colaborador:row.colaborador,
    quiosque:row.quiosque,
    horaEntrada:row.hora_entrada,
    horaSaida:row.hora_saida,
    aceitou:row.aceitou,
    isCombina:row.is_combina==null?null:row.is_combina===0?false:row.is_combina,
    vendas:{combina:row.vendeu_combina,energia:row.venda_energia,novoCliente:row.venda_novo_cliente,alarme:row.venda_alarme},
    lead:row.tem_lead?{nome:row.lead_nome,tel:row.lead_tel,obs:row.lead_obs}:null,
    tipo: !row.aceitou?"recusa": temVenda?"venda": row.tem_lead?"lead":"sem_venda",
  };
};

const stats = arr => ({
  total:arr.length,
  recusas:arr.filter(r=>!r.aceitou).length,
  conversas:arr.filter(r=>r.aceitou).length,
  combina:arr.filter(r=>r.vendas?.combina).length,
  energia:arr.filter(r=>r.vendas?.energia).length,
  novoCliente:arr.filter(r=>r.vendas?.novoCliente).length,
  alarme:arr.filter(r=>r.vendas?.alarme).length,
  leads:arr.filter(r=>r.lead).length,
  vendas:arr.filter(r=>r.tipo==="venda").length,
  semVenda:arr.filter(r=>r.tipo==="sem_venda").length,
  c0:arr.filter(r=>r.isCombina===false).length,
  c1:arr.filter(r=>r.isCombina===1).length,
  c2:arr.filter(r=>r.isCombina===2).length,
  c3:arr.filter(r=>r.isCombina===3).length,
});

const exportCSV = (data,filename) => {
  if(!data.length){alert("Sem dados.");return}
  const h=["Data","Hora","Quiosque","Colaborador","Entrada","Saida","Aceitou","Combina","VendaCombina","VendaEnergia","VendaNovoCliente","VendaAlarme","Lead","LeadNome","LeadTel","LeadObs"];
  const rows=data.map(r=>[
    fmtDate(r.ts),fmtTime(r.ts),r.quiosque||"",r.colaborador||"",r.horaEntrada||"",r.horaSaida||"",
    r.aceitou?"Sim":"Não",
    r.isCombina===false?"Sem Combina":r.isCombina?`Combina ${r.isCombina}`:"",
    r.vendas?.combina?"Sim":"Não",r.vendas?.energia?"Sim":"Não",r.vendas?.novoCliente?"Sim":"Não",r.vendas?.alarme?"Sim":"Não",
    r.lead?"Sim":"Não",r.lead?.nome||"",r.lead?.tel||"",(r.lead?.obs||"").replace(/"/g,"'"),
  ].map(v=>`"${String(v).replace(/"/g,"''")}"`).join(","));
  const blob=new Blob(["\ufeff"+[h.join(","),...rows].join("\n")],{type:"text/csv;charset=utf-8;"});
  const a=Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:filename});
  a.click();URL.revokeObjectURL(a.href);
};

};

const Btn=({children,onClick,disabled,variant="primary",className=""})=>{
  const base="w-full py-4 rounded-2xl font-black text-base transition-all active:scale-95 "+className;
  const v={
    primary:"bg-black text-white shadow-lg disabled:bg-gray-200 disabled:text-gray-400 disabled:shadow-none",
    outline:"border-2 border-gray-300 text-gray-700 bg-white",
    ghost:"text-gray-500 bg-gray-100",
    danger:"border-2 border-red-300 text-red-500 bg-white",
    green:"bg-emerald-600 text-white shadow-lg",
    blue:"bg-blue-600 text-white shadow-lg",
  };
  return <button onClick={onClick} disabled={disabled} className={`${base} ${v[variant]||v.primary}`}>{children}</button>;

const Choice=({label,icon,desc,selected,onClick,color=""})=>(

// ─── APP ─────────────────────────────────────────────────────────────────────

function App(){
  const [tab,setTab]=useState("novo");
  const [records,setRecs]=useState(()=>lsa(CK));
  const [loading,setLoading]=useState(true);
  const [syncing,setSyncing]=useState(false);
  const [online,setOnline]=useState(true);
  const [lastSync,setLastSync]=useState(null);
  const [session,setSession]=useState(()=>ls(SK));

  // Login form
  const [lNome,setLNome]=useState("");
  const [lQuiosque,setLQuiosque]=useState("");
  const [lEntrada,setLEntrada]=useState("");
  const [lSaida,setLSaida]=useState("");

  // Wizard
  const [step,setStep]=useState(0);
  const [aceitou,setAceitou]=useState(null);
  const [isCombina,setIsCombina]=useState(null);
  const [vendas,setVendas]=useState({combina:false,energia:false,novoCliente:false,alarme:false});
  const [criarLead,setCriarLead]=useState(null);
  const [leadNome,setLeadNome]=useState("");
  const [leadTel,setLeadTel]=useState("");
  const [leadObs,setLeadObs]=useState("");
  const [flash,setFlash]=useState(false);

  // Histórico
  const [histDate,setHistDate]=useState(new Date().toISOString().slice(0,10));
  const [histFilter,setHistFilter]=useState("all");

  // Dashboard
  const [dashPin,setDashPin]=useState("");
  const [dashUnlocked,setDashUnlocked]=useState(false);
  const [dashPinError,setDashPinError]=useState(false);
  const [dashView,setDashView]=useState("geral");
  const [dashPeriod,setDashPeriod]=useState("today");
  const [showReport,setShowReport]=useState(false);

  // Relatório de turno
  const [reportFlash,setReportFlash]=useState(false);

  const fetchData=useCallback(async()=>{
    try{
      const {data,error}=await db.from("abordagens").select("*").order("ts",{ascending:false});
      if(error)throw error;
      const recs=(data||[]).map(fromRow);
      setRecs(recs);lss(CK,recs);
      setOnline(true);setLastSync(new Date());
    }catch{setOnline(false);}
    finally{setLoading(false);}
  },[]);

  useEffect(()=>{fetchData();const t=setInterval(fetchData,60000);return()=>clearInterval(t);},[fetchData]);

  useEffect(()=>{
    if(!online)return;
    const q=lsa(QK);if(!q.length)return;
    db.from("abordagens").upsert(q).then(({error})=>{if(!error){lss(QK,[]);fetchData();}});
  },[online,fetchData]);

  const reset=()=>{
    setStep(0);setAceitou(null);setIsCombina(null);
    setVendas({combina:false,energia:false,novoCliente:false,alarme:false});
    setCriarLead(null);setLeadNome("");setLeadTel("");setLeadObs("");
  };

  const doLogin=()=>{
    const s={colaborador:lNome,quiosque:lQuiosque,horaEntrada:lEntrada,horaSaida:lSaida,loginTs:new Date().toISOString()};
    setSession(s);lss(SK,s);
  };
  const doLogout=()=>{localStorage.removeItem(SK);setSession(null);setShowReport(false);reset();};

  const temVenda=()=>Object.values(vendas).some(v=>v);

  // Steps dinâmicos
  const buildSteps=()=>{
    if(aceitou===false)return["aceitou"];
    const s=["aceitou","combina"];
    if(isCombina!==null)s.push("vendas");
    if(criarLead===true)s.push("lead");
    return s;
  };
  const steps=buildSteps();
  const sn=steps[step];
  const isFinal=(sn==="aceitou"&&aceitou===false)||(sn==="vendas"&&(temVenda()||criarLead===false))||sn==="lead";
  const canNext={aceitou:aceitou!==null,combina:isCombina!==null,vendas:temVenda()||criarLead!==null,lead:true}[sn]??false;

  const saveRecord=async()=>{
    const hasVenda=temVenda();
    const r={
      id:Date.now(),ts:new Date().toISOString(),
      colaborador:session.colaborador,quiosque:session.quiosque,
      horaEntrada:session.horaEntrada,horaSaida:session.horaSaida,
      aceitou,
      isCombina:aceitou?isCombina:null,
      vendas:aceitou?vendas:null,
      lead:criarLead&&!hasVenda?{nome:leadNome||"—",tel:leadTel,obs:leadObs}:null,
    };
    // tipo
    if(!aceitou) r.tipo="recusa";
    else if(hasVenda) r.tipo="venda";
    else if(r.lead) r.tipo="lead";
    else r.tipo="sem_venda";

    setRecs(p=>[r,...p]);setSyncing(true);
    try{
      const{error}=await db.from("abordagens").insert([toRow(r)]);
      if(error)throw error;setOnline(true);
    }catch{
      setOnline(false);const q=lsa(QK);q.push(toRow(r));lss(QK,q);
    }finally{
      setSyncing(false);setFlash(true);
      setTimeout(()=>{setFlash(false);reset();},1500);
    }
  };

  const today=records.filter(r=>new Date(r.ts).toDateString()===todayStr());
  const myToday=session?today.filter(r=>r.colaborador===session?.colaborador&&r.quiosque===session?.quiosque):[];
  const myS=stats(myToday);
  const myTotV=myS.combina+myS.energia+myS.novoCliente+myS.alarme;
  const txConv=myS.conversas>0?Math.round(myTotV/myS.conversas*100):0;
  const dtag=new Date().toLocaleDateString("pt-PT").replace(/\//g,"-");

  const reportText=()=>[
    `📋 RELATÓRIO DE TURNO — ${new Date().toLocaleDateString("pt-PT")}`,
    `👤 ${session?.colaborador} | 📍 ${session?.quiosque}`,
    `🕐 ${session?.horaEntrada}–${session?.horaSaida}`,
    ``,`📊 ABORDAGENS`,
    `• Total: ${myS.total} | Recusas: ${myS.recusas} | Conversas: ${myS.conversas}`,
    ``,`💰 VENDAS (${myTotV})`,
    `• 🃏 Combina: ${myS.combina}`,
    `• ⚡ Energia: ${myS.energia}`,
    `• 📱 Novo NOS: ${myS.novoCliente}`,
    `• 🔒 Alarme: ${myS.alarme}`,
    ``,`📩 LEADS: ${myS.leads}`,
    ...myToday.filter(r=>r.lead).map(r=>`   - ${r.lead.nome}${r.lead.tel?` · ${r.lead.tel}`:""}${r.lead.obs?` | ${r.lead.obs}`:""}`),
    ``,`📈 Taxa conversão: ${txConv}%`,
  ].join("\n");

  const copyReport=()=>{
    const t=reportText();
    if(navigator.clipboard){navigator.clipboard.writeText(t).catch(()=>fbCopy(t));}else{fbCopy(t);}
    setReportFlash(true);setTimeout(()=>setReportFlash(false),2000);
  };
  const fbCopy=t=>{const el=document.createElement("textarea");el.value=t;document.body.appendChild(el);el.select();document.execCommand("copy");document.body.removeChild(el);};
  const canLogin=lNome.trim()&&lQuiosque&&lEntrada&&lSaida;

  // ── LOADING ───────────────────────────────────────────────────────────────
  if(loading) return(
    <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center gap-6">
      <Logo size="lg"/>
      <div className="w-8 h-8 border-4 border-black border-t-transparent rounded-full spin"/>
      <p className="text-xs text-gray-400 font-semibold tracking-widest uppercase">A ligar...</p>
    </div>
  );

  // ── LOGIN ─────────────────────────────────────────────────────────────────
  if(!session) return(
    <div className="min-h-screen flex flex-col" style={{background:"linear-gradient(135deg,#0f0f0f 0%,#1a1a2e 100%)"}}>
      <div className="flex-1 flex flex-col items-center justify-center p-6">
        <div className="mb-8"><Logo size="lg"/></div>
        <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl fadeIn">
          <p className="text-center text-xs font-black text-gray-400 uppercase tracking-widest mb-6">Iniciar turno</p>

          <label className="text-xs font-black text-gray-500 uppercase tracking-wider mb-2 block">Nome</label>
          <input value={lNome} onChange={e=>setLNome(e.target.value)} placeholder="O teu nome completo"
            className="w-full border-2 border-gray-100 bg-gray-50 rounded-2xl px-4 py-3.5 text-sm font-medium mb-4 focus:outline-none focus:border-black focus:bg-white transition-all"/>

          <label className="text-xs font-black text-gray-500 uppercase tracking-wider mb-2 block">Quiosque</label>
          <div className="relative mb-4">
            <select value={lQuiosque} onChange={e=>setLQuiosque(e.target.value)}
              className="w-full border-2 border-gray-100 bg-gray-50 rounded-2xl px-4 py-3.5 text-sm font-medium appearance-none focus:outline-none focus:border-black focus:bg-white transition-all">
              <option value="">Seleciona o quiosque...</option>
              {QUIOSQUES.map(q=><option key={q} value={q}>{q}</option>)}
            </select>
            <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none">▾</span>
          </div>

          <label className="text-xs font-black text-gray-500 uppercase tracking-wider mb-2 block">Horário</label>
          <div className="flex gap-3 mb-6">
            {[["lEntrada",lEntrada,setLEntrada,"Entrada"],["lSaida",lSaida,setLSaida,"Saída"]].map(([k,val,set,lbl])=>(
              <div key={k} className="flex-1">
                <p className="text-xs text-gray-400 mb-1">{lbl}</p>
                <input type="time" value={val} onChange={e=>set(e.target.value)}
                  className="w-full border-2 border-gray-100 bg-gray-50 rounded-2xl px-3 py-3 text-sm font-medium focus:outline-none focus:border-black focus:bg-white transition-all"/>
              </div>
            ))}
          </div>

          <button onClick={doLogin} disabled={!canLogin}
            className={`w-full py-4 rounded-2xl font-black text-base text-white transition-all active:scale-95 shadow-lg
              ${canLogin?"bg-black hover:bg-gray-800":"bg-gray-200 text-gray-400 cursor-not-allowed shadow-none"}`}>
            Começar turno →
          </button>
        </div>
        <p className="text-gray-600 text-xs mt-6 font-medium">Quiosque Combina · Lojas NOS</p>
      </div>
    </div>
  );

  // ── RELATÓRIO DE TURNO ───────────────────────────────────────────────────
  if(showReport) return(
    <div className="min-h-screen bg-gray-50 fadeIn">
      <div className="bg-white px-4 py-4 shadow-sm border-b flex items-center gap-3">
        <button onClick={()=>setShowReport(false)} className="text-2xl font-black text-gray-600 pr-2">←</button>
        <div>
          <p className="font-black text-gray-900">Relatório de Turno</p>
          <p className="text-xs text-gray-400">{session.quiosque} · {session.horaEntrada}–{session.horaSaida}</p>
        </div>
      </div>
      <div className="p-4 max-w-md mx-auto space-y-3 pb-10">

        {/* Cabeçalho */}
        <div className="bg-black text-white rounded-2xl p-5">
          <p className="text-xs opacity-50 uppercase tracking-wider mb-1">Turno de</p>
          <p className="text-xl font-black">{session.colaborador}</p>
          <p className="text-xs opacity-60 mt-1">{session.quiosque} · {new Date().toLocaleDateString("pt-PT")}</p>
          <p className="text-xs opacity-60">{session.horaEntrada} – {session.horaSaida}</p>
        </div>

        {/* KPIs */}
        <div className="grid grid-cols-2 gap-2">
          <KPI label="Abordagens" value={myS.total} icon="👥" bg="bg-orange-50" tc="text-orange-600"/>
          <KPI label="Recusas" value={myS.recusas} icon="😐" bg="bg-red-50" tc="text-red-500"/>
          <KPI label="Conversas" value={myS.conversas} icon="😊" bg="bg-blue-50" tc="text-blue-700"/>
          <KPI label="Taxa Conv." value={`${txConv}%`} icon="📈" bg="bg-green-50" tc="text-green-700"/>
        </div>

        {/* Vendas */}
        <div className="bg-white rounded-2xl p-4 shadow-sm">
          <p className="text-xs font-black text-gray-400 uppercase tracking-wider mb-3">💰 Vendas ({myTotV})</p>
          <div className="grid grid-cols-2 gap-2">
            {[["🃏 Combina",myS.combina,"bg-yellow-50 text-yellow-700"],["⚡ Energia",myS.energia,"bg-green-50 text-green-700"],["📱 Novo NOS",myS.novoCliente,"bg-orange-50 text-orange-700"],["🔒 Alarme",myS.alarme,"bg-purple-50 text-purple-700"]].map(([l,v,c])=>(
              <div key={l} className={`text-center rounded-xl p-3 ${c}`}><p className="text-2xl font-black">{v}</p><p className="text-xs font-bold">{l}</p></div>
            ))}
          </div>
        </div>

        {/* Combina */}
        <div className="bg-white rounded-2xl p-4 shadow-sm">

                      </div>
                      <div className="grid grid-cols-4 gap-1">
                        {[["🃏",s.combina,"bg-yellow-50 text-yellow-600"],["⚡",s.energia,"bg-green-50 text-green-600"],["📱",s.novoCliente,"bg-orange-50 text-orange-600"],["🔒",s.alarme,"bg-purple-50 text-purple-600"]].map(([ic,v,c])=>(
                          <div key={ic} className={`text-center rounded-xl p-2 ${c}`}><p className="text-lg font-black">{v}</p><p className="text-xs">{ic}</p></div>
                        ))}
                      </div>
                      <div className="mt-3">
                        <div className="flex justify-between text-xs mb-1 text-gray-500"><span>Taxa conversão</span><span className="font-black">{s.conversas>0?Math.round(tv/s.conversas*100):0}%</span></div>
                        <Bar value={tv} max={s.conversas||1} color="bg-black"/>
                      </div>
                    </div>
                  );
                })}
              </>}

              {/* ─ POR DIA ─ */}
              {dashView==="dias"&&<>
                <div className="bg-white rounded-2xl p-4 shadow-sm">
                  <p className="text-xs font-black text-gray-400 uppercase tracking-wider mb-3">Evolução diária</p>
                  {dayStats.length===0&&<p className="text-center text-gray-400 text-sm py-4">Sem dados</p>}
                  {dayStats.map(({d,s})=>{
                    const tv=s.combina+s.energia+s.novoCliente+s.alarme;
                    return(
                      <div key={d} className="mb-4 pb-4 border-b border-gray-100 last:border-0 last:mb-0 last:pb-0">
                        <div className="flex justify-between items-center mb-2">
                          <p className="font-black text-sm text-gray-700">{new Date(d+"T12:00:00").toLocaleDateString("pt-PT",{weekday:"short",day:"2-digit",month:"short"})}</p>
                          <div className="flex gap-2">
                            <span className="text-xs bg-gray-100 text-gray-600 font-bold px-2 py-0.5 rounded-lg">{s.total} abd.</span>
                            <span className="text-xs bg-green-100 text-green-700 font-bold px-2 py-0.5 rounded-lg">{tv} vend.</span>
                            <span className="text-xs bg-blue-100 text-blue-700 font-bold px-2 py-0.5 rounded-lg">{s.leads} leads</span>
                          </div>
                        </div>
                        <div className="flex gap-1 items-end h-6">
                          <div className="flex-1 bg-gray-100 rounded" style={{height:`${s.conversas?Math.max(8,Math.round(s.conversas/Math.max(...dayStats.map(x=>x.s.conversas),1)*100)*0.24)+"px":"8px"}`}}/>
                          <div className="flex-1 bg-green-400 rounded" style={{height:`${tv?Math.max(8,Math.round(tv/Math.max(...dayStats.map(x=>x.s.combina+x.s.energia+x.s.novoCliente+x.s.alarme),1)*100)*0.24)+"px":"4px"}`}}/>
                          <div className="flex-1 bg-blue-400 rounded" style={{height:`${s.leads?Math.max(4,Math.round(s.leads/Math.max(...dayStats.map(x=>x.s.leads),1)*100)*0.24)+"px":"4px"}`}}/>
                        </div>
                        <div className="flex gap-1 text-xs text-gray-400 mt-1">
                          <span className="flex-1">Conv.</span><span className="flex-1">Vend.</span><span className="flex-1">Leads</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </>}

              {/* ─ POR COLABORADOR ─ */}
              {dashView==="colabs"&&<>
                {colStats.length===0&&<div className="bg-white rounded-2xl p-10 text-center shadow-sm"><p className="text-gray-400 font-bold">Sem dados</p></div>}
                {colStats.map(({c,q,s},i)=>{
                  const tv=s.combina+s.energia+s.novoCliente+s.alarme;
                  return(
                    <div key={c} className="bg-white rounded-2xl p-4 shadow-sm">
                      <div className="flex items-center gap-3 mb-3">
                        <div className={`w-9 h-9 rounded-2xl flex items-center justify-center text-white font-black text-sm shrink-0
                          ${i===0?"bg-yellow-500":i===1?"bg-gray-400":i===2?"bg-amber-700":"bg-gray-200 text-gray-600"}`}>
                          {i===0?"🥇":i===1?"🥈":i===2?"🥉":i+1}
                        </div>
                        <div className="flex-1">
                          <p className="font-black text-gray-900 text-sm">{c}</p>
                          <p className="text-xs text-gray-400">{q?.replace("Quiosque ","")}</p>
                        </div>
                        <div className="text-right">
                          <p className="font-black text-green-600">{tv} vendas</p>
                          <p className="text-xs text-gray-400">{s.total} abord.</p>
                        </div>
                      </div>
                      <div className="grid grid-cols-4 gap-1">
                        {[["🃏",s.combina],["⚡",s.energia],["📱",s.novoCliente],["🔒",s.alarme]].map(([ic,v])=>(
                          <div key={ic} className="text-center bg-gray-50 rounded-xl p-2">
                            <p className="text-lg font-black text-gray-700">{v}</p><p className="text-xs">{ic}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </>}

              {/* ─ LEADS ─ */}
              {dashView==="leads"&&<>
                <div className="bg-blue-50 border-2 border-blue-200 rounded-2xl p-4 text-center">
                  <p className="text-4xl font-black text-blue-700">{allS.leads}</p>
                  <p className="text-sm font-bold text-blue-500">leads no período</p>
                </div>
                {periodRecs.filter(r=>r.lead).length===0
                  ?<div className="bg-white rounded-2xl p-10 text-center shadow-sm"><p className="text-gray-400 font-bold">Sem leads</p></div>
                  :periodRecs.filter(r=>r.lead).map(r=>(
                    <div key={r.id} className="bg-white rounded-2xl p-4 shadow-sm border-2 border-blue-50">
                      <div className="flex justify-between items-start mb-1">
                        <p className="font-black text-blue-700">{r.lead.nome}</p>
                        <p className="text-xs text-gray-400 shrink-0 ml-2">{fmtDate(r.ts)} {fmtTime(r.ts)}</p>
                      </div>
                      {r.lead.tel&&<p className="text-sm text-gray-600 font-medium">📞 {r.lead.tel}</p>}
                      {r.lead.obs&&<p className="text-xs text-gray-400 italic mt-1">{r.lead.obs}</p>}
                      <div className="flex gap-2 mt-2">
                        <span className="text-xs bg-gray-100 text-gray-600 font-bold px-2 py-0.5 rounded-lg">{r.colaborador}</span>
                        <span className="text-xs bg-blue-100 text-blue-600 font-bold px-2 py-0.5 rounded-lg">{r.quiosque?.replace("Quiosque ","")}</span>
                      </div>
                    </div>
                  ))
                }
                <button onClick={()=>exportCSV(periodRecs.filter(r=>r.lead),`Leads_${dtag}.csv`)}
                  className="w-full py-4 rounded-2xl bg-blue-600 text-white font-black text-sm active:scale-95 transition-all shadow-lg">
                  📥 Exportar Leads
                </button>
              </>}

            </div>);
          })()}
        </>}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
