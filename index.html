  if(!temContinente&&!clienteNOS)                     return["energia","novoCliente","combina"];

  if(temContinente&&isCombina===0&&!clienteNOS)       return["combina","novoCliente","energia"];

  if(temContinente&&isCombina>0)                      return["energia"];

};

const exportXLS=(data,filename,shiftObs="")=>{
  if(!data.length){alert("Sem dados.");return;}
  const rows=data.map(r=>({
    "Data":fmtDate(r.ts),"Hora":fmtTime(r.ts),"Quiosque":r.quiosque||"","Colaborador":r.colaborador||"",
    "Entrada":r.horaEntrada||"","Saída":r.horaSaida||"","Aceitou":r.aceitou?"Sim":"Não",
    "Tem Cartão Continente":r.temContinente==null?"":r.temContinente?"Sim":"Não",
    "É cliente NOS":r.clienteNOS==null?"":r.clienteNOS?"Sim":"Não",
    "Perfil Combina":r.isCombina==null?"":r.isCombina===0?"Sem Combina":`Combina ${r.isCombina}`,
    "Venda Combina":r.vendas?.combina?"Sim":"Não","Venda Energia":r.vendas?.energia?"Sim":"Não",
    "Venda Novo NOS":r.vendas?.novoCliente?"Sim":"Não","Venda Alarme":r.vendas?.alarme?"Sim":"Não",
    "Venda Outros":r.vendas?.outros?"Sim":"Não","Outros - Descrição":r.vendas?.outrosDesc||"",
    "Lead":r.lead?"Sim":"Não","Lead Nome":r.lead?.nome||"","Lead Telefone":r.lead?.tel||"","Lead Obs":r.lead?.obs||"",
    "Tipo":r.tipo||"",
    ...(shiftObs?{"Obs. Turno":shiftObs}:{}),
  }));
  const ws=XLSX.utils.json_to_sheet(rows);
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Registos");
  ws["!cols"]=[{wch:12},{wch:8},{wch:22},{wch:20},{wch:8},{wch:8},{wch:8},{wch:18},{wch:16},{wch:16},{wch:14},{wch:14},{wch:14},{wch:14},{wch:12},{wch:28},{wch:6},{wch:20},{wch:16},{wch:24},{wch:10}];

function App(){
  const [tab,setTab]=useState("novo");
  const [records,setRecs]=useState(()=>lsa(CK));
  const [loading,setLoading]=useState(true);
  const [syncing,setSyncing]=useState(false);
  const [online,setOnline]=useState(true);
  const [session,setSession]=useState(()=>ls(SK));

  const [lUser,setLUser]=useState("");
  const [lQ,setLQ]=useState("");
  const [lTurno,setLTurno]=useState(null);
  const [lCustomIn,setLCustomIn]=useState("");
  const [lCustomOut,setLCustomOut]=useState("");

  const [step,setStep]=useState(0);
  const [aceitou,setAceitou]=useState(null);
  const [temContinente,setTemContinente]=useState(null);
  const [clienteNOS,setClienteNOS]=useState(null);
  const [isCombina,setIC]=useState(null);
  const [vendas,setVendas]=useState({combina:false,energia:false,novoCliente:false,alarme:false,outros:false,outrosDesc:""});
  const [lead,setLead]=useState({active:false,nome:"",tel:"",obs:""});
  const [flash,setFlash]=useState(false);
  const [saving,setSaving]=useState(false);
  const [queueCount,setQueueCount]=useState(()=>lsa(QK).length);

  const [histDate,setHistDate]=useState(todayISO());
  const [histFilter,setHistFilter]=useState("all");
  const [confirmDelete,setConfirmDelete]=useState(null);

  const [pin,setPin]=useState("");
  const [unlocked,setUnlocked]=useState(false);
  const [pinErr,setPinErr]=useState(false);
  const [dashView,setDashView]=useState("geral");
  const [dashFrom,setDashFrom]=useState(todayISO());
  const [dashTo,setDashTo]=useState(todayISO());

  const [showReport,setShowReport]=useState(false);
  const [reportCopied,setReportCopied]=useState(false);
  const [imgGenerating,setImgGenerating]=useState(false);
  const [imgCopied,setImgCopied]=useState(false);
  const [showFechoConfirm,setShowFechoConfirm]=useState(false);
  const [fechoObs,setFechoObs]=useState("");
  const [guestMode,setGuestMode]=useState(false);

  const syncingRef=useRef(false);
  const fetchData=useCallback(async()=>{
    if(syncingRef.current)return;
    syncingRef.current=true;
    try{
      const{data,error}=await db.from("abordagens").select("*").order("ts",{ascending:false}).range(0,4999);
      if(error)throw error;
      const fromSupabase=(data||[]).map(fromRow);
      const supabaseIds=new Set(fromSupabase.map(x=>String(x.id)));
      // Limpa da queue os que já estão confirmados
      let pending=lsa(QK).filter(x=>!supabaseIds.has(String(x.id)));
      lss(QK,pending);setQueueCount(pending.length);
      // Merge pendentes + Supabase
      const merged=[...pending.map(fromRow),...fromSupabase].sort((a,b)=>b.ts.localeCompare(a.ts));
      setRecs(merged);lss(CK,merged);setOnline(true);
      // Flush 1-a-1 (duplicado = sucesso)
      for(const row of pending){
        const{error:e}=await db.from("abordagens").insert([row]);
        if(!e||e.code==="23505"){
          const q2=lsa(QK).filter(x=>String(x.id)!==String(row.id));
          lss(QK,q2);setQueueCount(q2.length);
        }
      }
    }catch{setOnline(false);}
    finally{syncingRef.current=false;setLoading(false);}
  },[]);

  useEffect(()=>{
    fetchData();
    const t=setInterval(fetchData,30000);
    const onVisible=()=>{if(document.visibilityState==="visible")fetchData();};
    const onWake=()=>fetchData();
    document.addEventListener("visibilitychange",onVisible);
    window.addEventListener("online",onWake);
    window.addEventListener("focus",onWake);
    const ch=db.channel("abordagens-live")
      .on("postgres_changes",{event:"*",schema:"public",table:"abordagens"},()=>fetchData())
      .subscribe();
    return()=>{
      clearInterval(t);
      document.removeEventListener("visibilitychange",onVisible);
      window.removeEventListener("online",onWake);
      window.removeEventListener("focus",onWake);
      db.removeChannel(ch);
    };
  },[fetchData]);

  const reset=()=>{
    setStep(0);setAceitou(null);setTemContinente(null);setClienteNOS(null);setIC(null);
    setVendas({combina:false,energia:false,novoCliente:false,alarme:false,outros:false,outrosDesc:""});
    setLead({active:false,nome:"",tel:"",obs:""});
  };
  const getHorario=()=>{
    const t=TURNOS.find(t=>t.id===lTurno);
    if(!t)return{entrada:"",saida:""};
    if(t.id==="custom")return{entrada:lCustomIn,saida:lCustomOut};
    return{entrada:t.entrada,saida:t.saida};
  };
  const doLogin=()=>{
    const h=getHorario();
    const s={colaborador:lUser,quiosque:lQ,horaEntrada:h.entrada,horaSaida:h.saida,loginTs:localISO()};
    setSession(s);lss(SK,s);
  };
  const doLogout=()=>{localStorage.removeItem(SK);setSession(null);setShowReport(false);setFechoObs("");setGuestMode(false);reset();};
  const doFechoTurno=()=>{setShowFechoConfirm(false);setShowReport(true);};

  const steps=aceitou===false?["aceitou"]:["aceitou","perfil","vendas"];
  const sn=steps[step];
  const isFinal=(sn==="aceitou"&&aceitou===false)||(sn==="vendas");

  const canNext=(()=>{
    if(sn==="aceitou") return aceitou!==null;
    if(sn==="perfil"){
      if(temContinente===null||clienteNOS===null) return false;
      if(temContinente===true&&isCombina===null)  return false;
      return true;
    }
    if(sn==="vendas") return true;
    return false;
  })();

  const acaoProposta=aceitou?getAcaoProposta(temContinente,clienteNOS,isCombina):[];
  const hasVenda=vendas.combina||vendas.energia||vendas.novoCliente||vendas.alarme||vendas.outros;
  const canLogin=lUser.trim()&&lQ&&lTurno&&(lTurno!=="custom"||(lCustomIn&&lCustomOut));

  const saveRecord=async()=>{
    if(saving)return;
    setSaving(true);
    const r={
      id:Date.now()*1000+Math.floor(Math.random()*1000),ts:localISO(),
      colaborador:session.colaborador,quiosque:session.quiosque,
      horaEntrada:session.horaEntrada,horaSaida:session.horaSaida,
      aceitou,temContinente:aceitou?temContinente:null,clienteNOS:aceitou?clienteNOS:null,
      isCombina:aceitou&&temContinente?isCombina:null,
      vendas:aceitou?vendas:null,
      lead:lead.active?{nome:lead.nome||"—",tel:lead.tel,obs:lead.obs}:null,
    };
    if(!aceitou)r.tipo="recusa";
    else if(hasVenda)r.tipo="venda";
    else if(r.lead)r.tipo="lead";
    else r.tipo="sem_venda";
    setRecs(p=>[r,...p]);
    setSyncing(true);
    try{
      const{error}=await db.from("abordagens").insert([toRow(r)]);
      if(error)throw error;
      setOnline(true);
    }catch{
      setOnline(false);
      const q=lsa(QK);
      if(!q.find(x=>String(x.id)===String(r.id))){q.push(toRow(r));lss(QK,q);}
      setQueueCount(lsa(QK).length);
    }
    finally{
      setSyncing(false);setSaving(false);
      setQueueCount(lsa(QK).length);
      setTimeout(fetchData,300);
      setFlash(true);setTimeout(()=>{setFlash(false);reset();},1600);
    }
  };

  const deleteRecord=async(id)=>{
    setRecs(p=>p.filter(r=>r.id!==id));
    setConfirmDelete(null);
    const q=lsa(QK).filter(r=>String(r.id)!==String(id));
    lss(QK,q);
    try{await db.from("abordagens").delete().eq("id",id);}
    catch(e){console.error("Delete failed",e);}
  };

  const today=records.filter(r=>new Date(r.ts).toDateString()===todayStr());
  const myT=session?records.filter(r=>r.colaborador===session.colaborador&&r.quiosque===session.quiosque&&r.ts>=session.loginTs):[];
  const myS=stats(myT);
  const myTotV=myS.combina+myS.energia+myS.novoCliente+myS.alarme+myS.outros;
  const txConv=myS.conversas>0?Math.round(myTotV/myS.conversas*100):0;
  const dtag=new Date().toLocaleDateString("pt-PT").replace(/\//g,"-");

  const getDashRecords=()=>records.filter(r=>isoDay(r.ts)>=dashFrom&&isoDay(r.ts)<=dashTo);
  const getPeriodLabel=()=>{
    const fmt=d=>new Date(d+"T12:00:00").toLocaleDateString("pt-PT",{day:"2-digit",month:"short"});
    return dashFrom===dashTo?fmt(dashFrom):`${fmt(dashFrom)} – ${fmt(dashTo)}`;
  };
  const getExportFilename=()=>dashFrom===dashTo?`Combina_${dashFrom}.xlsx`:`Combina_${dashFrom}_a_${dashTo}.xlsx`;

  const buildReport=()=>[
    `RELATÓRIO DE TURNO`,`${new Date().toLocaleDateString("pt-PT",{day:"2-digit",month:"long",year:"numeric"})}`,``,
    `${session?.colaborador}`,`${session?.quiosque} · ${session?.horaEntrada} – ${session?.horaSaida}`,``,
    `─────────────────────`,`ABORDAGENS`,``,
    `Total          ${String(myS.total).padStart(3)}`,
    `Conversas      ${String(myS.conversas).padStart(3)}`,
    `Recusas        ${String(myS.recusas).padStart(3)}`,``,
    `─────────────────────`,`VENDAS         ${String(myTotV).padStart(3)}`,``,
    `Combina        ${String(myS.combina).padStart(3)}`,
    `Energia        ${String(myS.energia).padStart(3)}`,
    `Novo Cliente   ${String(myS.novoCliente).padStart(3)}`,
    `Alarme         ${String(myS.alarme).padStart(3)}`,
    ...(myS.outros>0?[`Outros         ${String(myS.outros).padStart(3)}`]:[]),``,
    `─────────────────────`,`LEADS          ${String(myS.leads).padStart(3)}`,``,
    `─────────────────────`,`Taxa conversão   ${txConv}%`,
    ...(fechoObs?[``,`─────────────────────`,`OBSERVAÇÕES`,``,fechoObs]:[]),
  ].join("\n");

  const copyReport=()=>{
    const t=buildReport();
    if(navigator.clipboard){navigator.clipboard.writeText(t).catch(()=>{const e=document.createElement("textarea");e.value=t;document.body.appendChild(e);e.select();document.execCommand("copy");document.body.removeChild(e);});}
    setReportCopied(true);setTimeout(()=>setReportCopied(false),2500);
  };

  const generateImage=async()=>{
    setImgGenerating(true);
    const el=document.getElementById("report-card");
    if(!el){setImgGenerating(false);return;}
    try{
      const canvas=await html2canvas(el,{scale:2,backgroundColor:"#F0F0F5",useCORS:true,logging:false});
      let copied=false;
      if(navigator.clipboard&&window.ClipboardItem){
        try{await new Promise((res,rej)=>canvas.toBlob(b=>{if(!b)return rej();navigator.clipboard.write([new ClipboardItem({"image/png":b})]).then(res).catch(rej);},"image/png"));copied=true;}
        catch(e){console.warn("clipboard",e);}
      }
      if(copied){setImgCopied(true);setTimeout(()=>setImgCopied(false),2800);}
      else{const url=canvas.toDataURL("image/png");const a=document.createElement("a");a.href=url;a.download=`Relatorio_${session?.colaborador||"turno"}_${dtag}.png`;document.body.appendChild(a);a.click();document.body.removeChild(a);}
    }catch(e){console.error(e);}
    finally{setImgGenerating(false);}
  };

  if(loading)return(
    <div className="min-h-screen flex flex-col items-center justify-center gap-6" style={{background:"linear-gradient(160deg,#0a0a0a,#1a1a2e)"}}>
      <Logo size="lg" dark/>
      <div className="w-6 h-6 border-2 border-white border-t-transparent rounded-full spin opacity-60"/>
    </div>
  );

  if(!session&&!guestMode)return(
    <div className="min-h-screen flex flex-col" style={{background:"linear-gradient(160deg,#0a0a0a 0%,#1a1a2e 60%,#0f2027 100%)"}}>
      <div className="flex-1 flex flex-col items-center justify-center p-5 gap-7">
        <div className="fadeUp"><Logo size="lg" dark/></div>

              className="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3.5 text-sm font-medium focus:outline-none focus:border-gray-400 focus:bg-white transition-all"/>

            <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Quiosque</p>
            <div className="relative">

                className="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3.5 text-sm font-medium appearance-none focus:outline-none focus:border-gray-400 focus:bg-white transition-all cursor-pointer">
                <option value="">Selecionar...</option>
                {QUIOSQUES.map(q=><option key={q} value={q}>{q}</option>)}

            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
            </svg>
            Ver Dashboard (Gestor)
          </button>
        </div>
      </div>
    </div>
  );

  if(showReport)return(

      <div className="px-5 pt-12 pb-5 bg-white border-b border-gray-100">

        <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-1">Relatório de turno</p>
        <p className="text-2xl font-black text-gray-900">{session.colaborador}</p>
        <p className="text-sm text-gray-400 font-medium mt-0.5">{session.quiosque} · {session.horaEntrada}–{session.horaSaida}</p>
      </div>
      <div className="p-5 max-w-md mx-auto space-y-4 safe-bottom">
        <div id="report-card" className="space-y-4 p-4 rounded-3xl" style={{background:"#F0F0F5"}}>

            <p className="text-xl font-black text-gray-900">{session.colaborador}</p>
            <p className="text-xs text-gray-400 font-medium mt-0.5">{session.quiosque} · {session.horaEntrada}–{session.horaSaida}</p>
            <p className="text-xs text-gray-300 font-medium mt-0.5">{new Date().toLocaleDateString("pt-PT",{day:"2-digit",month:"long",year:"numeric"})}</p>
          </div>
          <div className="grid grid-cols-2 gap-3">
            <KPIAbordagens total={myS.total} conversas={myS.conversas} recusas={myS.recusas}/>
            <KPIVendas total={myTotV} taxa={txConv}/>
          </div>
          <Card className="p-5">
            <SLabel>Detalhe de vendas</SLabel>
            <StatRow label="Combina" value={myS.combina}/>
            <StatRow label="Energia Galp" value={myS.energia}/>
            <StatRow label="Novo Cliente NOS" value={myS.novoCliente}/>
            <StatRow label="Alarme" value={myS.alarme}/>
            {myS.outros>0&&<StatRow label="Outros" value={myS.outros}/>}
          </Card>
          <div className="grid grid-cols-2 gap-3">
            <KPILeads total={myS.leads}/>
            <Card className="p-5">
              <SLabel>Perfil Combina</SLabel>
              {[["S/C",myS.c0,"bg-gray-300"],["C1",myS.c1,"bg-yellow-400"],["C2",myS.c2,"bg-blue-400"],["C3",myS.c3,"bg-emerald-500"]].map(([l,v,c])=>(
                <div key={l} className="flex items-center gap-2 mb-1.5 last:mb-0">
                  <span className="text-[10px] text-gray-400 font-bold w-6">{l}</span>
                  <ProgressBar value={v} max={myS.conversas||1} color={c}/>
                  <span className="text-xs font-black text-gray-700 w-4 text-right">{v}</span>
                </div>
              ))}
            </Card>
          </div>
          {fechoObs&&<Card className="p-5"><SLabel>Observações do turno</SLabel><p className="text-sm text-gray-700 leading-relaxed whitespace-pre-wrap">{fechoObs}</p></Card>}
        </div>
        <button onClick={generateImage} disabled={imgGenerating}
          className={`w-full py-4 rounded-2xl font-bold text-sm tracking-wide transition-all active:scale-95 shadow-sm flex items-center justify-center gap-2
            ${imgGenerating?"bg-gray-300 text-gray-500 cursor-wait":imgCopied?"bg-emerald-600 text-white":"bg-gray-900 text-white"}`}>
          {imgGenerating?(<><div className="w-4 h-4 border-2 border-white border-t-transparent rounded-full spin"/>A gerar...</>)
           :imgCopied?(<>✓ Imagem copiada! Cola no WhatsApp</>)
           :(<><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>Copiar Imagem (WhatsApp)</>)}
        </button>
        <button onClick={copyReport}
          className={`w-full py-4 rounded-2xl font-bold text-sm tracking-wide transition-all active:scale-95
            ${reportCopied?"bg-emerald-600 text-white":"border border-gray-200 bg-white text-gray-600"}`}>
          {reportCopied?"Copiado!":"Copiar texto (WhatsApp)"}
        </button>
        <button onClick={()=>exportXLS(myT,`Turno_${session.colaborador}_${dtag}.xlsx`,fechoObs)}
          className="w-full py-4 rounded-2xl font-bold text-sm border border-gray-200 bg-white text-gray-600 active:scale-95 transition-all">
          Exportar Excel
        </button>
        <button onClick={doLogout} className="w-full py-3 rounded-2xl font-semibold text-sm text-red-400 active:scale-95 transition-all">
          Terminar turno
        </button>
      </div>
    </div>
  );

  return(
    <div className="min-h-screen bg-gray-100">
      {showFechoConfirm&&(
        <div className="fixed inset-0 z-50 flex items-end justify-center px-4" style={{paddingBottom:"calc(1.5rem + var(--safe-bottom))",background:"rgba(0,0,0,0.55)"}}>
          <div className="bg-white rounded-3xl p-6 w-full max-w-sm shadow-2xl slideUp">
            <p className="font-black text-gray-900 text-xl mb-1">Fecho de Turno</p>
            <p className="text-sm text-gray-500 font-medium mb-5">Confirmas que queres fechar o turno?</p>
            <div className="mb-5">
              <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Observações (opcional)</p>
              <textarea value={fechoObs} onChange={e=>setFechoObs(e.target.value)} placeholder="Notas sobre o turno..." rows="3"
                className="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3.5 text-sm font-medium focus:outline-none focus:border-blue-300 focus:bg-white transition-all resize-none"/>
            </div>
            <div className="flex gap-3">
              <button onClick={()=>setShowFechoConfirm(false)} className="flex-1 py-4 rounded-2xl border-2 border-gray-200 text-gray-600 font-bold text-sm active:scale-95 transition-all">Não</button>
              <button onClick={doFechoTurno} className="flex-1 py-4 rounded-2xl bg-gray-900 text-white font-bold text-sm active:scale-95 transition-all">Sim, fechar</button>
            </div>
          </div>
        </div>
      )}

      <div className="bg-white border-b border-gray-100 px-5 pt-10 pb-3">
        <div className="flex items-center justify-between max-w-md mx-auto">
          <div className="flex items-center gap-3">
            <Logo size="sm"/>
            {session?(
              <div>
                <div className="flex items-center gap-1.5">
                  <p className="font-bold text-gray-900 text-xs">{session.quiosque.replace("Quiosque ","")}</p>
                  {queueCount>0
                    ?<span className="text-[10px] font-black bg-amber-400 text-white rounded-full px-1.5 py-0.5 leading-none">{queueCount}⬆</span>
                    :<div className={`w-1.5 h-1.5 rounded-full ${syncing?"bg-amber-400":online?"bg-emerald-500":"bg-red-400"}`}/>
                  }
                </div>
                <p className="text-[10px] text-gray-400 font-medium">{session.colaborador} · {session.horaEntrada}–{session.horaSaida}</p>
              </div>
            ):(
              <div>
                <p className="font-bold text-gray-900 text-xs">Dashboard</p>
                <p className="text-[10px] text-gray-400 font-medium">Modo Gestor</p>
              </div>
            )}
          </div>
          {session
            ?<button onClick={()=>setShowFechoConfirm(true)} className="bg-gray-900 text-white text-[11px] font-bold px-3 py-2.5 rounded-xl tracking-wide active:scale-95 transition-all">Fecho de turno</button>
            :<button onClick={()=>setGuestMode(false)} className="text-sm font-semibold text-blue-500 active:scale-95 transition-all">← Login</button>
          }
        </div>
      </div>

      <div className="bg-white border-b border-gray-100 sticky top-0 z-20">
        <div className="flex max-w-md mx-auto">
          {(session?[["novo","Registo"],["hist","Histórico"],["dash","Dashboard"]]:[["dash","Dashboard"]]).map(([id,lbl])=>(
            <button key={id} onClick={()=>setTab(id)}
              className={`flex-1 py-3.5 text-xs font-bold border-b-2 transition-all tracking-wide ${tab===id?"border-gray-900 text-gray-900":"border-transparent text-gray-300"}`}>
              {lbl}
            </button>
          ))}
        </div>
      </div>

      <div className="p-4 max-w-md mx-auto safe-bottom space-y-3" key={tab}>

        {tab==="novo"&&session&&(
          <div className="space-y-3 fadeUp">
            <LiveViewBar abordagens={myS.total} vendas={myTotV} leads={myS.leads} taxa={txConv}/>
            <Card className="p-5">
              <div className="flex gap-1.5 mb-6">
                {steps.map((_,i)=><div key={i} className={`h-1 flex-1 rounded-full transition-all ${i<=step?"bg-gray-900":"bg-gray-100"}`}/>)}

              {sn==="aceitou"&&<div className="pop space-y-2">
                <p className="text-xl font-black text-gray-900 mb-1">Abordagem</p>
                <p className="text-sm text-gray-400 font-medium mb-5">O cliente aceitou ouvir?</p>
                <RadioCard label="Sim, ouviu" selected={aceitou===true} onClick={()=>setAceitou(true)} selColor="green"/>
                <RadioCard label="Não, recusou" selected={aceitou===false} onClick={()=>setAceitou(false)} selColor="red"/>
              </div>}

              {sn==="perfil"&&<div className="pop space-y-5">
                <p className="text-xl font-black text-gray-900">Perfil do cliente</p>
                <div>
                  <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">Cartão Continente?</p>
                  <div className="flex gap-2">
                    <button onClick={()=>{setTemContinente(true);setIC(null);}}
                      className={`flex-1 py-3.5 rounded-2xl border-2 font-bold text-sm transition-all active:scale-[.97]

                    <button onClick={()=>{setTemContinente(false);setIC(null);}}
                      className={`flex-1 py-3.5 rounded-2xl border-2 font-bold text-sm transition-all active:scale-[.97]

                </div>
                <div>
                  <p className="text-[10px] font-bold text-gray-400 uppercase tracking-widest mb-2">É cliente NOS?</p>
                  <div className="flex gap-2">
                    <button onClick={()=>setClienteNOS(true)}
                      className={`flex-1 py-3.5 rounded-2xl border-2 font-bold text-sm transition-all active:scale-[.97]

                    <button onClick={()=>setClienteNOS(false)}

                        <div className="flex gap-1.5 flex-wrap">
                          <span className="text-[11px] bg-gray-100 text-gray-600 font-bold px-2.5 py-1 rounded-full">{r.colaborador}</span>
                          <span className="text-[11px] font-bold px-2.5 py-1 rounded-full" style={{background:"#eff6ff",color:"#2563eb"}}>{r.quiosque?.replace("Quiosque ","")}</span>
                          {r.tipo==="venda"&&<span className="text-[11px] font-bold px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700">+ Venda</span>}
                        </div>
                      </Card>
                    ))
                  }
                  <button onClick={()=>exportXLS(pr.filter(r=>r.lead),`Leads_${dtag}.xlsx`)}
                    className="w-full py-4 rounded-2xl border border-gray-200 bg-white font-bold text-sm text-gray-600 active:scale-95 transition-all">
                    Exportar Leads (Excel)
                  </button>
                </div>}
              </div>);
            })()}
          </div>
        )}
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
