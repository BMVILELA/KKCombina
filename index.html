<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <title>Quiosque Combina</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
    html,body{height:100%;overflow-x:hidden;margin:0}
    body{background:#F2F2F7;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',sans-serif}
    input,textarea,select{font-size:16px!important}
    @keyframes spin{to{transform:rotate(360deg)}}
    .spin{animation:spin 1s linear infinite}
    @keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    .fadeUp{animation:fadeUp .3s cubic-bezier(.4,0,.2,1)}
    @keyframes pop{0%{transform:scale(.95);opacity:0}100%{transform:scale(1);opacity:1}}
    .pop{animation:pop .2s cubic-bezier(.4,0,.2,1)}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback} = React;

const SUPABASE_URL = "https://czujxgdqomczazlafcag.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN6dWp4Z2Rxb21jemF6bGFmY2FnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzODkwOTMsImV4cCI6MjEwNDk2NTA5M30.dux2EkfsMAg5z-v7yUeCNgg7eVHUF_ZROatJytzRgJc";
const DASHBOARD_PIN = "NOS26";
const QUIOSQUES = ["Quiosque Cascais","Quiosque Montijo","Quiosque Norteshopping"];

const {createClient} = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_KEY);

const SK="combina_sess_v9",CK="combina_cache_v9",QK="combina_queue_v9";
const ls=k=>{try{return JSON.parse(localStorage.getItem(k)||"null")}catch{return null}};
const lsa=k=>{try{return JSON.parse(localStorage.getItem(k)||"[]")}catch{return[]}};
const lss=(k,v)=>localStorage.setItem(k,JSON.stringify(v));

const todayStr=()=>new Date().toDateString();
const fmtDate=iso=>new Date(iso).toLocaleDateString("pt-PT");
const fmtTime=iso=>new Date(iso).toLocaleTimeString("pt-PT",{hour:"2-digit",minute:"2-digit"});
const isoDay=iso=>iso.slice(0,10);

const vendasPorCombina=ic=>{
  if(ic===false)return[["combina","Ativar Combina"],["energia","Energia Galp"],["novoCliente","Novo Cliente NOS"],["alarme","Alarme"]];
  if(ic===1)return[["energia","Energia Galp"],["alarme","Alarme"]];
  if(ic===2)return[["alarme","Alarme"]];
  if(ic===3)return[["alarme","Alarme"]];
  return[];
};

const toRow=r=>({
  id:r.id,ts:r.ts,colaborador:r.colaborador||"",quiosque:r.quiosque||"",
  hora_entrada:r.horaEntrada||"",hora_saida:r.horaSaida||"",
  aceitou:!!r.aceitou,
  is_combina:r.isCombina==null?null:r.isCombina===false?0:Number(r.isCombina),
  vendeu_combina:!!(r.vendas?.combina),
  venda_energia:!!(r.vendas?.energia),
  venda_novo_cliente:!!(r.vendas?.novoCliente),
  venda_alarme:!!(r.vendas?.alarme),
  tem_lead:!!r.lead,
  lead_nome:r.lead?.nome||null,lead_tel:r.lead?.tel||null,lead_obs:r.lead?.obs||null,
});

const fromRow=row=>{
  const tv=row.vendeu_combina||row.venda_energia||row.venda_novo_cliente||row.venda_alarme;
  return{
    id:row.id,ts:row.ts,colaborador:row.colaborador,quiosque:row.quiosque,
    horaEntrada:row.hora_entrada,horaSaida:row.hora_saida,aceitou:row.aceitou,
    isCombina:row.is_combina==null?null:row.is_combina===0?false:row.is_combina,
    vendas:{combina:row.vendeu_combina,energia:row.venda_energia,novoCliente:row.venda_novo_cliente,alarme:row.venda_alarme},
    lead:row.tem_lead?{nome:row.lead_nome,tel:row.lead_tel,obs:row.lead_obs}:null,
    tipo:!row.aceitou?"recusa":tv?"venda":row.tem_lead?"lead":"sem_venda",
  };
};

const stats=arr=>({
  total:arr.length,
  recusas:arr.filter(r=>!r.aceitou).length,
  conversas:arr.filter(r=>r.aceitou).length,
  combina:arr.filter(r=>r.vendas?.combina).length,
  energia:arr.filter(r=>r.vendas?.energia).length,
  novoCliente:arr.filter(r=>r.vendas?.novoCliente).length,
  alarme:arr.filter(r=>r.vendas?.alarme).length,
  leads:arr.filter(r=>r.lead).length,
  vendas:arr.filter(r=>r.tipo==="venda").length,
  c0:arr.filter(r=>r.isCombina===false).length,
  c1:arr.filter(r=>r.isCombina===1).length,
  c2:arr.filter(r=>r.isCombina===2).length,
  c3:arr.filter(r=>r.isCombina===3).length,
});

const exportCSV=(data,filename)=>{
  if(!data.length){alert("Sem dados.");return}
  const h=["Data","Hora","Quiosque","Colaborador","Entrada","Saida","Aceitou","Combina","VendaCombina","VendaEnergia","VendaNovoCliente","VendaAlarme","Lead","LeadNome","LeadTel","LeadObs"];
  const rows=data.map(r=>[
    fmtDate(r.ts),fmtTime(r.ts),r.quiosque||"",r.colaborador||"",r.horaEntrada||"",r.horaSaida||"",
    r.aceitou?"Sim":"Não",
    r.isCombina===false?"Sem Combina":r.isCombina?`Combina ${r.isCombina}`:"",
    r.vendas?.combina?"Sim":"Não",r.vendas?.energia?"Sim":"Não",r.vendas?.novoCliente?"Sim":"Não",r.vendas?.alarme?"Sim":"Não",
    r.lead?"Sim":"Não",r.lead?.nome||"",r.lead?.tel||"",(r.lead?.obs||"").replace(/"/g,"'"),
  ].map(v=>`"${String(v).replace(/"/g,"''")}"`).join(","));
  const blob=new Blob(["\ufeff"+[h.join(","),...rows].join("\n")],{type:"text/csv;charset=utf-8;"});
  const a=Object.assign(document.createElement("a"),{href:URL.createObjectURL(blob),download:filename});
  a.click();URL.revokeObjectURL(a.href);
};

// ─── COMPONENTS ──────────────────────────────────────────────────────────────

const Logo=({size="sm"})=>{
  const lg=size==="lg";
  return(
    <div className={`flex flex-col items-center ${lg?"gap-2":"gap-0.5"}`}>
      <div className={`flex ${lg?"gap-2":"gap-1"}`}>
        {["COM","BI","NA"].map(t=>(
          <div key={t} className={`border-[2.5px] border-black rounded-xl bg-white ${lg?"px-4 py-2":"px-1.5 py-0.5"}`}>
            <span className={`font-black text-black leading-none block ${lg?"text-2xl":"text-[9px]"}`}>{t}</span>
          </div>
        ))}
      </div>
      <p className={`font-semibold tracking-tight ${lg?"text-[11px]":"text-[8px]"} text-gray-500`}>
        <span className="text-red-600 font-black">CONTINENTE</span>
        <span className="text-gray-300 mx-0.5">+</span>
        <span className="text-orange-500 font-black">galp</span>
        <span className="text-gray-300 mx-0.5">+</span>
        <span className="font-black text-black">NOS</span>
      </p>
    </div>
  );
};

const Card=({children,className=""})=>(
  <div className={`bg-white rounded-3xl shadow-sm ${className}`}>{children}</div>
);

const SectionTitle=({children})=>(
  <p className="text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-3">{children}</p>
);

const StatRow=({label,value,bold=false})=>(
  <div className="flex justify-between items-center py-2.5 border-b border-gray-50 last:border-0">
    <span className={`text-sm ${bold?"font-black text-gray-900":"text-gray-500 font-medium"}`}>{label}</span>
    <span className={`text-sm ${bold?"font-black text-gray-900":"font-semibold text-gray-700"}`}>{value}</span>
  </div>
);

const PillBadge=({label,color="gray"})=>{
  const c={gray:"bg-gray-100 text-gray-500",green:"bg-green-100 text-green-700",blue:"bg-blue-100 text-blue-700",yellow:"bg-yellow-100 text-yellow-700",purple:"bg-purple-100 text-purple-700",red:"bg-red-100 text-red-500",orange:"bg-orange-100 text-orange-600"}[color];
  return <span className={`text-[11px] font-bold px-2.5 py-1 rounded-full ${c}`}>{label}</span>;
};

const Bar=({value,max})=>(
  <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden flex-1">
    <div className="h-full bg-black rounded-full" style={{width:max?`${Math.min(100,Math.round(value/max*100))}%`:"0%",transition:"width .5s"}}/>
  </div>
);

function App(){
  const [tab,setTab]=useState("novo");
  const [records,setRecs]=useState(()=>lsa(CK));
  const [loading,setLoading]=useState(true);
  const [syncing,setSyncing]=useState(false);
  const [online,setOnline]=useState(true);
  const [session,setSession]=useState(()=>ls(SK));
  const [lastSync,setLastSync]=useState(null);

  // Login
  const [lNome,setLNome]=useState("");
  const [lQ,setLQ]=useState("");
  const [lIn,setLIn]=useState("");
  const [lOut,setLOut]=useState("");

  // Wizard
  const [step,setStep]=useState(0);
  const [aceitou,setAceitou]=useState(null);
  const [isCombina,setIC]=useState(null);
  const [vendas,setVendas]=useState({combina:false,energia:false,novoCliente:false,alarme:false});
  const [lead,setLead]=useState({active:false,nome:"",tel:"",obs:""});
  const [flash,setFlash]=useState(false);

  // Histórico
  const [histDate,setHistDate]=useState(new Date().toISOString().slice(0,10));
  const [histFilter,setHistFilter]=useState("all");

  // Dashboard
  const [pin,setPin]=useState("");
  const [unlocked,setUnlocked]=useState(false);
  const [pinErr,setPinErr]=useState(false);
  const [dashView,setDashView]=useState("geral");
  const [dashPeriod,setDashPeriod]=useState("today");

  // Report
  const [showReport,setShowReport]=useState(false);
  const [reportCopied,setReportCopied]=useState(false);

  const fetchData=useCallback(async()=>{
    try{
      const{data,error}=await db.from("abordagens").select("*").order("ts",{ascending:false});
      if(error)throw error;
      const r=(data||[]).map(fromRow);
      setRecs(r);lss(CK,r);setOnline(true);setLastSync(new Date());
    }catch{setOnline(false);}
    finally{setLoading(false);}
  },[]);

  useEffect(()=>{fetchData();const t=setInterval(fetchData,60000);return()=>clearInterval(t);},[fetchData]);
  useEffect(()=>{
    if(!online)return;
    const q=lsa(QK);if(!q.length)return;
    db.from("abordagens").upsert(q).then(({error})=>{if(!error){lss(QK,[]);fetchData();}});
  },[online,fetchData]);

  const reset=()=>{
    setStep(0);setAceitou(null);setIC(null);
    setVendas({combina:false,energia:false,novoCliente:false,alarme:false});
    setLead({active:false,nome:"",tel:"",obs:""});
  };

  const doLogin=()=>{const s={colaborador:lNome,quiosque:lQ,horaEntrada:lIn,horaSaida:lOut,loginTs:new Date().toISOString()};setSession(s);lss(SK,s);};
  const doLogout=()=>{localStorage.removeItem(SK);setSession(null);setShowReport(false);reset();};

  const hasVenda=Object.values(vendas).some(Boolean);

  const steps=aceitou===false?["aceitou"]:aceitou===true?["aceitou","combina","vendas"]:["aceitou"];
  const sn=steps[step];
  const isFinal=(sn==="aceitou"&&aceitou===false)||(sn==="vendas");
  const canNext={aceitou:aceitou!==null,combina:isCombina!==null,vendas:true}[sn]??false;

  const saveRecord=async()=>{
    const r={
      id:Date.now(),ts:new Date().toISOString(),
      colaborador:session.colaborador,quiosque:session.quiosque,
      horaEntrada:session.horaEntrada,horaSaida:session.horaSaida,
      aceitou,isCombina:aceitou?isCombina:null,
      vendas:aceitou?vendas:null,
      lead:lead.active?{nome:lead.nome||"—",tel:lead.tel,obs:lead.obs}:null,
    };
    if(!aceitou)r.tipo="recusa";
    else if(hasVenda)r.tipo="venda";
    else if(r.lead)r.tipo="lead";
    else r.tipo="sem_venda";

    setRecs(p=>[r,...p]);setSyncing(true);
    try{
      const{error}=await db.from("abordagens").insert([toRow(r)]);
      if(error)throw error;setOnline(true);
    }catch{
      setOnline(false);const q=lsa(QK);q.push(toRow(r));lss(QK,q);
    }finally{
      setSyncing(false);setFlash(true);setTimeout(()=>{setFlash(false);reset();},1600);
    }
  };

  const today=records.filter(r=>new Date(r.ts).toDateString()===todayStr());
  const myT=session?today.filter(r=>r.colaborador===session.colaborador&&r.quiosque===session.quiosque):[];
  const myS=stats(myT);
  const myTotV=myS.combina+myS.energia+myS.novoCliente+myS.alarme;
  const txConv=myS.conversas>0?Math.round(myTotV/myS.conversas*100):0;
  const dtag=new Date().toLocaleDateString("pt-PT").replace(/\//g,"-");

  const buildReport=()=>[
    `RELATÓRIO DE TURNO`,
    `${new Date().toLocaleDateString("pt-PT",{day:"2-digit",month:"long",year:"numeric"})}`,
    ``,
    `${session?.colaborador}`,
    `${session?.quiosque} · ${session?.horaEntrada} – ${session?.horaSaida}`,
    ``,
    `─────────────────────`,
    `ABORDAGENS`,
    ``,
    `Total          ${String(myS.total).padStart(3)}`,
    `Conversas      ${String(myS.conversas).padStart(3)}`,
    `Recusas        ${String(myS.recusas).padStart(3)}`,
    ``,
    `─────────────────────`,
    `VENDAS         ${String(myTotV).padStart(3)}`,
    ``,
    `Combina        ${String(myS.combina).padStart(3)}`,
    `Energia        ${String(myS.energia).padStart(3)}`,
    `Novo Cliente   ${String(myS.novoCliente).padStart(3)}`,
    `Alarme         ${String(myS.alarme).padStart(3)}`,
    ``,
    `─────────────────────`,
    `LEADS          ${String(myS.leads).padStart(3)}`,
    ``,
    `─────────────────────`,
    `Taxa conversão   ${txConv}%`,
  ].join("\n");

  const copyReport=()=>{
    const t=buildReport();
    if(navigator.clipboard){navigator.clipboard.writeText(t).catch(()=>fb(t));}else{fb(t);}
    setReportCopied(true);setTimeout(()=>setReportCopied(false),2500);
  };
  const fb=t=>{const e=document.createElement("textarea");e.value=t;document.body.appendChild(e);e.select();document.execCommand("copy");document.body.removeChild(e);};
  const canLogin=lNome.trim()&&lQ&&lIn&&lOut;

  // ── LOADING ───────────────────────────────────────────────────────────────
  if(loading)return(
    <div className="min-h-screen bg-gray-50 flex flex-col items-center justify-center gap-6">
      <Logo size="lg"/>
      <div className="w-6 h-6 border-[3px] border-black border-t-transparent rounded-full spin"/>
    </div>
  );

  // ── LOGIN ─────────────────────────────────────────────────────────────────
  if(!session)return(
    <div className="min-h-screen flex flex-col" style={{background:"linear-gradient(160deg,#0a0a0a 0%,#1c1c1e 100%)"}}>
      <div className="flex-1 flex flex-col items-center justify-center p-6 gap-8">
        <Logo size="lg"/>
        <Card className="w-full max-w-sm p-6 fadeUp">
          <p className="text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-5 text-center">Iniciar turno</p>

          <label className="text-[11px] font-bold text-gray-400 uppercase tracking-widest block mb-1.5">Nome</label>
          <input value={lNome} onChange={e=>setLNome(e.target.value)} placeholder="O teu nome"
            className="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3.5 text-sm font-medium mb-4 focus:outline-none focus:border-gray-400 transition-all"/>

          <label className="text-[11px] font-bold text-gray-400 uppercase tracking-widest block mb-1.5">Quiosque</label>
          <div className="relative mb-4">
            <select value={lQ} onChange={e=>setLQ(e.target.value)}
              className="w-full bg-gray-50 border border-gray-200 rounded-2xl px-4 py-3.5 text-sm font-medium appearance-none focus:outline-none focus:border-gray-400 transition-all">
              <option value="">Selecionar...</option>
              {QUIOSQUES.map(q=><option key={q} value={q}>{q}</option>)}
            </select>
            <span className="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-xs">▾</span>
          </div>

          <label className="text-[11px] font-bold text-gray-400 uppercase tracking-widest block mb-1.5">Horário</label>
          <div className="flex gap-3 mb-6">
            {[[lIn,setLIn,"Entrada"],[lOut,setLOut,"Saída"]].map(([v,s,l])=>(
              <div key={l} className="flex-1">
                <p className="text-[10px] text-gray-400 mb-1 font-medium">{l}</p>
                <input type="time" value={v} onChange={e=>s(e.target.value)}
                  className="w-full bg-gray-50 border border-gray-200 rounded-2xl px-3 py-3 text-sm font-medium focus:outline-none focus:border-gray-400 transition-all"/>
              </div>
            ))}
          </div>

          <button onClick={doLogin} disabled={!canLogin}
            className={`w-full py-4 rounded-2xl font-black text-sm tracking-wide transition-all active:scale-95
              ${canLogin?"bg-black text-white shadow-lg":"bg-gray-100 text-gray-300 cursor-not-allowed"}`}>
            Entrar
          </button>
        </Card>
      </div>
    </div>
  );

  // ── RELATÓRIO ─────────────────────────────────────────────────────────────
  if(showReport)return(
    <div className="min-h-screen bg-gray-100 fadeUp">
      {/* Header */}
      <div className="bg-white px-5 pt-12 pb-5 border-b border-gray-100">
        <button onClick={()=>setShowReport(false)} className="text-sm font-semibold text-gray-400 mb-4 block">← Voltar</button>
        <p className="text-[11px] font-bold text-gray-400 uppercase tracking-widest mb-1">Relatório de Turno</p>
        <p className="text-2xl font-black text-gray-900">{session.colaborador}</p>
        <p className="text-sm text-gray-400 font-medium mt-0.5">{session.quiosque} · {session.horaEntrada}–{session.horaSaida}</p>
      </div>

      <div className="p-5 max-w-md mx-auto space-y-4 pb-12">

        {/* Abordagens */}
        <Card className="p-5">
          <SectionTitle>Abordagens</SectionTitle>
          <StatRow label="Total" value={myS.total} bold/>
          <StatRow label="Conversas" value={myS.conversas}/>
          <StatRow label="Recusas" value={myS.recusas}/>
        </Card>

        {/* Vendas */}
        <Card className="p-5">
          <SectionTitle>Vendas</SectionTitle>
          <div className="flex items-baseline justify-between mb-4">
            <span className="text-4xl font-black text-gray-900">{myTotV}</span>
            <span className="text-sm font-semibold text-gray-400">vendas no turno</span>
          </div>
          <StatRow label="Combina" value={myS.combina}/>
          <StatRow label="Energia Galp" value={myS.energia}/>
          <StatRow label="Novo Cliente NOS" value={myS.novoCliente}/>
          <StatRow label="Alarme" value={myS.alarme}/>
        </Card>

        {/* Leads + Taxa */}
        <div className="grid grid-cols-2 gap-3">
          <Card className="p-5">
            <SectionTitle>Leads</SectionTitle>
            <p className="text-4xl font-black text-gray-900">{myS.leads}</p>
            <p className="text-xs text-gray-400 font-medium mt-1">registados</p>
          </Card>
          <Card className="p-5">
            <SectionTitle>Taxa Conv.</SectionTitle>
            <p className="text-4xl font-black text-gray-900">{txConv}%</p>
            <p className="text-xs text-gray-400 font-medium mt-1">conversas → venda</p>
          </Card>
        </div>

        {/* Perfil Combina */}
        <Card className="p-5">
          <SectionTitle>Perfil Combina</SectionTitle>
          {[["Sem Combina",myS.c0],["Combina 1",myS.c1],["Combina 2",myS.c2],["Combina 3",myS.c3]].map(([l,v])=>(
            <div key={l} className="flex items-center gap-3 mb-3 last:mb-0">
              <span className="text-sm text-gray-500 font-medium w-24 shrink-0">{l}</span>
              <Bar value={v} max={myS.conversas||1}/>
              <span className="text-sm font-black text-gray-900 w-5 text-right shrink-0">{v}</span>
            </div>
          ))}
        </Card>

        {/* Botões */}
        <button onClick={copyReport}
          className={`w-full py-4 rounded-2xl font-black text-sm tracking-wide transition-all active:scale-95 shadow-sm
            ${reportCopied?"bg-gray-900 text-white":"bg-black text-white"}`}>
          {reportCopied?"Copiado":"Copiar para WhatsApp"}
        </button>
        <button onClick={()=>exportCSV(myT,`Turno_${session.colaborador}_${dtag}.csv`)}
          className="w-full py-4 rounded-2xl font-black text-sm tracking-wide border border-gray-200 bg-white text-gray-700 active:scale-95 transition-all">
          Exportar CSV
        </button>
        <button onClick={doLogout}
          className="w-full py-4 rounded-2xl font-semibold text-sm text-red-400 active:scale-95 transition-all">
          Terminar turno
        </button>
      </div>
    </div>
  );

  // ── APP PRINCIPAL ─────────────────────────────────────────────────────────
  return(
    <div className="min-h-screen bg-gray-100">

      {/* Header */}
      <div className="bg-white border-b border-gray-100 px-5 pt-10 pb-3">
        <div className="flex items-center justify-between max-w-md mx-auto">
          <div className="flex items-center gap-3">
            <Logo size="sm"/>
            <div>
              <div className="flex items-center gap-1.5">
                <p className="font-black text-gray-900 text-xs">{session.quiosque.replace("Quiosque ","")}</p>
                <div className={`w-1.5 h-1.5 rounded-full ${syncing?"bg-orange-400":online?"bg-green-500":"bg-red-400"}`}/>
              </div>
              <p className="text-[10px] text-gray-400 font-medium">{session.colaborador} · {session.horaEntrada}–{session.horaSaida}</p>
            </div>
          </div>
          <button onClick={()=>setShowReport(true)}
            className="bg-black text-white text-[11px] font-black px-3.5 py-2 rounded-xl tracking-wide active:scale-95 transition-all">
            Turno
          </button>
        </div>
      </div>

      {/* Tabs */}
      <div className="bg-white border-b border-gray-100 sticky top-0 z-20">
        <div className="flex max-w-md mx-auto">
          {[["novo","Registo"],["hist","Histórico"],["dash","Dashboard"]].map(([id,lbl])=>(
            <button key={id} onClick={()=>setTab(id)}
              className={`flex-1 py-3.5 text-xs font-black border-b-2 transition-all tracking-wide
                ${tab===id?"border-black text-black":"border-transparent text-gray-300"}`}>
              {lbl}
            </button>
          ))}
        </div>
      </div>

      <div className="p-4 max-w-md mx-auto pb-20 space-y-3" key={tab}>

        {/* ── REGISTO ─────────────────────────────────────────────────────── */}

          <div className="space-y-3 fadeUp">
            <Card className="p-5">
              {/* Progress */}
              <div className="flex gap-1.5 mb-6">
                {steps.map((_,i)=>(
                  <div key={i} className={`h-1 flex-1 rounded-full transition-all duration-300 ${i<=step?"bg-black":"bg-gray-100"}`}/>
                ))}
              </div>

              {/* STEP aceitou */}
              {sn==="aceitou"&&<div className="pop">
                <p className="text-xl font-black text-gray-900 mb-1">Abordagem</p>
                <p className="text-sm text-gray-400 font-medium mb-6">O cliente aceitou ouvir?</p>
                <div className="space-y-2.5">
                  {[[true,"Sim, ouviu","Ficou a ouvir a proposta"],[false,"Não, recusou","Não quis ouvir"]].map(([v,l,d])=>(
                    <button key={String(v)} onClick={()=>setAceitou(v)}
                      className={`w-full py-4 px-4 rounded-2xl border text-left transition-all active:scale-[.98] flex items-center justify-between
                        ${aceitou===v?"border-black bg-gray-50":"border-gray-100 bg-gray-50"}`}>
                      <div>
                        <p className={`font-black text-sm ${aceitou===v?"text-black":"text-gray-600"}`}>{l}</p>
                        <p className="text-xs text-gray-400 mt-0.5 font-medium">{d}</p>
                      </div>
                      <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center transition-all shrink-0
                        ${aceitou===v?"border-black bg-black":"border-gray-300"}`}>
                        {aceitou===v&&<div className="w-2 h-2 rounded-full bg-white"/>}
                      </div>
                    </button>
                  ))}
                </div>
              </div>}

              {/* STEP combina */}
              {sn==="combina"&&<div className="pop">
                <p className="text-xl font-black text-gray-900 mb-1">Perfil Combina</p>
                <p className="text-sm text-gray-400 font-medium mb-6">Nível do cliente</p>
                <div className="space-y-2.5">
                  {[[false,"Sem Combina","Sem Cartão Continente ativo"],[1,"Combina 1","Continente + NOS"],[2,"Combina 2","Continente + NOS + Galp Energia"],[3,"Combina 3","Continente + NOS + Galp Energia + Solar"]].map(([v,l,d])=>(
                    <button key={String(v)} onClick={()=>setIC(v)}
                      className={`w-full py-4 px-4 rounded-2xl border text-left transition-all active:scale-[.98] flex items-center justify-between
                        ${isCombina===v?"border-black bg-gray-50":"border-gray-100 bg-gray-50"}`}>
                      <div>
                        <p className={`font-black text-sm ${isCombina===v?"text-black":"text-gray-600"}`}>{l}</p>
                        <p className="text-xs text-gray-400 mt-0.5 font-medium">{d}</p>
                      </div>
                      <div className={`w-5 h-5 rounded-full border-2 flex items-center justify-center transition-all shrink-0
                        ${isCombina===v?"border-black bg-black":"border-gray-300"}`}>
                        {isCombina===v&&<div className="w-2 h-2 rounded-full bg-white"/>}
                      </div>
                    </button>
                  ))}
                </div>
              </div>}

              {/* STEP vendas */}
              {sn==="vendas"&&<div className="pop">
                <p className="text-xl font-black text-gray-900 mb-1">Resultado</p>
                <p className="text-sm text-gray-400 font-medium mb-6">O que foi vendido?</p>
                <div className="space-y-2.5">
                  {vendasPorCombina(isCombina).map(([key,label])=>(
                    <button key={key} onClick={()=>setVendas(v=>({...v,[key]:!v[key]}))}
                      className={`w-full py-4 px-4 rounded-2xl border text-left transition-all active:scale-[.98] flex items-center justify-between
                        ${vendas[key]?"border-black bg-gray-50":"border-gray-100 bg-gray-50"}`}>
                      <span className={`font-black text-sm ${vendas[key]?"text-black":"text-gray-600"}`}>{label}</span>
                      <div className={`w-5 h-5 rounded-md border-2 flex items-center justify-center transition-all shrink-0
                        ${vendas[key]?"border-black bg-black":"border-gray-300"}`}>
                        {vendas[key]&&<svg width="10" height="8" viewBox="0 0 10 8" fill="none"><path d="M1 4l3 3L9 1" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                      </div>
                    </button>
                  ))}
                </div>
              </div>}

              {/* Nav */}
              <div className="flex gap-2 mt-6">
                {step>0&&!flash&&(
                  <button onClick={()=>setStep(s=>s-1)}
                    className="px-5 py-4 rounded-2xl border border-gray-200 text-gray-500 font-black text-sm active:scale-95 transition-all">←</button>
                )}
                {isFinal
                  ?<button onClick={saveRecord} disabled={flash}
                    className={`flex-1 py-4 rounded-2xl font-black text-sm tracking-wide transition-all active:scale-95 shadow-sm
                      ${flash?"bg-green-600 text-white":"bg-black text-white disabled:bg-gray-100 disabled:text-gray-300"}`}>
                    {flash?"Guardado":"Guardar"}
                  </button>
                  :<button onClick={()=>setStep(s=>s+1)} disabled={!canNext}
                    className={`flex-1 py-4 rounded-2xl font-black text-sm tracking-wide transition-all active:scale-95 shadow-sm
                      ${canNext?"bg-black text-white":"bg-gray-100 text-gray-300 cursor-not-allowed"}`}>
                    Seguinte
                  </button>
                }
              </div>
            </Card>

            {/* Lead — sempre visível */}
            <Card className="p-5">
              <div className="flex items-center justify-between mb-4">
                <div>
                  <p className="font-black text-gray-900 text-sm">Registar Lead</p>
                  <p className="text-xs text-gray-400 font-medium mt-0.5">Contacto para follow-up</p>
                </div>
                <button onClick={()=>setLead(l=>({...l,active:!l.active}))}
                  className={`w-12 h-6 rounded-full transition-all duration-300 relative ${lead.active?"bg-black":"bg-gray-200"}`}>
                  <div className={`w-5 h-5 bg-white rounded-full shadow absolute top-0.5 transition-all duration-300 ${lead.active?"left-6":"left-0.5"}`}/>
                </button>
              </div>
              {lead.active&&(
                <div className="space-y-2.5 pop">
                  <input value={lead.nome} onChange={e=>setLead(l=>({...l,nome:e.target.value}))} placeholder="Nome"
                    className="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3.5 text-sm font-medium focus:outline-none focus:border-gray-300 transition-all"/>
                  <input value={lead.tel} onChange={e=>setLead(l=>({...l,tel:e.target.value}))} placeholder="Telefone" type="tel"
                    className="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3.5 text-sm font-medium focus:outline-none focus:border-gray-300 transition-all"/>
                  <textarea value={lead.obs} onChange={e=>setLead(l=>({...l,obs:e.target.value}))} placeholder="Observações..." rows="2"
                    className="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3.5 text-sm font-medium focus:outline-none focus:border-gray-300 transition-all resize-none"/>
                </div>
              )}
            </Card>
          </div>
        )}

        {/* ── HISTÓRICO ───────────────────────────────────────────────────── */}
        {tab==="hist"&&(
          <div className="space-y-3 fadeUp">
            <Card className="p-5">
              <SectionTitle>Dia</SectionTitle>
              <input type="date" value={histDate} onChange={e=>setHistDate(e.target.value)}
                className="w-full bg-gray-50 border border-gray-100 rounded-2xl px-4 py-3.5 text-sm font-medium focus:outline-none focus:border-gray-300 transition-all"/>
            </Card>

            {/* Filtros */}
            <div className="flex gap-2 overflow-x-auto pb-1 -mx-1 px-1">
              {[["all","Todos"],["venda","Com Venda"],["lead","Lead"],["sem_venda","Sem Resultado"],["recusa","Recusa"]].map(([v,l])=>(
                <button key={v} onClick={()=>setHistFilter(v)}
                  className={`shrink-0 px-4 py-2 rounded-xl border text-xs font-black transition-all
                    ${histFilter===v?"border-black bg-black text-white":"border-gray-200 bg-white text-gray-400"}`}>{l}</button>
              ))}
            </div>

            {(()=>{
              const dayR=records.filter(r=>isoDay(r.ts)===histDate);
              const filtered=histFilter==="all"?dayR:dayR.filter(r=>r.tipo===histFilter);
              const ds=stats(dayR);
              return(<>
                {/* Resumo */}
                <Card className="p-5">
                  <SectionTitle>Resumo do dia</SectionTitle>
                  <div className="grid grid-cols-4 gap-1">
                    {[["Total",ds.total,"text-gray-900"],["Vendas",ds.vendas,"text-black"],["Leads",ds.leads,"text-gray-700"],["Recusas",ds.recusas,"text-gray-500"]].map(([l,v,c])=>(
                      <div key={l} className="text-center bg-gray-50 rounded-2xl py-3">
                        <p className={`text-2xl font-black ${c}`}>{v}</p>
                        <p className="text-[10px] text-gray-400 font-bold mt-0.5">{l}</p>
                      </div>
                    ))}
                  </div>
                </Card>

                {filtered.length===0
                  ?<Card className="p-10 text-center"><p className="text-gray-300 font-bold text-sm">Sem registos</p></Card>
                  :filtered.map(r=>{
                    const tipoCfg={
                      venda:{label:"Venda",badge:"green"},
                      lead:{label:"Lead",badge:"blue"},
                      sem_venda:{label:"Sem resultado",badge:"gray"},
                      recusa:{label:"Recusa",badge:"red"},
                    }[r.tipo]||{label:"—",badge:"gray"};
                    return(
                      <Card key={r.id} className="p-4">
                        <div className="flex items-start justify-between mb-2">
                          <div className="flex flex-wrap gap-1.5">
                            <PillBadge label={tipoCfg.label} color={tipoCfg.badge}/>
                            {r.isCombina===false&&<PillBadge label="Sem Combina"/>}
                            {r.isCombina>0&&<PillBadge label={`C${r.isCombina}`} color="blue"/>}
                            {r.vendas?.combina&&<PillBadge label="Combina" color="yellow"/>}
                            {r.vendas?.energia&&<PillBadge label="Energia" color="green"/>}
                            {r.vendas?.novoCliente&&<PillBadge label="Novo NOS" color="orange"/>}
                            {r.vendas?.alarme&&<PillBadge label="Alarme" color="purple"/>}
                          </div>
                          <div className="text-right shrink-0 ml-2">
                            <p className="text-[11px] text-gray-400 font-medium">{fmtTime(r.ts)}</p>
                            <p className="text-[11px] text-gray-500 font-bold">{r.colaborador}</p>
                          </div>
                        </div>
                        {r.lead&&(
                          <div className="bg-gray-50 rounded-xl p-3 mt-1">
                            <p className="text-xs font-black text-gray-700">{r.lead.nome}{r.lead.tel?` · ${r.lead.tel}`:""}</p>
                            {r.lead.obs&&<p className="text-xs text-gray-400 mt-0.5">{r.lead.obs}</p>}
                          </div>
                        )}
                      </Card>
                    );
                  })
                }
              </>);
            })()}
          </div>
        )}

        {/* ── DASHBOARD ───────────────────────────────────────────────────── */}
        {tab==="dash"&&(
          <div className="fadeUp">
            {!unlocked?(
              <Card className="p-6 text-center">
                <div className="w-14 h-14 bg-gray-50 rounded-2xl flex items-center justify-center mx-auto mb-4">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-gray-400">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </div>
                <p className="font-black text-gray-900 text-lg mb-1">Acesso Restrito</p>
                <p className="text-sm text-gray-400 font-medium mb-6">Exclusivo para gestores</p>
                <input type="password" value={pin} onChange={e=>setPin(e.target.value)}
                  onKeyDown={e=>{if(e.key==="Enter"){if(pin===DASHBOARD_PIN){setUnlocked(true);setPinErr(false);}else setPinErr(true);}}}
                  placeholder="PIN"
                  className={`w-full border rounded-2xl px-4 py-4 text-center text-xl font-black tracking-[.5em] mb-2 focus:outline-none transition-all
                    ${pinErr?"border-red-300 bg-red-50":"border-gray-200 bg-gray-50 focus:border-gray-400"}`}/>
                {pinErr&&<p className="text-xs text-red-400 font-bold mb-3">PIN incorreto</p>}
                <button onClick={()=>{if(pin===DASHBOARD_PIN){setUnlocked(true);setPinErr(false);}else setPinErr(true);}}
                  className="w-full py-4 rounded-2xl bg-black text-white font-black text-sm tracking-wide active:scale-95 transition-all">
                  Entrar
                </button>
              </Card>
            ):(()=>{
              const pr=dashPeriod==="today"?today:records;
              const as=stats(pr);
              const totV=as.combina+as.energia+as.novoCliente+as.alarme;
              const byQ=QUIOSQUES.map(q=>({q,s:stats(pr.filter(r=>r.quiosque===q))}));
              const days=[...new Set(records.map(r=>isoDay(r.ts)))].sort().reverse().slice(0,15);
              const dayStats=days.map(d=>({d,s:stats(records.filter(r=>isoDay(r.ts)===d))}));
              const collabs=[...new Set(pr.map(r=>r.colaborador))].filter(Boolean);
              const colStats=collabs.map(c=>({
                c,q:pr.find(r=>r.colaborador===c)?.quiosque||"",
                s:stats(pr.filter(r=>r.colaborador===c))
              })).sort((a,b)=>(b.s.vendas+b.s.leads)-(a.s.vendas+a.s.leads));

              return(<div className="space-y-3">
                {/* Controls */}
                <div className="flex items-center justify-between">
                  <p className="font-black text-gray-900">Dashboard</p>
                  <button onClick={()=>setUnlocked(false)} className="text-xs text-gray-400 font-semibold underline">Bloquear</button>
                </div>

                <div className="flex gap-2">
                  {[["today","Hoje"],["all","15 dias"]].map(([v,l])=>(
                    <button key={v} onClick={()=>setDashPeriod(v)}
                      className={`flex-1 py-3 rounded-xl border text-xs font-black tracking-wide transition-all
                        ${dashPeriod===v?"border-black bg-black text-white":"border-gray-200 bg-white text-gray-400"}`}>{l}</button>
                  ))}
                </div>

                <div className="flex gap-2 overflow-x-auto -mx-1 px-1 pb-1">
                  {[["geral","Geral"],["quiosques","Quiosques"],["dias","Por Dia"],["colabs","Equipa"],["leads","Leads"]].map(([v,l])=>(
                    <button key={v} onClick={()=>setDashView(v)}
                      className={`shrink-0 px-4 py-2 rounded-xl border text-xs font-black transition-all
                        ${dashView===v?"border-black bg-black text-white":"border-gray-200 bg-white text-gray-400"}`}>{l}</button>
                  ))}
                </div>

                {/* GERAL */}
                {dashView==="geral"&&<div className="space-y-3">
                  <div className="grid grid-cols-2 gap-3">
                    <Card className="p-5">
                      <SectionTitle>Abordagens</SectionTitle>
                      <p className="text-4xl font-black text-gray-900">{as.total}</p>
                    </Card>
                    <Card className="p-5">
                      <SectionTitle>Taxa Conv.</SectionTitle>
                      <p className="text-4xl font-black text-gray-900">{as.conversas>0?Math.round(totV/as.conversas*100):0}%</p>
                    </Card>
                  </div>
                  <Card className="p-5">
                    <SectionTitle>Vendas por produto</SectionTitle>
                    <div className="text-4xl font-black text-gray-900 mb-4">{totV}</div>
                    <StatRow label="Combina" value={as.combina}/>
                    <StatRow label="Energia Galp" value={as.energia}/>
                    <StatRow label="Novo Cliente NOS" value={as.novoCliente}/>
                    <StatRow label="Alarme" value={as.alarme}/>
                  </Card>
                  <div className="grid grid-cols-3 gap-3">
                    {[["Conversas",as.conversas],["Leads",as.leads],["Recusas",as.recusas]].map(([l,v])=>(
                      <Card key={l} className="p-4 text-center">
                        <p className="text-2xl font-black text-gray-900">{v}</p>
                        <p className="text-[10px] text-gray-400 font-bold mt-1">{l}</p>
                      </Card>
                    ))}
                  </div>
                  <Card className="p-5">
                    <SectionTitle>Perfil Combina</SectionTitle>
                    {[["Sem Combina",as.c0],["Combina 1",as.c1],["Combina 2",as.c2],["Combina 3",as.c3]].map(([l,v])=>(
                      <div key={l} className="flex items-center gap-3 mb-3 last:mb-0">
                        <span className="text-xs text-gray-500 font-medium w-24 shrink-0">{l}</span>
                        <Bar value={v} max={as.conversas||1}/>
                        <span className="text-sm font-black text-gray-900 w-4 text-right shrink-0">{v}</span>
                      </div>
                    ))}
                  </Card>
                  <button onClick={()=>exportCSV(pr,`Dashboard_${dtag}.csv`)}
                    className="w-full py-4 rounded-2xl border border-gray-200 bg-white font-black text-sm text-gray-700 active:scale-95 transition-all">
                    Exportar {pr.length} registos
                  </button>
                </div>}

                {/* QUIOSQUES */}
                {dashView==="quiosques"&&<div className="space-y-3">
                  {byQ.map(({q,s})=>{
                    const tv=s.combina+s.energia+s.novoCliente+s.alarme;
                    return(
                      <Card key={q} className="p-5">
                        <div className="flex items-center justify-between mb-4">
                          <p className="font-black text-gray-900">{q.replace("Quiosque ","")}</p>
                          <PillBadge label={`${s.total} abord.`}/>
                        </div>
                        <div className="grid grid-cols-3 gap-2 mb-4">
                          {[["Conversas",s.conversas],["Vendas",tv],["Leads",s.leads]].map(([l,v])=>(
                            <div key={l} className="text-center bg-gray-50 rounded-2xl py-3">
                              <p className="text-2xl font-black text-gray-900">{v}</p>
                              <p className="text-[10px] text-gray-400 font-bold mt-0.5">{l}</p>
                            </div>
                          ))}
                        </div>
                        <StatRow label="Combina" value={s.combina}/>
                        <StatRow label="Energia" value={s.energia}/>
                        <StatRow label="Novo NOS" value={s.novoCliente}/>
                        <StatRow label="Alarme" value={s.alarme}/>
                        <div className="mt-3 flex items-center gap-3">
                          <span className="text-xs text-gray-400 font-medium shrink-0">Conversão</span>
                          <Bar value={tv} max={s.conversas||1}/>
                          <span className="text-xs font-black text-gray-900 shrink-0">{s.conversas>0?Math.round(tv/s.conversas*100):0}%</span>
                        </div>
                      </Card>
                    );
                  })}
                </div>}

                {/* POR DIA */}
                {dashView==="dias"&&<Card className="p-5">
                  <SectionTitle>Evolução diária</SectionTitle>
                  {dayStats.length===0&&<p className="text-center text-gray-300 text-sm py-6">Sem dados</p>}
                  {dayStats.map(({d,s})=>{
                    const tv=s.combina+s.energia+s.novoCliente+s.alarme;
                    return(
                      <div key={d} className="py-3.5 border-b border-gray-50 last:border-0">
                        <div className="flex items-center justify-between mb-2">
                          <p className="text-sm font-black text-gray-700">
                            {new Date(d+"T12:00:00").toLocaleDateString("pt-PT",{weekday:"short",day:"2-digit",month:"short"})}
                          </p>
                          <div className="flex gap-2">
                            <PillBadge label={`${s.total} abd.`}/>
                            <PillBadge label={`${tv} vend.`} color="green"/>
                            <PillBadge label={`${s.leads} leads`} color="blue"/>
                          </div>
                        </div>
                        <div className="flex items-center gap-2">
                          <Bar value={tv} max={Math.max(...dayStats.map(x=>x.s.combina+x.s.energia+x.s.novoCliente+x.s.alarme),1)}/>
                        </div>
                      </div>
                    );
                  })}
                </Card>}

                {/* EQUIPA */}
                {dashView==="colabs"&&<div className="space-y-3">
                  {colStats.length===0&&<Card className="p-10 text-center"><p className="text-gray-300 font-bold text-sm">Sem dados</p></Card>}
                  {colStats.map(({c,q,s},i)=>{
                    const tv=s.combina+s.energia+s.novoCliente+s.alarme;
                    return(
                      <Card key={c} className="p-5">
                        <div className="flex items-center gap-4 mb-4">
                          <div className={`w-10 h-10 rounded-2xl flex items-center justify-center font-black text-sm shrink-0
                            ${i===0?"bg-black text-white":i===1?"bg-gray-700 text-white":i===2?"bg-gray-400 text-white":"bg-gray-100 text-gray-500"}`}>
                            {i+1}
                          </div>
                          <div className="flex-1">
                            <p className="font-black text-gray-900 text-sm">{c}</p>
                            <p className="text-xs text-gray-400 font-medium">{q.replace("Quiosque ","")}</p>
                          </div>
                          <div className="text-right">
                            <p className="font-black text-gray-900">{tv}</p>
                            <p className="text-[10px] text-gray-400 font-bold">vendas</p>
                          </div>
                        </div>
                        <StatRow label="Abordagens" value={s.total}/>
                        <StatRow label="Conversas" value={s.conversas}/>
                        <StatRow label="Leads" value={s.leads}/>
                        <div className="mt-3 flex items-center gap-3">
                          <span className="text-xs text-gray-400 font-medium shrink-0">Conversão</span>
                          <Bar value={tv} max={s.conversas||1}/>
                          <span className="text-xs font-black text-gray-900 shrink-0">{s.conversas>0?Math.round(tv/s.conversas*100):0}%</span>
                        </div>
                      </Card>
                    );
                  })}
                </div>}

                {/* LEADS */}
                {dashView==="leads"&&<div className="space-y-3">
                  <Card className="p-5 text-center">
                    <p className="text-5xl font-black text-gray-900">{as.leads}</p>
                    <p className="text-sm text-gray-400 font-medium mt-1">leads no período</p>
                  </Card>
                  {pr.filter(r=>r.lead).length===0
                    ?<Card className="p-10 text-center"><p className="text-gray-300 font-bold text-sm">Sem leads</p></Card>
                    :pr.filter(r=>r.lead).map(r=>(
                      <Card key={r.id} className="p-4">
                        <div className="flex justify-between items-start mb-2">
                          <p className="font-black text-gray-900 text-sm">{r.lead.nome}</p>
                          <p className="text-[11px] text-gray-400 font-medium shrink-0 ml-2">{fmtDate(r.ts)}</p>
                        </div>
                        {r.lead.tel&&<p className="text-sm text-gray-500 font-medium">{r.lead.tel}</p>}
                        {r.lead.obs&&<p className="text-xs text-gray-400 mt-1">{r.lead.obs}</p>}
                        <div className="flex gap-2 mt-2.5">
                          <PillBadge label={r.colaborador}/>
                          <PillBadge label={r.quiosque?.replace("Quiosque ","")} color="blue"/>
                        </div>
                      </Card>
                    ))
                  }
                  <button onClick={()=>exportCSV(pr.filter(r=>r.lead),`Leads_${dtag}.csv`)}
                    className="w-full py-4 rounded-2xl border border-gray-200 bg-white font-black text-sm text-gray-700 active:scale-95 transition-all">
                    Exportar leads
                  </button>
                </div>}

              </div>);
            })()}
          </div>
        )}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
